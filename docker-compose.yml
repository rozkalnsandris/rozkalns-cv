services:
  cv:
    image: nginx:1.31.4-alpine@sha256:db35bfc6b2951e7f8a72db5db120288c127ffaeeb4a6d4b95a26fead017d5913
    container_name: cv
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,nodev,size=16m
      - /var/run:rw,noexec,nosuid,nodev,size=1m
    mem_limit: 60m
    mem_reservation: 30m
    depends_on:
      - cvbot
    ports:
      - 127.0.0.1:8088:80
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      net.rozkalns.cv.nginx-config-sha256: "24a4b18221429dce78485d2ff4c8d65380cc94301c9409714dec882064dd74ff"
    networks:
      default:
        ipv4_address: 172.19.0.10
    logging: &default-logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  cvbot:
    image: rozkalns-cv-cvbot:${CVBOT_VCS_REF:-local}
    pull_policy: never
    build:
      context: ./bot
      args:
        APP_UID: "10001"
        APP_GID: "10001"
        VCS_REF: ${CVBOT_VCS_REF:-unresolved}
        BUILD_INPUT_SHA256: ${CVBOT_BUILD_INPUT_SHA256:-unresolved}
    container_name: cvbot
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    env_file:
      - ./bot/.env
    volumes:
      - ./bot/data:/app/data:rw
    expose:
      - "5000"
    mem_limit: 256m
    logging: *default-logging
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:5000/health/ready')
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  default:
    name: cv_default
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.19.0.0/16
          gateway: 172.19.0.1
