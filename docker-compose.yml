services:
  cv:
    image: nginx:alpine
    container_name: cv
    restart: unless-stopped
    mem_limit: 60m
    mem_reservation: 30m
    depends_on:
    - cvbot
    ports:
    - 8088:80
    volumes:
    - ./html:/usr/share/nginx/html:ro
    - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    logging: &id001
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  cvbot:
    build: ./bot
    container_name: cvbot
    restart: unless-stopped
    env_file:
    - ./bot/.env
    volumes:
    - ./bot/data:/app/data
    expose:
    - '5000'
    mem_limit: 256m
    logging: *id001
    healthcheck:
      test:
      - CMD
      - python3
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:5000/health')
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cv-cloudflared
    mem_limit: 80m
    mem_reservation: 40m
    environment:
    - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN:?set in cloudflared.env}
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    depends_on:
    - cv

networks:
  default:
    name: cv_default
    driver: bridge
    ipam:
      driver: default
      config:
      - subnet: 172.19.0.0/16
        gateway: 172.19.0.1
