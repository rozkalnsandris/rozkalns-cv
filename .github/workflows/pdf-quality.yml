name: PDF quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pdf-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact workflow SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" fetch --no-tags origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Install PDF inspection tools
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils
          command -v pdfinfo
          command -v pdftotext

      - name: Validate PDF source, semantics and accessibility
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/check-pdfs.py
          node --check scripts/generate-pdfs.mjs
          python3 scripts/check-pdfs.py
