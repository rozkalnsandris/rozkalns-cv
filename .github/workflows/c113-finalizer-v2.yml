name: C113 dedicated client secret finalizer v2

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: c113-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  finalize:
    if: >-
      github.repository == 'rozkalnsandris/rozkalns-cv' &&
      github.actor == 'rozkalnsandris' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/113-dedicated-client-secret'
    runs-on: ubuntu-24.04
    timeout-minutes: 18

    steps:
      - name: Check out exact PR head
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" fetch --no-tags origin "$EXPECTED_HEAD"
          git checkout -b fix/113-dedicated-client-secret "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Apply C113 source policy
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/c113-apply.py
          PYTHONPYCACHEPREFIX="${RUNNER_TEMP}/syntax-pycache" python3 -m py_compile bot/app.py bot/storage.py tests/test_client_key_secret.py
          bash -n runner/release/rozkalns-cv-deploy-main

      - name: Run focused regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          test_venv="${RUNNER_TEMP}/c113-test-venv"
          python3 -m venv "$test_venv"
          "$test_venv/bin/python" -m pip install --disable-pip-version-check --require-hashes --no-deps -r bot/requirements.lock
          export PYTHONPYCACHEPREFIX="${RUNNER_TEMP}/test-pycache"
          "$test_venv/bin/python" -m unittest \
            tests.test_client_key_secret \
            tests.test_storage \
            tests.test_bot \
            tests.test_bot_failures \
            tests.test_proxy_contract \
            tests.test_retention_policy \
            tests.test_deploy_contract \
            tests.test_current_contact_privacy
          bash scripts/validate-source.sh "$PWD"
          printf 'C113_FOCUSED_REGRESSION=PASS\n'

      - name: Self-clean temporary bootstrap
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/c113-finalizer-v2.yml scripts/c113-apply.py
          while IFS= read -r row; do
            path="${row:3}"
            path="${path##* -> }"
            case "$path" in
              .github/workflows/c113-finalizer-v2.yml|scripts/c113-apply.py|bot/app.py|bot/storage.py|bot/.env.example|runner/release/rozkalns-cv-deploy-main|docs/CVBOT_CLIENT_SECRET.md|tests/test_client_key_secret.py|tests/test_storage.py|tests/test_bot.py|tests/test_bot_failures.py|tests/test_deploy_contract.py) ;;
              *) printf 'C113_DIFF_SCOPE=FAIL path=%s\n' "$path" >&2; exit 1 ;;
            esac
          done < <(git status --porcelain=v1 -uall)
          printf 'C113_DIFF_SCOPE=PASS\n'

      - name: Commit and push bounded result
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git add -- \
            .github/workflows/c113-finalizer-v2.yml \
            scripts/c113-apply.py \
            bot/app.py bot/storage.py bot/.env.example \
            runner/release/rozkalns-cv-deploy-main \
            docs/CVBOT_CLIENT_SECRET.md \
            tests/test_client_key_secret.py tests/test_storage.py \
            tests/test_bot.py tests/test_bot_failures.py tests/test_deploy_contract.py
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'security(cvbot): require dedicated client pseudonym key (#113)'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" push origin HEAD:refs/heads/fix/113-dedicated-client-secret
          printf 'C113_FINALIZER=PASS\n'
