name: C2 production release gate

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/c2-production-gate.yml

permissions:
  actions: read
  contents: read

jobs:
  verify:
    if: github.repository == 'rozkalnsandris/rozkalns-cv'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Verify successful trusted deploy includes C2
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          C2_SHA: 493c01a3ab0818711ff929f6570b348bc79342a5
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request

          repo = os.environ['REPOSITORY']
          c2 = os.environ['C2_SHA']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'rozkalns-cv-c2-release-gate',
          }

          def get(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)

          api = f'https://api.github.com/repos/{repo}'
          main = str(get(f'{api}/branches/main')['commit']['sha'])
          comparison = get(f'{api}/compare/{c2}...{main}')
          if main != c2 and comparison.get('status') != 'ahead':
              raise SystemExit(
                  f'C2_NOT_ANCESTOR_OF_MAIN c2={c2} main={main}'
              )
          print(f'CURRENT_MAIN={main}')
          print(f'C2_ANCESTOR_OF_MAIN=PASS c2={c2}')

          ci_runs = get(
              f'{api}/actions/workflows/ci.yml/runs?event=push&status=completed&per_page=100'
          ).get('workflow_runs', [])
          successful_ci = {
              str(run.get('head_sha')): int(run['id'])
              for run in ci_runs
              if run.get('event') == 'push'
              and run.get('head_branch') == 'main'
              and run.get('conclusion') == 'success'
          }
          c2_ci = successful_ci.get(c2, 0)
          main_ci = successful_ci.get(main, 0)
          print(f'C2_MAIN_CI_SUCCESS={c2_ci}')
          print(f'CURRENT_MAIN_CI_SUCCESS={main_ci}')
          if not c2_ci or not main_ci:
              raise SystemExit('MAIN_CI_PROOF=FAIL')

          deploy_runs = get(
              f'{api}/actions/workflows/deploy-main.yml/runs?status=completed&per_page=100'
          ).get('workflow_runs', [])
          candidates = []
          required_steps = (
              'Verify installed deploy helper matches target source',
              'Deploy queued merge SHA',
              'Verify public frontend contracts',
              'Upload deploy evidence',
          )

          for run in deploy_runs:
              run_id = int(run['id'])
              conclusion = str(run.get('conclusion') or '')
              event = str(run.get('event') or '')
              deployed = str(run.get('head_sha') or '')
              if conclusion != 'success':
                  continue
              if event not in {'workflow_run', 'workflow_dispatch'}:
                  continue
              if not re.fullmatch(r'[0-9a-f]{40}', deployed):
                  continue

              jobs = get(
                  f'{api}/actions/runs/{run_id}/jobs?per_page=100'
              ).get('jobs', [])
              deploy_job = next(
                  (row for row in jobs if row.get('name') == 'Deploy on RPi5'),
                  None,
              )
              if not deploy_job or deploy_job.get('conclusion') != 'success':
                  continue
              steps = {
                  str(step.get('name')): str(step.get('conclusion'))
                  for step in deploy_job.get('steps', [])
              }
              if any(steps.get(name) != 'success' for name in required_steps):
                  continue

              artifacts = get(
                  f'{api}/actions/runs/{run_id}/artifacts?per_page=100'
              ).get('artifacts', [])
              artifact_name = f'rozkalns-cv-deploy-{deployed}-run-{run_id}'
              if not any(
                  str(row.get('name')) == artifact_name
                  and not row.get('expired')
                  for row in artifacts
              ):
                  continue

              ancestry = get(f'{api}/compare/{c2}...{deployed}')
              if deployed == c2 or ancestry.get('status') == 'ahead':
                  candidates.append(
                      (run_id, deployed, artifact_name, steps)
                  )

          if not candidates:
              raise SystemExit(
                  'C2_PRODUCTION_DEPLOY=FAIL no fully successful deploy at C2 or descendant'
              )

          run_id, deployed, artifact_name, steps = max(
              candidates,
              key=lambda row: row[0],
          )
          print(
              f'C2_PRODUCTION_DEPLOY=PASS run_id={run_id} '
              f'deployed_sha={deployed}'
          )
          for name in required_steps:
              print(f'DEPLOY_STEP name={name} conclusion={steps[name]}')
          print(f'DEPLOY_ARTIFACT={artifact_name}')
          print('PRODUCTION_GATE=PASS')
          PY
