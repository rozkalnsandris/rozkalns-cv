name: C2 production release gate

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/c2-production-gate.yml

permissions:
  actions: read
  contents: read

jobs:
  verify:
    if: github.repository == 'rozkalnsandris/rozkalns-cv'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Diagnose trusted main deploy history
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          C2_SHA: 493c01a3ab0818711ff929f6570b348bc79342a5
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request

          repo = os.environ['REPOSITORY']
          c2 = os.environ['C2_SHA']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'rozkalns-cv-c2-release-gate',
          }

          def get(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)

          api = f'https://api.github.com/repos/{repo}'
          main = get(f'{api}/branches/main')['commit']['sha']
          comparison = get(f'{api}/compare/{c2}...{main}')
          if main != c2 and comparison.get('status') != 'ahead':
              raise SystemExit(f'C2_NOT_ANCESTOR_OF_MAIN c2={c2} main={main}')
          print(f'CURRENT_MAIN={main}')
          print(f'C2_ANCESTOR_OF_MAIN=PASS c2={c2}')

          ci_runs = get(
              f'{api}/actions/workflows/ci.yml/runs?event=push&status=completed&per_page=100'
          ).get('workflow_runs', [])
          successful_ci = {
              str(run.get('head_sha')): int(run['id'])
              for run in ci_runs
              if run.get('event') == 'push'
              and run.get('head_branch') == 'main'
              and run.get('conclusion') == 'success'
          }
          print(f'C2_MAIN_CI_SUCCESS={successful_ci.get(c2, 0)}')
          print(f'CURRENT_MAIN_CI_SUCCESS={successful_ci.get(main, 0)}')

          deploy_runs = get(
              f'{api}/actions/workflows/deploy-main.yml/runs?status=completed&per_page=20'
          ).get('workflow_runs', [])
          candidates = []
          for run in deploy_runs[:12]:
              run_id = int(run['id'])
              conclusion = str(run.get('conclusion'))
              print(
                  f'DEPLOY_RUN id={run_id} conclusion={conclusion} '
                  f'event={run.get("event")} head_sha={run.get("head_sha")} '
                  f'created_at={run.get("created_at")}'
              )
              jobs = get(f'{api}/actions/runs/{run_id}/jobs?per_page=100').get('jobs', [])
              for job in jobs:
                  print(
                      f'  JOB name={job.get("name")} conclusion={job.get("conclusion")} '
                      f'status={job.get("status")}'
                  )
                  for step in job.get('steps', []):
                      print(
                          f'    STEP number={step.get("number")} name={step.get("name")} '
                          f'conclusion={step.get("conclusion")}'
                      )
              artifacts = get(f'{api}/actions/runs/{run_id}/artifacts?per_page=100').get('artifacts', [])
              for artifact in artifacts:
                  name = str(artifact.get('name') or '')
                  print(f'  ARTIFACT name={name}')
                  match = re.fullmatch(r'rozkalns-cv-deploy-([0-9a-f]{40})-run-(\d+)', name)
                  if conclusion != 'success' or not match or int(match.group(2)) != run_id:
                      continue
                  deployed = match.group(1)
                  ancestry = get(f'{api}/compare/{c2}...{deployed}')
                  if deployed == c2 or ancestry.get('status') == 'ahead':
                      candidates.append((run_id, deployed, name))

          if candidates:
              run_id, deployed, artifact_name = max(candidates)
              print(f'C2_PRODUCTION_DEPLOY=PASS run_id={run_id} deployed_sha={deployed}')
              print(f'DEPLOY_ARTIFACT={artifact_name}')
              print('PRODUCTION_GATE=PASS')
          else:
              print('C2_PRODUCTION_DEPLOY=FAIL no successful deploy artifact at C2 or descendant')
              raise SystemExit(1)
          PY
