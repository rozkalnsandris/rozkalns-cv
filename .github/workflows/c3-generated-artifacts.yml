name: C3 generated artifacts

on:
  push:
    branches:
      - refactor/75-unify-i18n-features-v01
    paths:
      - .github/workflows/c3-generated-artifacts.yml

permissions:
  contents: write

jobs:
  generate:
    if: github.repository == 'rozkalnsandris/rozkalns-cv' && github.ref == 'refs/heads/refactor/75-unify-i18n-features-v01'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out exact owner branch SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" fetch --no-tags origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Verify canonical content and accepted PDFs
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/build-content.py --check

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm

      - name: Regenerate and verify frontend dist
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:frontend
          npm run check:frontend
          node --test tests/frontend.test.mjs

      - name: Commit only generated frontend artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git add -A -- frontend-dist-manifest.json html/assets html/i18n html/index.html html/smarthome.html
          staged="$(git diff --cached --name-only)"
          test -n "$staged"
          printf '%s\n' "$staged"
          if grep -E '^html/.*\.pdf$' <<<"$staged"; then
            echo 'PDF files changed unexpectedly' >&2
            exit 1
          fi
          while IFS= read -r path; do
            case "$path" in
              frontend-dist-manifest.json|html/index.html|html/smarthome.html|html/assets/*|html/i18n/*) ;;
              *) echo "unexpected generated path: $path" >&2; exit 1 ;;
            esac
          done <<<"$staged"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: refresh final C3 frontend dist'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" push origin HEAD:refs/heads/refactor/75-unify-i18n-features-v01
