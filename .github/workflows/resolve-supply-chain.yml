name: Resolve supply-chain identities

on:
  pull_request:
    paths:
      - bot/requirements.in
      - .github/workflows/resolve-supply-chain.yml

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Resolve immutable identities
        shell: bash
        run: |
          set -Eeuo pipefail
          output_dir="${RUNNER_TEMP}/supply-chain-identities"
          install -d -m 0700 "$output_dir"
          identities="$output_dir/identities.txt"

          retry_capture() {
            local output_var="$1"
            shift
            local attempt value=''
            for attempt in 1 2 3 4; do
              if value="$($@ 2>&1)"; then
                printf -v "$output_var" '%s' "$value"
                return 0
              fi
              printf 'RETRY attempt=%s command=%q error=%q\n' \
                "$attempt" "$1" "$value" >&2
              sleep "$((attempt * 2))"
            done
            return 1
          }

          image_digest() {
            local ref="$1" output digest
            retry_capture output docker buildx imagetools inspect "$ref"
            digest="$(awk '$1 == "Digest:" {print $2; exit}' <<<"$output")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            printf '%s@%s\n' "$ref" "$digest"
          }

          github_json() {
            curl --fail --silent --show-error \
              --retry 4 --retry-all-errors --retry-delay 2 \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$1"
          }

          tag_commit() {
            local repo="$1" tag="$2" payload type sha
            payload="$(github_json \
              "https://api.github.com/repos/${repo}/git/ref/tags/${tag}")"
            type="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["type"])' <<<"$payload")"
            sha="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])' <<<"$payload")"
            if [[ "$type" == tag ]]; then
              payload="$(github_json \
                "https://api.github.com/repos/${repo}/git/tags/${sha}")"
              sha="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])' <<<"$payload")"
            fi
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
            printf '%s@%s # %s\n' "$repo" "$sha" "$tag"
          }

          {
            echo '===== IMAGE DIGESTS BEGIN ====='
            image_digest 'python:3.12.13-slim-bookworm'
            image_digest 'nginx:1.31.3-alpine'
            image_digest 'cloudflare/cloudflared:2026.7.3'
            echo '===== IMAGE DIGESTS END ====='
            echo '===== ACTION COMMITS BEGIN ====='
            tag_commit 'actions/checkout' 'v5'
            tag_commit 'actions/upload-artifact' 'v7.0.1'
            tag_commit 'gitleaks/gitleaks-action' 'v2.3.9'
            echo '===== ACTION COMMITS END ====='
          } | tee "$identities"

          resolver="${RUNNER_TEMP}/resolver"
          python3 -m venv "$resolver"
          "$resolver/bin/python" -m pip install \
            --disable-pip-version-check pip-tools==7.5.1
          "$resolver/bin/pip-compile" \
            --generate-hashes \
            --resolver=backtracking \
            --strip-extras \
            --output-file "$output_dir/requirements.lock" \
            bot/requirements.in

          sha256sum "$identities" "$output_dir/requirements.lock" \
            | tee "$output_dir/SHA256SUMS"

      - name: Upload resolved identities
        uses: actions/upload-artifact@65366950fc07fb20d47291c283b57548df326a8e # v7.0.1
        with:
          name: supply-chain-identities-${{ github.sha }}
          path: ${{ runner.temp }}/supply-chain-identities
          if-no-files-found: error
          retention-days: 1
