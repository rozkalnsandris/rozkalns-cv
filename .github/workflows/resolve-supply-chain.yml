name: Finalize supply-chain lock

on:
  push:
    branches:
      - fix/supply-chain-hardening-v01
    paths:
      - .github/workflows/resolve-supply-chain.yml

permissions:
  contents: write

concurrency:
  group: supply-chain-finalizer
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-slim
    timeout-minutes: 15

    steps:
      - name: Check out exact branch SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          git switch -c fix/supply-chain-hardening-v01

      - name: Resolve immutable image identities
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 0700 security
          python3 - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path
          import re
          import time
          import urllib.parse
          import urllib.request

          DIGEST = re.compile(r"^sha256:[0-9a-f]{64}$")
          ACCEPT = ", ".join(
              [
                  "application/vnd.oci.image.index.v1+json",
                  "application/vnd.docker.distribution.manifest.list.v2+json",
                  "application/vnd.oci.image.manifest.v1+json",
                  "application/vnd.docker.distribution.manifest.v2+json",
              ]
          )

          def open_with_retry(request: urllib.request.Request):
              error = None
              for attempt in range(1, 5):
                  try:
                      return urllib.request.urlopen(request, timeout=30)
                  except Exception as current:
                      error = current
                      if attempt < 4:
                          time.sleep(attempt * 2)
              raise RuntimeError(f"registry request failed: {error}")

          def resolve(repository: str, tag: str) -> str:
              query = urllib.parse.urlencode(
                  {
                      "service": "registry.docker.io",
                      "scope": f"repository:{repository}:pull",
                  }
              )
              token_request = urllib.request.Request(
                  f"https://auth.docker.io/token?{query}",
                  headers={"User-Agent": "rozkalns-cv-supply-chain/1"},
              )
              with open_with_retry(token_request) as response:
                  token = json.load(response)["token"]
              manifest_request = urllib.request.Request(
                  f"https://registry-1.docker.io/v2/{repository}/manifests/{tag}",
                  method="HEAD",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": ACCEPT,
                      "User-Agent": "rozkalns-cv-supply-chain/1",
                  },
              )
              with open_with_retry(manifest_request) as response:
                  digest = response.headers.get("Docker-Content-Digest", "")
              if not DIGEST.fullmatch(digest):
                  raise RuntimeError(f"invalid digest for {repository}:{tag}")
              return digest

          expected = {
              "python:3.12.13-slim-bookworm": "sha256:4766d8b510c428e595d74b9cc5bbb2fae8e26316fffb4adc89908d79aacd58a2",
              "nginx:1.31.3-alpine": "sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752",
              "cloudflare/cloudflared:2026.7.3": "sha256:e39ee8da81ad5e05d77f38d2f51c60ca51bf2a8450ac3abab50c17fdb91d91bf",
          }
          resolved = {
              "python:3.12.13-slim-bookworm": resolve(
                  "library/python", "3.12.13-slim-bookworm"
              ),
              "nginx:1.31.3-alpine": resolve("library/nginx", "1.31.3-alpine"),
              "cloudflare/cloudflared:2026.7.3": resolve(
                  "cloudflare/cloudflared", "2026.7.3"
              ),
              "aquasec/trivy:0.72.0": resolve("aquasec/trivy", "0.72.0"),
          }
          for reference, digest in expected.items():
              if resolved[reference] != digest:
                  raise RuntimeError(
                      f"published tag identity changed for {reference}: {resolved[reference]}"
                  )

          document = {
              "schema_version": 1,
              "images": resolved,
              "actions": {
                  "actions/upload-artifact@v7.0.1": "043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
                  "gitleaks/gitleaks-action@v3.0.0": "e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e",
              },
          }
          Path("security/supply-chain.json").write_text(
              json.dumps(document, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Resolve hash-locked dependencies and runtime migration
        shell: bash
        run: |
          set -Eeuo pipefail
          command -v python3 >/dev/null
          python3 -m pip --version
          resolver="${RUNNER_TEMP}/piptools"
          python3 -m pip install \
            --disable-pip-version-check \
            --no-compile \
            --target "$resolver" \
            pip-tools==7.5.1
          PYTHONPATH="$resolver" python3 -m piptools compile \
            --generate-hashes \
            --resolver=backtracking \
            --strip-extras \
            --output-file bot/requirements.lock \
            bot/requirements.in
          python3 -m pip install \
            --disable-pip-version-check \
            --dry-run \
            --require-hashes \
            --no-deps \
            -r bot/requirements.lock

          python3 - <<'PY'
          from pathlib import Path

          path = Path("runner/release/rozkalns-cv-deploy-main")
          text = path.read_text(encoding="utf-8")

          constants_old = """NETWORK_GATEWAY='172.19.0.1'
          BACKUP_RETENTION_COUNT=5
          """
          constants_new = """NETWORK_GATEWAY='172.19.0.1'
          CVBOT_UID=10001
          CVBOT_GID=10001
          BACKUP_RETENTION_COUNT=5
          """
          if "CVBOT_UID=10001" not in text:
              if text.count(constants_old) != 1:
                  raise SystemExit("runtime UID constants anchor mismatch")
              text = text.replace(constants_old, constants_new, 1)

          deploy_old = """deploy_runtime() {
              normalize_managed_permissions \"$RUNTIME\" || return 1
              validate_rendered_network \"$RUNTIME\" || return 1
          """
          deploy_new = """prepare_cvbot_data() {
              local data_dir=\"$RUNTIME/bot/data\"
              [[ -d \"$RUNTIME/bot\" && ! -L \"$RUNTIME/bot\" ]] || return 1
              if [[ -e \"$data_dir\" ]]; then
                  [[ -d \"$data_dir\" && ! -L \"$data_dir\" ]] || return 1
              else
                  install -d -o \"$CVBOT_UID\" -g \"$CVBOT_GID\" -m 0700 \"$data_dir\" \
                      || return 1
              fi
              if find \"$data_dir\" -type l -print -quit | grep -q .; then
                  return 1
              fi
              chown -R -- \"$CVBOT_UID:$CVBOT_GID\" \"$data_dir\" || return 1
              find \"$data_dir\" -type d -exec chmod 0700 {} + || return 1
              find \"$data_dir\" -type f -exec chmod 0600 {} + || return 1
          }

          deploy_runtime() {
              normalize_managed_permissions \"$RUNTIME\" || return 1
              prepare_cvbot_data || return 1
              validate_rendered_network \"$RUNTIME\" || return 1
          """
          if "prepare_cvbot_data || return 1" not in text:
              if text.count(deploy_old) != 1:
                  raise SystemExit("deploy runtime anchor mismatch")
              text = text.replace(deploy_old, deploy_new, 1)

          path.write_text(text, encoding="utf-8")
          PY

          bash -n runner/release/rozkalns-cv-deploy-main
          grep -Fq 'CVBOT_UID=10001' runner/release/rozkalns-cv-deploy-main
          grep -Fq 'prepare_cvbot_data || return 1' \
            runner/release/rozkalns-cv-deploy-main
          grep -Fq -- '--require-hashes' bot/Dockerfile
          grep -Fq 'python:3.12.13-slim-bookworm@sha256:' bot/Dockerfile
          rm -f \
            .github/workflows/resolve-supply-chain.yml \
            .github/workflows/apply-runtime-data-migration.yml

      - name: Commit authoritative generated files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            bot/requirements.lock \
            security/supply-chain.json \
            runner/release/rozkalns-cv-deploy-main \
            .github/workflows/resolve-supply-chain.yml \
            .github/workflows/apply-runtime-data-migration.yml
          git diff --cached --check
          git commit -m 'security: lock dependencies and runtime data ownership'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            push origin HEAD:fix/supply-chain-hardening-v01
