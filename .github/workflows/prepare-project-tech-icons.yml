name: One-shot project icon dist finalizer

on:
  push:
    branches:
      - fix/230-project-tech-icons

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact branch head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch --no-tags origin \
            refs/heads/fix/230-project-tech-icons \
            ed83a53a8222057c97eeba9f074a469fcd346fbd
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD^)" = "7c073a3a387fc4996d66320dbd0257ac3b719912"

      - name: Set up pinned Node.js frontend toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false

      - name: Normalize source and generate exact dist
        shell: bash
        run: |
          set -Eeuo pipefail
          base=ed83a53a8222057c97eeba9f074a469fcd346fbd

          git checkout "$base" -- \
            frontend/styles/index.css \
            tests/test_css_source_contract.py \
            package.json
          git rm -f \
            frontend/styles/features/tech-icons.css \
            scripts/dump-frontend-dist.mjs \
            .github/workflows/prepare-project-tech-icons.yml

          python3 - <<'PY'
          from pathlib import Path

          path = Path('frontend/styles/components.css')
          text = path.read_text(encoding='utf-8')
          needle = '.tech-tag::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; opacity: .8; }\n'
          addition = (
              '.tech-tag.has-tech-icon::before { display: none; }\n'
              '.tech-tag svg { width: 12px; height: 12px; flex: 0 0 12px; color: currentColor; opacity: .9; }\n'
          )
          if text.count(needle) != 1:
              raise SystemExit('tech-tag fallback rule changed unexpectedly')
          if addition.strip() not in text:
              text = text.replace(needle, needle + addition)
          path.write_text(text, encoding='utf-8')

          test = Path('tests/test_project_tech_icons.py')
          content = test.read_text(encoding='utf-8')
          content = content.replace(
              'styles = (ROOT / "frontend/styles/features/tech-icons.css").read_text(\n            encoding="utf-8"\n        )\n        style_index = (ROOT / "frontend/styles/index.css").read_text(encoding="utf-8")',
              'styles = (ROOT / "frontend/styles/components.css").read_text(encoding="utf-8")'
          )
          content = content.replace(
              '        self.assertIn(\'@import "./features/tech-icons.css";\', style_index)\n',
              ''
          )
          test.write_text(content, encoding='utf-8')
          PY

          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:frontend
          npm run check:frontend

          git diff --check
          git add -A
          git status --short
          test -z "$(git diff --cached --name-only | grep -E '^\.github/workflows/' || true)"
          test -z "$(git diff --cached --name-only | grep -E '^(package\.json|frontend/styles/index\.css|tests/test_css_source_contract\.py)$' || true)"

      - name: Commit exact generated result back to PR branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: finalize project technology icons'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            push origin HEAD:refs/heads/fix/230-project-tech-icons
