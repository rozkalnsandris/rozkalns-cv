name: C94 browser contract updater v2

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: c94-browser-contract-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  update:
    if: >-
      github.repository == 'rozkalnsandris/rozkalns-cv' &&
      github.actor == 'rozkalnsandris' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/94-public-email-verified-whatsapp-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out exact PR head
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch --no-tags origin "$EXPECTED_HEAD"
          git checkout -b fix/94-public-email-verified-whatsapp-v2 FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Patch and syntax-check browser contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/browser-smoke.mjs')
          text = path.read_text(encoding='utf-8')

          fixture_anchor = '          phone_uri: "+491234567890"\n'
          if text.count(fixture_anchor) != 1:
              raise SystemExit('browser fixture phone_uri anchor count is not one')
          text = text.replace(
              fixture_anchor,
              '          phone_uri: "+491234567890",\n'
              '          whatsapp_url: "https://wa.me/491234567890"\n',
              1,
          )

          turnstile_anchor = '''    await cdp.evaluate(`(() => {
      window.turnstile = {'''
          if text.count(turnstile_anchor) != 1:
              raise SystemExit('browser Turnstile anchor count is not one')
          preconditions = '''    assert.equal(
      await cdp.evaluate(`document.querySelector('#contactEmail')?.getAttribute('href')`),
      "mailto:andris@rozkalns.net"
    );
    assert.equal(
      await cdp.evaluate(`document.querySelector('#contactPhone')?.tagName`),
      "SPAN"
    );
'''
          text = text.replace(turnstile_anchor, preconditions + turnstile_anchor, 1)

          old_focus = '      "keyboard contact verification focus transfer"\n'
          if text.count(old_focus) != 1:
              raise SystemExit('browser contact focus label anchor count is not one')
          text = text.replace(
              old_focus,
              '      "keyboard phone verification focus transfer"\n',
              1,
          )

          old_href = '      "mailto:test@example.invalid"\n'
          if text.count(old_href) != 1:
              raise SystemExit('browser old contact href anchor count is not one')
          text = text.replace(old_href, '      "tel:+491234567890"\n', 1)

          path.write_text(text, encoding='utf-8')
          PY
          node --check tests/browser-smoke.mjs

      - name: Self-clean both temporary updaters and push
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f \
            .github/workflows/c94-browser-contract-fix.yml \
            .github/workflows/c94-browser-contract-fix-v2.yml
          changed="$(git status --porcelain=v1 -uall)"
          printf '%s\n' "$changed"
          test "$(printf '%s\n' "$changed" | grep -c '^ M tests/browser-smoke.mjs$')" -eq 1
          test "$(printf '%s\n' "$changed" | grep -c '^ D .github/workflows/c94-browser-contract-fix.yml$')" -eq 1
          test "$(printf '%s\n' "$changed" | grep -c '^ D .github/workflows/c94-browser-contract-fix-v2.yml$')" -eq 1
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: align browser contact focus with verified phone flow (#94)'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            push origin HEAD:refs/heads/fix/94-public-email-verified-whatsapp-v2
          printf 'C94_BROWSER_CONTRACT_V2=PASS\n'
