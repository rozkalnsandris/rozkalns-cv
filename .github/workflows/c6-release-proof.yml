name: C6 production release proof

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/c6-release-proof.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Verify exact C6 main CI and RPi5 deploy evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: 81a1cfcb63d53a7b05e1304907c1951495ca2d9b
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.parse
          import urllib.request

          repo = os.environ["REPOSITORY"]
          target = os.environ["TARGET_SHA"]
          if repo != "rozkalnsandris/rozkalns-cv":
              raise SystemExit("unexpected repository")
          if not re.fullmatch(r"[0-9a-f]{40}", target):
              raise SystemExit("invalid target SHA")

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "rozkalns-cv-c6-release-proof",
          }

          def get_json(url: str):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)

          api = f"https://api.github.com/repos/{repo}"
          main = get_json(f"{api}/branches/main")
          current_main = str(main.get("commit", {}).get("sha", ""))
          if not re.fullmatch(r"[0-9a-f]{40}", current_main):
              raise SystemExit("invalid current main SHA")
          if current_main != target:
              comparison = get_json(f"{api}/compare/{target}...{current_main}")
              if comparison.get("status") != "ahead":
                  raise SystemExit("C6 target is not an ancestor of current main")

          ci_runs = get_json(
              f"{api}/actions/workflows/ci.yml/runs?branch=main&status=completed&per_page=100"
          ).get("workflow_runs", [])
          ci_matches = [
              row for row in ci_runs
              if row.get("event") == "push"
              and row.get("head_branch") == "main"
              and row.get("head_sha") == target
              and row.get("conclusion") == "success"
          ]
          if not ci_matches:
              raise SystemExit("exact C6 main push CI is not successful yet")
          ci_run = max(ci_matches, key=lambda row: int(row["id"]))
          ci_run_id = int(ci_run["id"])

          deploy_runs = get_json(
              f"{api}/actions/workflows/deploy-main.yml/runs?status=completed&per_page=100"
          ).get("workflow_runs", [])
          deploy_match = None
          artifact_match = None
          for run in sorted(deploy_runs, key=lambda row: int(row["id"]), reverse=True):
              if run.get("conclusion") != "success":
                  continue
              run_id = int(run["id"])
              expected_name = f"rozkalns-cv-deploy-{target}-run-{run_id}"
              artifacts = get_json(
                  f"{api}/actions/runs/{run_id}/artifacts?per_page=100"
              ).get("artifacts", [])
              artifact = next(
                  (
                      row for row in artifacts
                      if row.get("name") == expected_name
                      and not row.get("expired", False)
                  ),
                  None,
              )
              if artifact is not None:
                  deploy_match = run
                  artifact_match = artifact
                  break

          if deploy_match is None or artifact_match is None:
              raise SystemExit("exact C6 RPi5 deploy evidence artifact is not available yet")

          deploy_run_id = int(deploy_match["id"])
          jobs = get_json(
              f"{api}/actions/runs/{deploy_run_id}/jobs?filter=latest&per_page=100"
          ).get("jobs", [])
          by_name = {str(job.get("name")): job for job in jobs}
          resolve = by_name.get("Resolve successful main CI")
          deploy = by_name.get("Deploy on RPi5")
          if not resolve or resolve.get("conclusion") != "success":
              raise SystemExit("deploy resolve job did not succeed")
          if not deploy or deploy.get("conclusion") != "success":
              raise SystemExit("RPi5 deploy job did not succeed")

          steps = {str(step.get("name")): step for step in deploy.get("steps", [])}
          required = [
              "Verify installed deploy helper matches target source",
              "Deploy queued merge SHA",
              "Verify public frontend contracts",
              "Upload deploy evidence",
          ]
          failed = [
              name for name in required
              if steps.get(name, {}).get("conclusion") != "success"
          ]
          if failed:
              raise SystemExit("required deploy steps not successful: " + ", ".join(failed))

          print(f"C6_TARGET_SHA={target}")
          print(f"C6_MAIN_CI_RUN_ID={ci_run_id}")
          print(f"C6_DEPLOY_RUN_ID={deploy_run_id}")
          print(f"C6_DEPLOY_ARTIFACT={artifact_match['name']}")
          print("C6_PRODUCTION_RELEASE_PROOF=PASS")
          PY
