name: C9 final browser proof

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/c9-final-browser-proof.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact PR SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" fetch --no-tags origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up pinned Node.js frontend toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false

      - name: Install locked frontend dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Extend smoke in workspace with explicit German switch
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/browser-smoke.mjs')
          source = path.read_text(encoding='utf-8')
          needle = '''    await cdp.evaluate(`document.querySelector('[data-lang="lv"]').click()`);\n'''
          if source.count(needle) != 1:
              raise SystemExit('expected Latvian switch anchor exactly once')
          german = '''    await cdp.evaluate(`document.querySelector('[data-lang="de"]').click()`);\n    await cdp.waitFor(\n      `document.documentElement.lang === "de" && document.querySelector('#pdfLink')?.getAttribute('href') === "/cv-de.pdf"`,\n      10_000,\n      "German language switch"\n    );\n    assert.equal(\n      await cdp.evaluate(`document.querySelector('[data-i18n="role"]').textContent`),\n      "Junior DevOps- & Linux-Engineer"\n    );\n    assert.deepEqual(\n      await cdp.evaluate(`[...document.querySelectorAll('.language-switcher [data-lang]')].map((button) => [button.dataset.lang, button.getAttribute('aria-pressed')])`),\n      [["en", "false"], ["de", "true"], ["lv", "false"]]\n    );\n\n'''
          path.write_text(source.replace(needle, german + needle), encoding='utf-8')
          PY
          git diff --check
          git diff -- tests/browser-smoke.mjs

      - name: Run real Chromium EN-DE-LV final smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          chrome_bin=''
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then
              chrome_bin="$(command -v "$candidate")"
              break
            fi
          done
          test -n "$chrome_bin"
          CHROME_BIN="$chrome_bin" node tests/browser-smoke.mjs
          printf 'C9_EN_DE_LV_BROWSER=PASS\n'
