name: Finalize canonical content

on:
  push:
    branches:
      - refactor/canonical-cv-content-v01
    paths:
      - .github/workflows/canonical-content-artifact.yml

permissions:
  contents: write

concurrency:
  group: canonical-content-finalizer
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out exact latest branch SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git switch -c refactor/canonical-cv-content-v01

      - name: Snapshot existing PDFs and generate canonical outputs
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/build-content.py --write --accept-pdfs
          python3 scripts/sync-system-prompt.py --write
          python3 scripts/build-content.py --check
          python3 scripts/sync-system-prompt.py --check
          rm -f .github/workflows/canonical-content-artifact.yml

      - name: Commit exact generated outputs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch --no-tags --depth=1 origin refactor/canonical-cv-content-v01
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            bot/app.py \
            bot/system_prompt.txt \
            content/pdf-manifest.json \
            html/i18n \
            html/assets \
            html/index.html \
            .github/workflows/ci.yml \
            tests/frontend.test.mjs \
            .github/workflows/canonical-content-artifact.yml
          git diff --cached --check
          git diff --cached --quiet && {
            echo 'No canonical output changes were generated.' >&2
            exit 1
          }
          git commit -m 'refactor: generate CV outputs from canonical content'
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            push origin HEAD:refactor/canonical-cv-content-v01
