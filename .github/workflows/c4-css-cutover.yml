name: C4 CSS source cutover

on:
  push:
    branches:
      - refactor/80-consolidate-css-v01
    paths:
      - .github/workflows/c4-css-cutover.yml

permissions:
  contents: write

jobs:
  cutover:
    if: github.repository == 'rozkalnsandris/rozkalns-cv' && github.ref == 'refs/heads/refactor/80-consolidate-css-v01'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out exact C4 branch SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" fetch --no-tags origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Apply fail-closed source cutover
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path_name: str, old: str, new: str) -> None:
              path = Path(path_name)
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'CUTOVER_ANCHOR_FAIL path={path_name} count={count} old={old!r}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          replace_once(
              'frontend/index.html',
              '  <link rel="stylesheet" href="./styles/main.css">\n  <link rel="stylesheet" href="./styles/extra.css">\n',
              '  <link rel="stylesheet" href="./styles/index.css">\n',
          )
          replace_once(
              'frontend/smarthome.html',
              '  <link rel="stylesheet" href="./styles/main.css">\n',
              '  <link rel="stylesheet" href="./styles/index.css">\n',
          )
          replace_once(
              'scripts/validate-source.sh',
              '    frontend/styles/main.css \\\n    frontend/styles/extra.css \\\n',
              '    frontend/styles/index.css \\\n    frontend/styles/tokens.css \\\n    frontend/styles/base.css \\\n    frontend/styles/layout.css \\\n    frontend/styles/components.css \\\n    frontend/styles/features/stats.css \\\n    frontend/styles/features/chat.css \\\n    frontend/styles/features/contact.css \\\n    frontend/styles/features/smarthome.css \\\n    frontend/styles/responsive.css \\\n    frontend/styles/print.css \\\n',
          )
          replace_once(
              'scripts/validate-source.sh',
              'for retired in update.sh update_cv-1.sh cloudflared.env.example; do',
              'for retired in update.sh update_cv-1.sh cloudflared.env.example frontend/styles/main.css frontend/styles/extra.css; do',
          )
          replace_once(
              'scripts/check-frontend-dist.mjs',
              '  "frontend/ui/icons.mjs"\n]) {',
              '  "frontend/ui/icons.mjs",\n  "frontend/styles/index.css",\n  "frontend/styles/tokens.css",\n  "frontend/styles/base.css",\n  "frontend/styles/layout.css",\n  "frontend/styles/components.css",\n  "frontend/styles/features/stats.css",\n  "frontend/styles/features/chat.css",\n  "frontend/styles/features/contact.css",\n  "frontend/styles/features/smarthome.css",\n  "frontend/styles/responsive.css",\n  "frontend/styles/print.css"\n]) {',
          )
          replace_once(
              'tests/test_contact_markup.py',
              '        self.assertIn(\'src="./enhancements.mjs"\', source)\n        self.assertIn(\'href="./styles/extra.css"\', source)\n',
              '        self.assertIn(\'src="./enhancements.mjs"\', source)\n        self.assertIn(\'href="./styles/index.css"\', source)\n        self.assertNotIn("styles/main.css", source)\n        self.assertNotIn("styles/extra.css", source)\n',
          )
          replace_once(
              'tests/test_contact_markup.py',
              '        css = (ROOT / "frontend" / "styles" / "extra.css").read_text(\n            encoding="utf-8"\n        )\n        self.assertIn(".skill-chip::before { content: none; }", css)\n        self.assertIn(".skill-chip svg", css)\n',
              '        css = (ROOT / "frontend" / "styles" / "components.css").read_text(\n            encoding="utf-8"\n        )\n        self.assertNotIn(".skill-chip::before", css)\n        self.assertIn(".skill-chip svg", css)\n',
          )
          replace_once(
              'tests/test_frontend_contract.py',
              'SOURCE_CSS = ROOT / "frontend" / "styles" / "main.css"\n',
              'SOURCE_LAYOUT = ROOT / "frontend" / "styles" / "layout.css"\nSOURCE_RESPONSIVE = ROOT / "frontend" / "styles" / "responsive.css"\n',
          )
          replace_once(
              'tests/test_frontend_contract.py',
              '        css = SOURCE_CSS.read_text(encoding="utf-8")\n',
              '        layout = SOURCE_LAYOUT.read_text(encoding="utf-8")\n        responsive = SOURCE_RESPONSIVE.read_text(encoding="utf-8")\n',
          )
          replace_once(
              'tests/test_frontend_contract.py',
              '        self.assertIn(\'@media (max-width: 760px)\', css)\n        self.assertNotIn(\'@media (max-width: 850px)\', css)\n        self.assertIn(\'grid-template-columns: 340px minmax(0,1fr)\', css)\n',
              '        self.assertIn(\'@media (max-width: 760px)\', responsive)\n        self.assertNotIn(\'@media (max-width: 850px)\', responsive)\n        self.assertIn(\'grid-template-columns: 340px minmax(0,1fr)\', layout)\n',
          )
          Path('frontend/styles/main.css').unlink()
          Path('frontend/styles/extra.css').unlink()
          print('C4_SOURCE_CUTOVER=PASS')
          PY

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm

      - name: Rebuild and validate cutover
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:frontend
          npm run check:frontend
          node --test tests/frontend.test.mjs
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Commit source and generated C4 cutover
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git add -A -- frontend html frontend-dist-manifest.json scripts tests
          staged="$(git diff --cached --name-only)"
          test -n "$staged"
          printf '%s\n' "$staged"
          if grep -E '^html/.*\.pdf$' <<<"$staged"; then
            echo 'PDF files changed unexpectedly' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: cut over to modular CSS source graph'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" push origin HEAD:refs/heads/refactor/80-consolidate-css-v01
