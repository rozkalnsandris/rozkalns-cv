name: UI v3 closeout test fixer

on:
  push:
    branches:
      - test/ui-v3-closeout-254

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact branch head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" fetch --no-tags origin "$GITHUB_SHA"
          git checkout -B test/ui-v3-closeout-254 FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Make Smart Home locale prerequisite explicit
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/browser-smoke.mjs')
          text = path.read_text(encoding='utf-8')
          marker = '    await cdp.navigate(`${baseUrl}/smarthome.html`);\n'
          if text.count(marker) != 1:
              raise SystemExit('Smart Home navigation anchor mismatch')
          replacement = '''    await cdp.navigate(`${baseUrl}/lv/`);\n    await cdp.waitFor(\n      `document.readyState === "complete" && document.documentElement.lang === "lv" && document.querySelector('#profileLocation')?.textContent === "Dortmund, Vācija"`,\n      10_000,\n      "Latvian restoration before Smart Home"\n    );\n\n    await cdp.navigate(`${baseUrl}/smarthome.html`);\n'''
          path.write_text(text.replace(marker, replacement, 1), encoding='utf-8')
          PY
          node --check tests/browser-smoke.mjs
          git diff --check -- tests/browser-smoke.mjs

      - name: Commit test fix
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- tests/browser-smoke.mjs
          git diff --cached --check
          git commit -m 'test: make Smart Home locale setup explicit'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" push origin HEAD:refs/heads/test/ui-v3-closeout-254
