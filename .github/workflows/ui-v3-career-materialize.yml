name: UI v3 career materializer

on:
  push:
    branches:
      - feat/ui-v3-career-254

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" fetch --no-tags origin "$GITHUB_SHA"
          git checkout -B feat/ui-v3-career-254 FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Apply expertise and experience source contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          index = Path('frontend/index.html')
          text = index.read_text(encoding='utf-8')
          project_open = '      <section id="projects">'
          if text.count(project_open) != 1:
              raise SystemExit('projects section anchor mismatch')
          text = text.replace(project_open, '      <div class="work-layout">\n' + project_open, 1)

          exp_start = text.index('      <section id="experience">')
          stats_start = text.index('      <section id="stats">', exp_start)
          experience = text[exp_start:stats_start]
          if experience.count('<div class="timeline">') != 1:
              raise SystemExit('experience timeline anchor mismatch')
          if experience.count('<article class="entry">') != 4:
              raise SystemExit('expected four experience entries')
          experience = experience.replace('<div class="timeline">', '<ol class="timeline">', 1)
          experience = experience.replace('<article class="entry">', '<li class="entry">')
          experience = experience.replace('</article>', '</li>')
          close = '        </div>\n      </section>\n\n'
          if not experience.endswith(close):
              raise SystemExit('experience closing boundary mismatch')
          experience = experience[:-len(close)] + '        </ol>\n      </section>\n      </div>\n\n'
          text = text[:exp_start] + experience + text[stats_start:]
          index.write_text(text, encoding='utf-8')

          layout = Path('frontend/styles/layout.css')
          layout_text = layout.read_text(encoding='utf-8')
          anchor = '#about { padding-block: 2px; padding-inline: 4px; }'
          if anchor not in layout_text:
              raise SystemExit('layout insertion anchor missing')
          layout_text = layout_text.replace(
              anchor,
              anchor + '\n.work-layout { min-width: 0; display: grid; gap: clamp(24px,4vw,42px); }',
              1,
          )
          layout.write_text(layout_text, encoding='utf-8')

          css = Path('frontend/styles/components.css')
          styles = css.read_text(encoding='utf-8')
          timeline_start = styles.index('.timeline { gap: 14px; }')
          timeline_end = styles.index('\n.project-list {', timeline_start)
          timeline_css = (
              '.timeline { margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--border); }\n'
              '.entry { display: grid; grid-template-columns: 1fr; gap: 5px; padding: 14px 0; border-bottom: 1px solid var(--border); }\n'
              '.entry time { color: var(--text-faint); font: 700 10.5px/1.4 var(--sans); letter-spacing: .035em; }\n'
              '.entry h3 { margin: 0; color: var(--text); font-size: 16px; line-height: 1.3; }\n'
              '.org { margin-top: 2px; color: var(--accent-strong); font: 750 12px/1.4 var(--sans); }\n'
              '.entry ul { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 7px 0 0; padding: 0; list-style: none; }\n'
              '.entry li { position: relative; padding-inline-start: 11px; color: var(--text-dim); font-size: 12.5px; line-height: 1.5; }\n'
              '.entry li::before { content: ""; position: absolute; inset-inline-start: 0; top: .62em; width: 4px; height: 4px; border-radius: 50%; background: var(--accent); opacity: .5; }'
          )
          styles = styles[:timeline_start] + timeline_css + styles[timeline_end:]

          skill_start = styles.index('.skill-list { margin: 0; gap: 12px; }')
          skill_end = styles.index('\n.education-list {', skill_start)
          skill_css = (
              '.skill-list { margin: 0; gap: 0; border-top: 1px solid var(--border); }\n'
              '.skill-row { display: grid; grid-template-columns: 1fr; gap: 7px; padding: 13px 0; border-bottom: 1px solid var(--border); }\n'
              '.skill-row dt { color: var(--accent-strong); font: 800 10.5px/1.4 var(--sans); letter-spacing: .08em; text-transform: uppercase; }\n'
              '.skill-row dd { margin: 0; }\n'
              '.skill-chips { display: flex; flex-wrap: wrap; gap: 6px 12px; }\n'
              '.skill-chip { display: inline-flex; align-items: center; gap: 5px; min-height: 0; padding: 0; border: 0; border-radius: 0; background: transparent; color: var(--text-dim); font-size: 12.5px; line-height: 1.5; }\n'
              '.skill-chip svg { width: 13px; height: 13px; flex: 0 0 13px; color: var(--accent); opacity: .9; }\n'
              '.skill-chip:hover { color: var(--text); }'
          )
          styles = styles[:skill_start] + skill_css + styles[skill_end:]
          css.write_text(styles, encoding='utf-8')

          responsive = Path('frontend/styles/responsive.css')
          r = responsive.read_text(encoding='utf-8')
          stale_rules = (
              '  .skill-row { grid-template-columns: 145px minmax(0,1fr); gap: 18px; }\n',
              '  .entry { grid-template-columns: 145px minmax(0,1fr); gap: 18px; }\n',
              '  .skill-list { grid-template-columns: repeat(2,minmax(0,1fr)); }\n',
              '  .skill-row { grid-template-columns: 1fr; align-content: start; padding: 20px; }\n',
              '  .timeline { gap: 16px; }\n',
              '  .entry { grid-template-columns: 160px minmax(0,1fr); padding: 22px; }\n',
          )
          for stale in stale_rules:
              if stale not in r:
                  raise SystemExit(f'missing stale responsive rule: {stale!r}')
              r = r.replace(stale, '', 1)
          desktop_anchor = '  #projects .section-heading, #skills .section-heading, #experience .section-heading { margin-block-end: 24px; }\n'
          if desktop_anchor not in r:
              raise SystemExit('desktop insertion anchor missing')
          r = r.replace(
              desktop_anchor,
              desktop_anchor + '  .work-layout { grid-template-columns: minmax(0,1.55fr) minmax(280px,.78fr); grid-template-areas: "projects skills" "projects experience"; gap: 34px clamp(30px,4vw,52px); align-items: start; }\n  #projects { grid-area: projects; }\n  #skills { grid-area: skills; }\n  #experience { grid-area: experience; }\n  #skills .section-heading, #experience .section-heading { margin-block-end: 14px; }\n',
              1,
          )
          responsive.write_text(r, encoding='utf-8')

          tests = Path('tests/test_frontend_contract.py')
          t = tests.read_text(encoding='utf-8')
          anchor = "        self.assertGreaterEqual(html.count('class=\"skill-chip\"'), 20)\n"
          if anchor not in t:
              raise SystemExit('frontend contract anchor missing')
          addition = anchor + (
              "        self.assertIn('class=\"work-layout\"', html)\n"
              "        self.assertIn('<ol class=\"timeline\">', html)\n"
              "        self.assertEqual(html.count('class=\"entry\"'), 4)\n"
              "        self.assertEqual(html.count('class=\"skill-row\"'), 4)\n"
              "        self.assertLess(html.index('id=\"projects\"'), html.index('id=\"skills\"'))\n"
              "        self.assertLess(html.index('id=\"skills\"'), html.index('id=\"experience\"'))\n"
              "        self.assertLess(html.index('id=\"experience\"'), html.index('id=\"stats\"'))\n"
              "        self.assertIn('grid-template-areas: \"projects skills\" \"projects experience\";', responsive)\n"
          )
          t = t.replace(anchor, addition, 1)
          tests.write_text(t, encoding='utf-8')
          PY
          git diff --check -- frontend/index.html frontend/styles/layout.css frontend/styles/components.css frontend/styles/responsive.css tests/test_frontend_contract.py

      - name: Set up pinned Node.js frontend toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          package-manager-cache: false
          check-latest: false

      - name: Build deterministic frontend
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:frontend
          npm run check:frontend
          python3 tests/test_frontend_contract.py
          python3 tests/test_html_semantics.py
          python3 tests/test_project_tech_icons.py
          git diff --check

      - name: Commit career slice
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- frontend/index.html frontend/styles/layout.css frontend/styles/components.css frontend/styles/responsive.css tests/test_frontend_contract.py frontend-dist-manifest.json html
          git diff --cached --check
          git commit -m 'feat: compact expertise and experience'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" push origin HEAD:refs/heads/feat/ui-v3-career-254
