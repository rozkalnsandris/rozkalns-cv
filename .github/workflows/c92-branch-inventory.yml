name: C92 public branch inventory

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: c92-branch-inventory-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  inventory:
    if: >-
      github.repository == 'rozkalnsandris/rozkalns-cv' &&
      github.actor == 'rozkalnsandris' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'audit/92-branch-hygiene-v01'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out exact audit head with complete refs
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch --no-tags origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            "$EXPECTED_HEAD"
          git checkout -b audit/92-branch-hygiene-v01 "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git rev-parse --verify refs/remotes/origin/main >/dev/null

      - name: Generate branch classification from Git and PR history
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          from datetime import datetime, timezone
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import urllib.request

          repo = os.environ['REPOSITORY']
          token = os.environ['GH_TOKEN']
          now = datetime.now(timezone.utc)
          audit_branch = 'audit/92-branch-hygiene-v01'

          def git(*args: str, check: bool = True) -> str:
              result = subprocess.run(
                  ['git', *args], text=True, capture_output=True, check=False
              )
              if check and result.returncode != 0:
                  raise SystemExit(
                      f"git command failed ({' '.join(args)}): {result.stderr.strip()}"
                  )
              return result.stdout.strip()

          def api(path: str):
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/{path}',
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'rozkalns-cv-c92-audit',
                  },
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)

          pulls = []
          page = 1
          while True:
              batch = api(f'pulls?state=all&per_page=100&page={page}&sort=updated&direction=desc')
              pulls.extend(batch)
              if len(batch) < 100:
                  break
              page += 1
              if page > 10:
                  raise SystemExit('unexpected PR pagination depth')

          pulls_by_head: dict[str, list[dict]] = {}
          for pr in pulls:
              head = pr.get('head', {}).get('ref')
              if head:
                  pulls_by_head.setdefault(head, []).append(pr)
          for values in pulls_by_head.values():
              values.sort(key=lambda row: int(row['number']), reverse=True)

          refs = git(
              'for-each-ref',
              '--format=%(refname:short)',
              'refs/remotes/origin',
          ).splitlines()
          branches = sorted(
              ref.removeprefix('origin/')
              for ref in refs
              if ref.startswith('origin/')
              and ref != 'origin/main'
              and ref != 'origin/HEAD'
          )

          main_sha = git('rev-parse', 'refs/remotes/origin/main')
          rows = []
          counts: dict[str, int] = {}

          temporary_prefixes = (
              'audit/', 'test/', 'chore/', 'release/', 'docs/'
          )
          sensitive_prefixes = (
              '.github/', 'runner/', 'bot/', 'scripts/'
          )
          sensitive_exact = {
              'docker-compose.yml', 'nginx.conf', 'bot/.env.example'
          }

          for branch in branches:
              ref = f'refs/remotes/origin/{branch}'
              tip = git('rev-parse', ref)
              tip_iso = git('show', '-s', '--format=%cI', tip)
              tip_dt = datetime.fromisoformat(tip_iso.replace('Z', '+00:00'))
              age_days = max(0, (now - tip_dt).days)
              ahead = int(git('rev-list', '--count', f'refs/remotes/origin/main..{ref}'))
              behind = int(git('rev-list', '--count', f'{ref}..refs/remotes/origin/main'))
              ancestor = subprocess.run(
                  ['git', 'merge-base', '--is-ancestor', tip, 'refs/remotes/origin/main'],
                  check=False,
              ).returncode == 0

              branch_prs = pulls_by_head.get(branch, [])
              open_prs = [pr for pr in branch_prs if pr.get('state') == 'open']
              latest = branch_prs[0] if branch_prs else None
              latest_pr = f"#{latest['number']}" if latest else '—'
              latest_pr_state = '—'
              replacement = '—'
              if latest:
                  if latest.get('merged_at'):
                      latest_pr_state = 'merged'
                  else:
                      latest_pr_state = str(latest.get('state', 'unknown'))
                  body = latest.get('body') or ''
                  match = re.search(r'(?i)supersed(?:e|ed)\s+by\s+(?:PR\s*)?#(\d+)', body)
                  if match:
                      replacement = f"#{match.group(1)}"

              grep = subprocess.run(
                  ['git', 'grep', '-l', '-F', '--', branch, 'refs/remotes/origin/main'],
                  text=True,
                  capture_output=True,
                  check=False,
              )
              reference_paths = []
              if grep.returncode == 0:
                  for line in grep.stdout.splitlines():
                      path = line.split(':', 1)[-1]
                      if path != 'docs/BRANCH_HYGIENE_AUDIT.md':
                          reference_paths.append(path)
              reference_paths = sorted(set(reference_paths))

              unique_paths = []
              elevated_paths = []
              if ahead:
                  merge_base = git('merge-base', 'refs/remotes/origin/main', ref)
                  unique_paths = git(
                      'diff', '--name-only', f'{merge_base}..{ref}'
                  ).splitlines()
                  elevated_paths = sorted(
                      path for path in unique_paths
                      if path.startswith(sensitive_prefixes)
                      or path in sensitive_exact
                  )

              if open_prs:
                  classification = 'active/open-PR'
                  decision = 'preserve'
              elif ancestor or (latest and latest.get('merged_at')):
                  classification = 'merged/completed'
                  decision = 'delete-candidate' if not reference_paths else 'preserve-reference'
              elif latest and latest.get('state') == 'closed':
                  classification = 'closed/superseded'
                  if replacement != '—' and not reference_paths:
                      decision = 'delete-candidate'
                  else:
                      decision = 'review-before-delete'
              elif branch.startswith(temporary_prefixes):
                  classification = 'temporary/test'
                  decision = 'delete-candidate' if ahead == 0 and not reference_paths else 'review-before-delete'
              else:
                  classification = 'unique historical/recovery'
                  decision = 'preserve-review'

              if open_prs:
                  risk = 'active'
              elif ahead == 0:
                  risk = 'low'
              elif elevated_paths:
                  risk = 'elevated-public-review'
              else:
                  risk = 'unique-history-review'

              counts[classification] = counts.get(classification, 0) + 1
              rows.append(
                  {
                      'branch': branch,
                      'tip': tip,
                      'tip_date': tip_dt.date().isoformat(),
                      'age_days': age_days,
                      'ahead': ahead,
                      'behind': behind,
                      'ancestor': ancestor,
                      'latest_pr': latest_pr,
                      'pr_state': latest_pr_state,
                      'replacement': replacement,
                      'classification': classification,
                      'decision': decision,
                      'risk': risk,
                      'references': reference_paths,
                      'elevated_paths': elevated_paths,
                  }
              )

          delete_candidates = [row for row in rows if row['decision'] == 'delete-candidate']
          preserve = [row for row in rows if row['decision'].startswith('preserve')]
          review = [row for row in rows if row['decision'] == 'review-before-delete']

          out = []
          out.append('# Public branch hygiene audit — issue #92')
          out.append('')
          out.append(f'- Generated: `{now.isoformat(timespec="seconds")}`')
          out.append(f'- Audited `main`: `{main_sha}`')
          out.append(f'- Total remote branches at audit time: **{len(branches) + 1}**')
          out.append(f'- Non-main branches classified: **{len(branches)}**')
          out.append(f'- Delete candidates: **{len(delete_candidates)}**')
          out.append(f'- Preserve / active / explicit-review: **{len(preserve)}**')
          out.append(f'- Additional review before deletion: **{len(review)}**')
          out.append('')
          out.append('The issue baseline of 47 non-main branches is stale; this audit intentionally uses the live remote-ref snapshot. Classification is read-only. **No branch deletion is authorized by this document.**')
          out.append('')
          out.append('## Classification rules')
          out.append('')
          out.append('- `active/open-PR`: at least one currently open PR uses the branch as its head; preserve.')
          out.append('- `merged/completed`: branch tip is already reachable from current `main`, or its latest PR is merged; candidate only when current `main` does not reference the branch by name.')
          out.append('- `closed/superseded`: latest PR is closed unmerged; automatic delete-candidate status requires explicit `superseded by #N` proof in that PR body and no current-main reference.')
          out.append('- `temporary/test`: audit/test/chore/release/docs branch without an open PR; unique history or references force manual review.')
          out.append('- `unique historical/recovery`: unique unmerged history without sufficient replacement proof; preserve pending explicit archive/delete decision.')
          out.append('- `elevated-public-review`: unique commits touch automation/runtime-sensitive paths such as `.github/`, `runner/`, `bot/`, `scripts/`, Compose or Nginx. This is a review flag, not evidence of a secret finding.')
          out.append('')
          out.append('## Inventory')
          out.append('')
          out.append('| Branch | Tip | Date | Age d | A/B | Main ancestor | PR | PR state | Replacement | Class | Decision | Risk | Main refs |')
          out.append('|---|---|---:|---:|---:|:---:|---:|---|---|---|---|---|---|')
          for row in rows:
              refs_text = '<br>'.join(f'`{path}`' for path in row['references'][:4]) or '—'
              if len(row['references']) > 4:
                  refs_text += f"<br>+{len(row['references']) - 4} more"
              out.append(
                  '| `{branch}` | `{tip}` | {tip_date} | {age_days} | {ahead}/{behind} | {ancestor} | {latest_pr} | {pr_state} | {replacement} | {classification} | **{decision}** | {risk} | {refs} |'.format(
                      branch=row['branch'],
                      tip=row['tip'][:12],
                      tip_date=row['tip_date'],
                      age_days=row['age_days'],
                      ahead=row['ahead'],
                      behind=row['behind'],
                      ancestor='yes' if row['ancestor'] else 'no',
                      latest_pr=row['latest_pr'],
                      pr_state=row['pr_state'],
                      replacement=row['replacement'],
                      classification=row['classification'],
                      decision=row['decision'],
                      risk=row['risk'],
                      refs=refs_text,
                  )
              )

          out.append('')
          out.append('## Owner-approval deletion candidate set')
          out.append('')
          if delete_candidates:
              for row in delete_candidates:
                  out.append(
                      f"- [ ] `{row['branch']}` — `{row['tip']}` — {row['classification']} — PR {row['latest_pr']} ({row['pr_state']})"
                  )
          else:
              out.append('- None under the conservative automatic-proof rules.')
          out.append('')
          out.append('**Safety gate:** re-run the inventory immediately before any deletion. Delete only branches still in the owner-approved candidate set, using normal branch deletion. Never force-move a branch ref as a substitute for deletion.')
          out.append('')
          out.append('## Unique/elevated branches requiring explicit review')
          out.append('')
          elevated = [row for row in rows if row['risk'] == 'elevated-public-review']
          if elevated:
              for row in elevated:
                  paths = ', '.join(f'`{path}`' for path in row['elevated_paths'][:8])
                  if len(row['elevated_paths']) > 8:
                      paths += f", +{len(row['elevated_paths']) - 8} more"
                  out.append(f"- `{row['branch']}` — {row['decision']} — sensitive-surface paths: {paths}")
          else:
              out.append('- None.')

          Path('docs/BRANCH_HYGIENE_AUDIT.md').write_text('\n'.join(out) + '\n', encoding='utf-8')
          Path('/tmp/c92-counts.json').write_text(json.dumps({
              'main_sha': main_sha,
              'non_main': len(branches),
              'delete_candidates': len(delete_candidates),
              'counts': counts,
          }, sort_keys=True), encoding='utf-8')
          print(Path('/tmp/c92-counts.json').read_text(encoding='utf-8'))
          print('C92_BRANCH_INVENTORY=PASS')
          PY

      - name: Validate audit evidence and self-clean
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s docs/BRANCH_HYGIENE_AUDIT.md
          grep -Fq 'Classification is read-only' docs/BRANCH_HYGIENE_AUDIT.md
          grep -Fq 'Safety gate:' docs/BRANCH_HYGIENE_AUDIT.md
          grep -Fq '`audit/92-branch-hygiene-v01`' docs/BRANCH_HYGIENE_AUDIT.md
          rm -f .github/workflows/c92-branch-inventory.yml
          changed="$(git status --porcelain=v1 -uall)"
          printf '%s\n' "$changed"
          while IFS= read -r row; do
            path="${row:3}"
            path="${path##* -> }"
            case "$path" in
              .github/workflows/c92-branch-inventory.yml|docs/BRANCH_HYGIENE_AUDIT.md) ;;
              *) printf 'C92_SCOPE=FAIL path=%s\n' "$path" >&2; exit 1 ;;
            esac
          done <<< "$changed"
          printf 'C92_SCOPE=PASS\n'

      - name: Commit generated audit only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git add -- .github/workflows/c92-branch-inventory.yml docs/BRANCH_HYGIENE_AUDIT.md
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: inventory public branches for owner-approved pruning (#92)'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            push origin HEAD:refs/heads/audit/92-branch-hygiene-v01
          printf 'C92_AUDIT_PUBLISH=PASS\n'
