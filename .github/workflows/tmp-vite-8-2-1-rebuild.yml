name: Temporary controlled Vite 8.2.1 rebuild

on:
  push:
    branches:
      - chore/vite-8.2.1-controlled

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact branch head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" fetch --no-tags origin "refs/heads/${GITHUB_REF_NAME}"
          git checkout -B "$GITHUB_REF_NAME" FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up pinned Node.js frontend toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false

      - name: Update Vite and rebuild deterministic frontend
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --save-dev --save-exact vite@8.2.1 --ignore-scripts --no-audit --no-fund
          rm -rf node_modules
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:frontend
          first="${RUNNER_TEMP}/frontend-first.sha256"
          second="${RUNNER_TEMP}/frontend-second.sha256"
          {
            find html/assets html/i18n -type f -print0
            printf '%s\0' html/index.html html/smarthome.html html/en/index.html html/de/index.html html/lv/index.html frontend-dist-manifest.json
          } | sort -z | xargs -0 sha256sum > "$first"
          npm run build:frontend
          {
            find html/assets html/i18n -type f -print0
            printf '%s\0' html/index.html html/smarthome.html html/en/index.html html/de/index.html html/lv/index.html frontend-dist-manifest.json
          } | sort -z | xargs -0 sha256sum > "$second"
          cmp "$first" "$second"
          npm run check:frontend
          test "$(node -p "require('./package.json').devDependencies.vite")" = '8.2.1'

      - name: Commit only controlled dependency and generated-output changes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          allowed='^(package\.json|package-lock\.json|frontend-dist-manifest\.json|html/(assets|i18n)/|html/(index|smarthome)\.html|html/(en|de|lv)/index\.html)'
          unexpected="$(git status --porcelain | sed -E 's/^.. //' | grep -Ev "$allowed" || true)"
          test -z "$unexpected" || { printf 'Unexpected changed paths:\n%s\n' "$unexpected" >&2; exit 1; }
          git add -- package.json package-lock.json frontend-dist-manifest.json html/assets html/i18n html/index.html html/smarthome.html html/en/index.html html/de/index.html html/lv/index.html
          git diff --cached --quiet && { echo 'No controlled changes to commit'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: update Vite to 8.2.1 and rebuild frontend'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" push origin "HEAD:${GITHUB_REF_NAME}"
