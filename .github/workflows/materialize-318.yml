name: Materialize 318

on:
  push:
    branches:
      - fix/cvbot-318-provider-capacity

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize focused change
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git branch --show-current)" = "fix/cvbot-318-provider-capacity"
          sed -i '$d' scripts/materialize-318.py
          python3 scripts/materialize-318.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/test_provider_capacity.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('from pathlib import Path\n', 'import importlib.util\nfrom pathlib import Path\n', 1)
          text = text.replace('from app import close_app_services, create_app  # noqa: E402\n', '')
          anchor = 'from provider_capacity import ProviderStreamCapacity  # noqa: E402\n\n\n'
          injected = '''from provider_capacity import ProviderStreamCapacity  # noqa: E402\n\nAPP_SPEC = importlib.util.spec_from_file_location("cv_app_capacity_test", BOT / "app.py")\nif APP_SPEC is None or APP_SPEC.loader is None:\n    raise RuntimeError("could not load app.py")\nAPP = importlib.util.module_from_spec(APP_SPEC)\nAPP_SPEC.loader.exec_module(APP)\n\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit('provider capacity import anchor mismatch')
          text = text.replace(anchor, injected, 1)
          text = text.replace('        flask_app = create_app(\n', '        flask_app = APP.create_app(\n')
          text = text.replace('        self.addCleanup(close_app_services, flask_app)\n', '        self.addCleanup(APP.close_app_services, flask_app)\n')
          path.write_text(text, encoding='utf-8')
          PY
          python3 -m py_compile bot/app.py bot/config.py bot/provider_capacity.py tests/test_provider_capacity.py tests/test_settings.py

      - name: Run focused regression tests
        shell: bash
        run: |
          set -Eeuo pipefail
          venv="${RUNNER_TEMP}/phase318-venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install --disable-pip-version-check --require-hashes --no-deps -r bot/requirements.lock
          "$venv/bin/python" -m unittest discover -s tests -p 'test_provider_capacity.py' -v
          "$venv/bin/python" -m unittest discover -s tests -p 'test_settings.py' -v
          PYTHONPYCACHEPREFIX="${RUNNER_TEMP}/phase318-pycache" bash scripts/validate-source.sh "$PWD"

      - name: Commit materialized source only
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f scripts/materialize-318.py .github/workflows/materialize-318.yml
          git config user.name "Andris Rozkalns"
          git config user.email "277435981+rozkalnsandris@users.noreply.github.com"
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m "fix: bound concurrent provider streams (#318)"
          git push origin HEAD:fix/cvbot-318-provider-capacity
