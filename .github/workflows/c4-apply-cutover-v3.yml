name: C4 apply CSS cutover v3

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/c4-apply-cutover-v3.yml

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.repository == 'rozkalnsandris/rozkalns-cv' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'refactor/80-consolidate-css-v01'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out exact C4 branch head
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" fetch --no-tags origin "$HEAD_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"

      - name: Apply fail-closed source cutover
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/c4-cutover.py
          python3 -m unittest \
            tests.test_css_source_contract \
            tests.test_contact_markup \
            tests.test_frontend_contract -v

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm

      - name: Rebuild twice and validate frontend cutover
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:frontend
          cp -a html "${RUNNER_TEMP}/c4-first-html"
          cp frontend-dist-manifest.json "${RUNNER_TEMP}/c4-first-manifest.json"
          npm run build:frontend
          diff -ruN "${RUNNER_TEMP}/c4-first-html" html
          cmp "${RUNNER_TEMP}/c4-first-manifest.json" frontend-dist-manifest.json
          npm run check:frontend
          node --test tests/frontend.test.mjs
          python3 -m unittest \
            tests.test_css_source_contract \
            tests.test_contact_markup \
            tests.test_frontend_contract \
            tests.test_html_semantics -v

      - name: Commit source and generated cutover
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git add -A -- \
            frontend \
            html \
            frontend-dist-manifest.json \
            scripts/check-frontend-dist.mjs \
            scripts/validate-source.sh \
            tests/test_contact_markup.py \
            tests/test_frontend_contract.py
          staged="$(git diff --cached --name-only)"
          test -n "$staged"
          printf '%s\n' "$staged"
          if grep -E '^html/.*\.pdf$' <<<"$staged"; then
            echo 'PDF files changed unexpectedly' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: cut over to modular CSS source graph'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            push origin HEAD:refs/heads/refactor/80-consolidate-css-v01
