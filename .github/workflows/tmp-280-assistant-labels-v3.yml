name: Temporary assistant label rebuild v3

on:
  push:
    branches:
      - fix/280-responsive-cv-assistant-labels

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact branch head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" fetch --no-tags origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Apply responsive i18n launcher change
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement target, found {count}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          replace_once(
              "frontend/styles/responsive.css",
              '  .chat-launcher { right: 18px; bottom: 18px; width: 52px; min-width: 52px; height: 52px; padding: 0; font-size: 0; }\n  .chat-launcher::before { content: "AI"; font-size: 12px; line-height: 52px; }\n',
              '  .chat-launcher { right: 18px; bottom: 18px; }\n',
          )

          app = Path("frontend/app.mjs")
          text = app.read_text(encoding="utf-8")
          marker = 'export function installPreloadErrorRecovery(windowLike = globalThis.window) {'
          addition = '''export function updateChatLauncherLabel({ messages }, {\n  documentLike = globalThis.document,\n  viewportWidth = globalThis.innerWidth\n} = {}) {\n  const launcher = documentLike?.querySelector?.("#chatLauncher");\n  const width = Number(viewportWidth);\n  if (!launcher || !Number.isFinite(width)) return false;\n  const key = width >= 720 && width < 1560 ? "chat_title" : "chat_open";\n  const label = messages?.[key];\n  if (typeof label !== "string" || !label.trim()) return false;\n  launcher.textContent = label;\n  return true;\n}\n\n'''
          if text.count(marker) != 1:
              raise SystemExit("app insertion marker mismatch")
          app.write_text(text.replace(marker, addition + marker), encoding="utf-8")

          replace_once(
              "frontend/app.mjs",
              '    onApplied: updateMainDocumentTitle,\n',
              '    onApplied(state) {\n      updateMainDocumentTitle(state);\n      updateChatLauncherLabel(state);\n    },\n',
          )
          replace_once(
              "frontend/app.mjs",
              '  installLazyChat(languageController);\n  createNavigationObserver();\n',
              '  installLazyChat(languageController);\n  window.addEventListener("resize", () => updateChatLauncherLabel(\n    { messages: languageController.messages },\n    { viewportWidth: window.innerWidth }\n  ), { passive: true });\n  createNavigationObserver();\n',
          )

          replace_once(
              "tests/test_css_source_contract.py",
              '        self.assertIn(".chat-launcher { right: 18px; bottom: 18px; width: 52px;", responsive)\n        self.assertIn(\'.chat-launcher::before { content: "AI";\', responsive)\n',
              '        self.assertIn(".chat-launcher { right: 18px; bottom: 18px; }", responsive)\n        self.assertNotIn(\'content: "AI"\', responsive)\n',
          )

          replace_once(
              "tests/frontend.test.mjs",
              'import { installPreloadErrorRecovery, updateMainDocumentTitle } from "../frontend/app.mjs";\n',
              'import { installPreloadErrorRecovery, updateChatLauncherLabel, updateMainDocumentTitle } from "../frontend/app.mjs";\n',
          )
          tests = Path("tests/frontend.test.mjs")
          text = tests.read_text(encoding="utf-8")
          marker = 'test("shared locale core preserves cvlang preference and fallback semantics", () => {'
          addition = '''test("chat launcher uses descriptive responsive translated labels", () => {\n  const launcher = { textContent: "" };\n  const documentLike = { querySelector: (selector) => selector === "#chatLauncher" ? launcher : null };\n  const messages = { chat_open: "Ask the CV assistant", chat_title: "CV assistant" };\n\n  assert.equal(updateChatLauncherLabel({ messages }, { documentLike, viewportWidth: 639 }), true);\n  assert.equal(launcher.textContent, "Ask the CV assistant");\n  updateChatLauncherLabel({ messages }, { documentLike, viewportWidth: 720 });\n  assert.equal(launcher.textContent, "CV assistant");\n  updateChatLauncherLabel({ messages }, { documentLike, viewportWidth: 1559 });\n  assert.equal(launcher.textContent, "CV assistant");\n  updateChatLauncherLabel({ messages }, { documentLike, viewportWidth: 1560 });\n  assert.equal(launcher.textContent, "Ask the CV assistant");\n  assert.equal(updateChatLauncherLabel({ messages }, { documentLike: {}, viewportWidth: 900 }), false);\n});\n\n'''
          if text.count(marker) != 1:
              raise SystemExit("frontend test insertion marker mismatch")
          tests.write_text(text.replace(marker, addition + marker), encoding="utf-8")
          PY
          python3 -m unittest tests.test_css_source_contract

      - name: Set up pinned Node.js frontend toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false

      - name: Validate and rebuild deterministic frontend
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          node --check frontend/app.mjs
          node --test tests/frontend.test.mjs
          npm run build:frontend
          first="${RUNNER_TEMP}/first.sha256"
          second="${RUNNER_TEMP}/second.sha256"
          {
            find html/assets html/i18n -type f -print0
            printf '%s\0' html/index.html html/smarthome.html html/en/index.html html/de/index.html html/lv/index.html frontend-dist-manifest.json
          } | sort -z | xargs -0 sha256sum > "$first"
          npm run build:frontend
          {
            find html/assets html/i18n -type f -print0
            printf '%s\0' html/index.html html/smarthome.html html/en/index.html html/de/index.html html/lv/index.html frontend-dist-manifest.json
          } | sort -z | xargs -0 sha256sum > "$second"
          cmp "$first" "$second"
          npm run check:frontend

      - name: Commit only focused source and generated output
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import subprocess
          allowed = {
              "frontend/app.mjs", "frontend/styles/responsive.css",
              "tests/test_css_source_contract.py", "tests/frontend.test.mjs",
              "frontend-dist-manifest.json", "html/index.html", "html/smarthome.html",
              "html/en/index.html", "html/de/index.html", "html/lv/index.html",
          }
          lines = subprocess.check_output(["git", "status", "--porcelain"], text=True).splitlines()
          paths = {line[3:] for line in lines}
          unexpected = {p for p in paths if p not in allowed and not p.startswith("html/assets/") and not p.startswith("html/i18n/")}
          if unexpected:
              raise SystemExit(f"unexpected changed paths: {sorted(unexpected)}")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- frontend/app.mjs frontend/styles/responsive.css tests/test_css_source_contract.py tests/frontend.test.mjs frontend-dist-manifest.json html/assets html/i18n html/index.html html/smarthome.html html/en/index.html html/de/index.html html/lv/index.html
          git diff --cached --quiet && { echo 'no changes to commit'; exit 1; }
          git commit -m 'fix: restore descriptive CV assistant launcher labels'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" push origin HEAD:refs/heads/fix/280-responsive-cv-assistant-labels
