name: Gate C0 baseline freeze

on:
  pull_request:
    paths:
      - .github/workflows/gate-c0-baseline.yml
      - tools/c0-browser-baseline.mjs

permissions:
  actions: read
  contents: read

jobs:
  baseline:
    if: github.event.pull_request.head.ref == 'audit/gate-c0-baseline-70'
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out exact PR test revision with full main history
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*'
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch --no-tags origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse --is-shallow-repository)" = false

      - name: Resolve exact current main and require green push CI
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail
          baseline_sha="$(git rev-parse refs/remotes/origin/main)"
          [[ "$baseline_sha" =~ ^[0-9a-f]{40}$ ]]
          out="${RUNNER_TEMP}/gate-c0-${baseline_sha}"
          src="${RUNNER_TEMP}/gate-c0-source-${baseline_sha}"
          install -d -m 0700 "$out"
          git worktree add --detach "$src" "$baseline_sha"
          BASELINE_SHA="$baseline_sha" OUT="$out" python3 - <<'PY'
          import json, os, pathlib, time, urllib.parse, urllib.request
          repo=os.environ["REPOSITORY"]
          sha=os.environ["BASELINE_SHA"]
          out=pathlib.Path(os.environ["OUT"])
          headers={
              "Accept":"application/vnd.github+json",
              "Authorization":f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version":"2022-11-28",
              "User-Agent":"rozkalns-cv-gate-c0",
          }
          url=(
              f"https://api.github.com/repos/{repo}/actions/workflows/ci.yml/runs"
              f"?branch=main&head_sha={urllib.parse.quote(sha,safe='')}&status=completed&per_page=100"
          )
          chosen=None
          for _ in range(20):
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=20) as response:
                  data=json.load(response)
              good=[
                  row for row in data.get("workflow_runs",[])
                  if row.get("event")=="push"
                  and row.get("head_branch")=="main"
                  and row.get("head_sha")==sha
                  and row.get("conclusion")=="success"
              ]
              if good:
                  chosen=max(good,key=lambda row:int(row["id"]))
                  break
              time.sleep(6)
          if not chosen:
              raise SystemExit(f"no successful main push CI for {sha}")
          safe={key:chosen.get(key) for key in (
              "id","html_url","head_sha","event","head_branch","status","conclusion","created_at","updated_at"
          )}
          (out/"main-ci.json").write_text(json.dumps(safe,indent=2)+"\n",encoding="utf-8")
          PY
          echo "sha=$baseline_sha" >> "$GITHUB_OUTPUT"
          echo "out=$out" >> "$GITHUB_OUTPUT"
          echo "src=$src" >> "$GITHUB_OUTPUT"
          printf 'C0_BASELINE_SHA=%s\n' "$baseline_sha"

      - name: Record built HTML CSS JS and i18n identities
        env:
          SRC: ${{ steps.baseline.outputs.src }}
          OUT: ${{ steps.baseline.outputs.out }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          src=pathlib.Path(os.environ["SRC"])
          rows=[]
          for path in sorted((src/"html").rglob("*")):
              if not path.is_file():
                  continue
              rel=path.relative_to(src).as_posix()
              ext=path.suffix.lower()
              if ext not in {".html",".css",".mjs",".js"} and not (
                  ext==".json" and "/i18n/" in f"/{rel}"
              ):
                  continue
              body=path.read_bytes()
              rows.append({
                  "path":rel,
                  "bytes":len(body),
                  "sha256":hashlib.sha256(body).hexdigest(),
              })
          if not any(row["path"]=="html/index.html" for row in rows):
              raise SystemExit("index.html missing")
          pathlib.Path(os.environ["OUT"],"static-inventory.json").write_text(
              json.dumps(rows,indent=2)+"\n",encoding="utf-8"
          )
          PY

      - name: Capture allowlisted public headers and safe API behavior
        env:
          OUT: ${{ steps.baseline.outputs.out }}
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 0700 "$OUT/headers"
          mapfile -t paths < <(python3 - <<'PY'
          import json, os, pathlib, re
          rows=json.loads(pathlib.Path(os.environ["OUT"],"static-inventory.json").read_text())
          def pick(pattern):
              for row in rows:
                  if re.search(pattern,row["path"]):
                      return "/"+row["path"].removeprefix("html/")
              return None
          values=[
              "/",
              "/smarthome.html",
              pick(r"html/assets/.+\.[0-9a-f]{12}\.css$"),
              pick(r"html/assets/app\.[0-9a-f]{12}\.mjs$"),
          ]
          values += [
              "/"+row["path"].removeprefix("html/")
              for row in rows
              if re.search(r"html/i18n/.+\.[0-9a-f]{12}\.json$",row["path"])
          ][:3]
          values += ["/stats.json","/cv.pdf","/cv-lv.pdf"]
          print("\n".join(value for value in values if value))
          PY
          )
          : > "$OUT/public-http.tsv"
          for path in "${paths[@]}"; do
            name="$(printf '%s' "$path" | sed 's#^/$#root#; s#^/##; s#[/?&=]#_#g')"
            raw="$(mktemp)"
            curl --silent --show-error --location --max-time 20 \
              --dump-header "$raw" --output /dev/null \
              "https://rozkalns.net${path}" || true
            awk 'BEGIN{IGNORECASE=1} /^(HTTP\/|Age:|Cache-Control:|Content-Encoding:|Content-Length:|Content-Security-Policy:|Content-Type:|ETag:|Expires:|Last-Modified:|Permissions-Policy:|Referrer-Policy:|Server:|Vary:|X-Content-Type-Options:|X-Frame-Options:|CF-Cache-Status:)/ {sub(/\r$/,""); print}' \
              "$raw" > "$OUT/headers/${name}.txt"
            status="$(awk '/^HTTP\//{code=$2} END{print code}' "$raw")"
            test -n "$status" || status=000
            printf 'GET\t%s\t%s\n' "$path" "$status" >> "$OUT/public-http.tsv"
            rm -f "$raw"
          done

          capture_safe_json() {
            local path="$1" output="$2" mode="$3" body status
            body="$(mktemp)"
            status="$(curl --silent --show-error --max-time 20 \
              --output "$body" --write-out '%{http_code}' \
              "https://rozkalns.net${path}" || printf '000')"
            printf 'GET\t%s\t%s\n' "$path" "$status" >> "$OUT/public-http.tsv"
            STATUS="$status" BODY="$body" MODE="$mode" OUTPUT="$output" python3 - <<'PY'
          import json, os, pathlib
          status=os.environ["STATUS"]
          target=pathlib.Path(os.environ["OUTPUT"])
          if not status.startswith("2"):
              target.write_text(json.dumps({"status":status,"body_saved":False},indent=2)+"\n",encoding="utf-8")
              raise SystemExit(0)
          try:
              data=json.loads(pathlib.Path(os.environ["BODY"]).read_text(encoding="utf-8"))
          except Exception:
              target.write_text(json.dumps({"status":status,"valid_json":False},indent=2)+"\n",encoding="utf-8")
              raise SystemExit(0)
          if os.environ["MODE"]=="health":
              safe={"status":status,"ok":data.get("ok"),"storage":data.get("storage")}
          else:
              safe={"status":status,"configured":data.get("configured"),"sitekey_present":bool(data.get("sitekey"))}
          target.write_text(json.dumps(safe,indent=2)+"\n",encoding="utf-8")
          PY
            rm -f "$body"
          }
          capture_safe_json /api/health "$OUT/api-health.json" health
          capture_safe_json /api/contact-config "$OUT/api-contact-config.json" contact

          for path in /api/chat /api/contact-reveal; do
            status="$(curl --silent --show-error --max-time 20 \
              --output /dev/null --write-out '%{http_code}' \
              "https://rozkalns.net${path}" || printf '000')"
            printf 'GET\t%s\t%s\n' "$path" "$status" >> "$OUT/public-http.tsv"
          done
          printf 'C0_PUBLIC_EDGE_CAPTURE=PASS\n'
          cat "$OUT/public-http.tsv"

      - name: Capture real Chrome cold warm coverage keyboard and screenshots
        env:
          OUT: ${{ steps.baseline.outputs.out }}
          BASELINE_SHA: ${{ steps.baseline.outputs.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          chrome=''
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then
              chrome="$(command -v "$candidate")"
              break
            fi
          done
          test -n "$chrome"
          node --check tools/c0-browser-baseline.mjs
          node tools/c0-browser-baseline.mjs \
            --output "$OUT" \
            --url https://rozkalns.net \
            --chrome "$chrome" \
            --sha "$BASELINE_SHA"

      - name: Capture pinned Lighthouse mobile and desktop snapshots
        env:
          OUT: ${{ steps.baseline.outputs.out }}
          npm_config_audit: 'false'
          npm_config_fund: 'false'
          npm_config_ignore_scripts: 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          chrome=''
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then
              chrome="$(command -v "$candidate")"
              break
            fi
          done
          test -n "$chrome"
          export CHROME_PATH="$chrome"
          npm view lighthouse@13.4.1 version dist.integrity --json > "$OUT/lighthouse-package.json"
          npx --yes lighthouse@13.4.1 https://rozkalns.net/ \
            --quiet \
            --output=json \
            --output-path="$OUT/lighthouse-phone.json" \
            --only-categories=performance,accessibility,best-practices,seo \
            --chrome-flags='--headless=new --no-sandbox --disable-dev-shm-usage'
          npx --yes lighthouse@13.4.1 https://rozkalns.net/ \
            --quiet \
            --preset=desktop \
            --output=json \
            --output-path="$OUT/lighthouse-desktop.json" \
            --only-categories=performance,accessibility,best-practices,seo \
            --chrome-flags='--headless=new --no-sandbox --disable-dev-shm-usage'

      - name: Write comparison summary and enforce artifact privacy
        env:
          OUT: ${{ steps.baseline.outputs.out }}
          BASELINE_SHA: ${{ steps.baseline.outputs.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os, pathlib
          out=pathlib.Path(os.environ["OUT"])
          browser=json.loads((out/"browser-baseline.json").read_text())
          inventory=json.loads((out/"static-inventory.json").read_text())
          def lighthouse(name):
              data=json.loads((out/f"lighthouse-{name}.json").read_text())
              categories=data["categories"]
              audits=data["audits"]
              return {
                  "performance":round(categories["performance"]["score"]*100),
                  "accessibility":round(categories["accessibility"]["score"]*100),
                  "best_practices":round(categories["best-practices"]["score"]*100),
                  "seo":round(categories["seo"]["score"]*100),
                  "fcp_ms":audits["first-contentful-paint"]["numericValue"],
                  "lcp_ms":audits["largest-contentful-paint"]["numericValue"],
                  "cls":audits["cumulative-layout-shift"]["numericValue"],
                  "tbt_ms":audits["total-blocking-time"]["numericValue"],
                  "transfer_bytes":audits["total-byte-weight"]["numericValue"],
              }
          phone=lighthouse("phone")
          desktop=lighthouse("desktop")
          lines=[
              "# Gate C0 before-state",
              "",
              f"- baseline main: `{os.environ['BASELINE_SHA']}`",
              "- production writes: **none**",
              "- origin-only headers: **gap recorded; access controls were not weakened**",
              "- contact/chat production POSTs in interaction flow: **blocked locally by Chrome**",
              "",
              "## Static identity",
              "",
              "| files | total bytes |",
              "|---:|---:|",
              f"| {len(inventory)} | {sum(row['bytes'] for row in inventory)} |",
              "",
              "## Browser network",
              "",
              "| viewport | cold bytes | warm bytes | warm cache hits |",
              "|---|---:|---:|---:|",
              f"| desktop | {browser['desktop']['cold']['network']['transferredBytes']} | {browser['desktop']['warm']['network']['transferredBytes']} | {browser['desktop']['warm']['network']['cacheHits']} |",
              f"| phone | {browser['phone']['cold']['network']['transferredBytes']} | {browser['phone']['warm']['network']['transferredBytes']} | {browser['phone']['warm']['network']['cacheHits']} |",
              "",
              "## Lighthouse 13.4.1",
              "",
              "| viewport | perf | a11y | best practices | SEO | FCP ms | LCP ms | CLS | TBT ms | bytes |",
              "|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|",
              f"| phone | {phone['performance']} | {phone['accessibility']} | {phone['best_practices']} | {phone['seo']} | {phone['fcp_ms']:.0f} | {phone['lcp_ms']:.0f} | {phone['cls']:.4f} | {phone['tbt_ms']:.0f} | {phone['transfer_bytes']:.0f} |",
              f"| desktop | {desktop['performance']} | {desktop['accessibility']} | {desktop['best_practices']} | {desktop['seo']} | {desktop['fcp_ms']:.0f} | {desktop['lcp_ms']:.0f} | {desktop['cls']:.4f} | {desktop['tbt_ms']:.0f} | {desktop['transfer_bytes']:.0f} |",
              "",
              "## Keyboard / interaction",
              "",
              f"- skip link first Tab: **{'PASS' if browser['desktop']['keyboard']['skipFirst'] else 'FAIL'}**",
              f"- EN/DE/LV in Tab flow: **{'PASS' if browser['desktop']['keyboard']['langButtons'] else 'FAIL'}**",
              f"- keyboard language switch: **{'PASS' if browser['desktop']['keyboard']['langSwitch'] else 'FAIL'}**",
              f"- keyboard nav activation: **{'PASS' if browser['desktop']['keyboard']['nav'] else 'FAIL'}**",
              f"- contact verification UI entered: **{'PASS' if (browser['desktop']['keyboard']['contact']['mount'] or browser['desktop']['keyboard']['contact']['status']) else 'OBSERVED'}**",
              f"- chat send blocked locally + Escape focus return: **{'PASS' if browser['desktop']['keyboard']['chatBlocked'] and browser['desktop']['keyboard']['chatFocusReturn'] else 'FAIL'}**",
              "",
              "## Evidence files",
              "",
              "- `static-inventory.json`: byte sizes + SHA-256 for built HTML/CSS/JS/i18n",
              "- `headers/` + `public-http.tsv`: allowlisted public response contracts",
              "- `browser-baseline.json`: cold/warm request waterfalls, transfer bytes, synthetic metrics, Chrome JS/CSS coverage, keyboard flow",
              "- `screenshot-desktop.png`, `screenshot-phone.png`: visual baseline",
              "- `lighthouse-phone.json`, `lighthouse-desktop.json`: reproducible Lighthouse snapshots",
              "- `main-ci.json`: successful push CI identity for exact baseline SHA",
              "- `ORIGIN_EVIDENCE_GAP.txt`: explicit least-privilege origin gap",
              "",
          ]
          (out/"SUMMARY.md").write_text("\n".join(lines),encoding="utf-8")
          (out/"ORIGIN_EVIDENCE_GAP.txt").write_text(
              "Origin-only response headers were not collected because this GitHub-hosted evidence job has no approved read-only host path. Gate C0 requires recording this gap rather than weakening access controls.\n",
              encoding="utf-8",
          )
          PY
          if grep -REn '"(email|phone|phone_uri|token|cookie)"[[:space:]]*:' \
            "$OUT/browser-baseline.json" "$OUT/api-contact-config.json"; then
            echo 'privacy-sensitive key found in sanitized artifacts' >&2
            exit 1
          fi
          cat "$OUT/SUMMARY.md" >> "$GITHUB_STEP_SUMMARY"
          printf 'C0_PRIVACY_ARTIFACT_GATE=PASS\n'

      - name: Upload Gate C0 evidence
        if: always() && steps.baseline.outputs.out != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-c0-${{ steps.baseline.outputs.sha }}-run-${{ github.run_id }}
          path: ${{ steps.baseline.outputs.out }}
          if-no-files-found: error
          retention-days: 90
