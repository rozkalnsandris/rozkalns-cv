name: Gate C0 baseline freeze

on:
  pull_request:
    paths:
      - .github/workflows/gate-c0-baseline.yml
      - tools/c0-browser-baseline.mjs

permissions:
  actions: read
  contents: read

jobs:
  baseline:
    if: github.event.pull_request.head.ref == 'audit/gate-c0-baseline-70'
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out exact PR test revision with full main history
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*'
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch --no-tags origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse --is-shallow-repository)" = false

      - name: Resolve exact current main and require green push CI
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail
          baseline_sha="$(git rev-parse refs/remotes/origin/main)"
          [[ "$baseline_sha" =~ ^[0-9a-f]{40}$ ]]
          out="${RUNNER_TEMP}/gate-c0-${baseline_sha}"
          src="${RUNNER_TEMP}/gate-c0-source-${baseline_sha}"
          install -d -m 0700 "$out"
          git worktree add --detach "$src" "$baseline_sha"
          BASELINE_SHA="$baseline_sha" OUT="$out" python3 - <<'PY'
          import json, os, pathlib, time, urllib.parse, urllib.request
          repo=os.environ['REPOSITORY']; sha=os.environ['BASELINE_SHA']; out=pathlib.Path(os.environ['OUT'])
          headers={'Accept':'application/vnd.github+json','Authorization':f"Bearer {os.environ['GH_TOKEN']}",'X-GitHub-Api-Version':'2022-11-28','User-Agent':'rozkalns-cv-gate-c0'}
          url=f"https://api.github.com/repos/{repo}/actions/workflows/ci.yml/runs?branch=main&head_sha={urllib.parse.quote(sha,safe='')}&status=completed&per_page=100"
          chosen=None
          for _ in range(20):
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=20) as r: data=json.load(r)
              good=[x for x in data.get('workflow_runs',[]) if x.get('event')=='push' and x.get('head_branch')=='main' and x.get('head_sha')==sha and x.get('conclusion')=='success']
              if good: chosen=max(good,key=lambda x:int(x['id'])); break
              time.sleep(6)
          if not chosen: raise SystemExit(f'no successful main push CI for {sha}')
          safe={k:chosen.get(k) for k in ('id','html_url','head_sha','event','head_branch','status','conclusion','created_at','updated_at')}
          (out/'main-ci.json').write_text(json.dumps(safe,indent=2)+'\n',encoding='utf-8')
          PY
          echo "sha=$baseline_sha" >> "$GITHUB_OUTPUT"
          echo "out=$out" >> "$GITHUB_OUTPUT"
          echo "src=$src" >> "$GITHUB_OUTPUT"
          printf 'C0_BASELINE_SHA=%s\n' "$baseline_sha"

      - name: Record built HTML CSS JS and i18n identities
        env:
          SRC: ${{ steps.baseline.outputs.src }}
          OUT: ${{ steps.baseline.outputs.out }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          src=pathlib.Path(os.environ['SRC']); rows=[]
          for p in sorted((src/'html').rglob('*')):
              if not p.is_file(): continue
              rel=p.relative_to(src).as_posix(); ext=p.suffix.lower()
              if ext not in {'.html','.css','.mjs','.js'} and not (ext=='.json' and '/i18n/' in f'/{rel}'):
                  continue
              body=p.read_bytes(); rows.append({'path':rel,'bytes':len(body),'sha256':hashlib.sha256(body).hexdigest()})
          if not any(x['path']=='html/index.html' for x in rows): raise SystemExit('index.html missing')
          pathlib.Path(os.environ['OUT'],'static-inventory.json').write_text(json.dumps(rows,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Capture allowlisted public headers and safe API behavior
        env:
          OUT: ${{ steps.baseline.outputs.out }}
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 0700 "$OUT/headers"
          mapfile -t paths < <(python3 - <<'PY'
          import json, os, pathlib, re
          rows=json.loads(pathlib.Path(os.environ['OUT'],'static-inventory.json').read_text())
          def pick(pattern):
              for x in rows:
                  if re.search(pattern,x['path']): return '/'+x['path'].removeprefix('html/')
          vals=['/','/smarthome.html',pick(r'html/assets/.+\.[0-9a-f]{12}\.css$'),pick(r'html/assets/app\.[0-9a-f]{12}\.mjs$')]
          vals += ['/'+x['path'].removeprefix('html/') for x in rows if re.search(r'html/i18n/.+\.[0-9a-f]{12}\.json$',x['path'])][:3]
          vals += ['/stats.json','/cv.pdf','/cv-lv.pdf']
          print('\n'.join(x for x in vals if x))
          PY
          )
          : > "$OUT/public-http.tsv"
          for path in "${paths[@]}"; do
            name="$(printf '%s' "$path" | sed 's#^/$#root#; s#^/##; s#[/?&=]#_#g')"
            raw="$(mktemp)"
            curl --fail --silent --show-error --head --max-time 20 \
              --user-agent 'rozkalns-cv-gate-c0-baseline/1' \
              "https://rozkalns.net${path}" > "$raw"
            awk 'BEGIN{IGNORECASE=1} /^(HTTP\/|Age:|Cache-Control:|Content-Encoding:|Content-Length:|Content-Security-Policy:|Content-Type:|ETag:|Expires:|Last-Modified:|Permissions-Policy:|Referrer-Policy:|Server:|Vary:|X-Content-Type-Options:|X-Frame-Options:|CF-Cache-Status:)/ {sub(/\r$/,""); print}' "$raw" > "$OUT/headers/${name}.txt"
            status="$(awk 'NR==1{print $2}' "$raw")"
            printf 'HEAD\t%s\t%s\n' "$path" "$status" >> "$OUT/public-http.tsv"
            rm -f "$raw"
          done
          curl --fail --silent --show-error --max-time 20 https://rozkalns.net/api/health \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print(json.dumps({"ok":d.get("ok"),"storage":d.get("storage")},indent=2))' \
            > "$OUT/api-health.json"
          curl --fail --silent --show-error --max-time 20 https://rozkalns.net/api/contact-config \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print(json.dumps({"configured":d.get("configured"),"sitekey_present":bool(d.get("sitekey"))},indent=2))' \
            > "$OUT/api-contact-config.json"
          for path in /api/chat /api/contact-reveal; do
            status="$(curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' "https://rozkalns.net${path}")"
            printf 'GET\t%s\t%s\n' "$path" "$status" >> "$OUT/public-http.tsv"
          done

      - name: Capture real Chrome cold warm coverage keyboard and screenshots
        env:
          OUT: ${{ steps.baseline.outputs.out }}
          BASELINE_SHA: ${{ steps.baseline.outputs.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          chrome=''
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then chrome="$(command -v "$candidate")"; break; fi
          done
          test -n "$chrome"
          node --check tools/c0-browser-baseline.mjs
          node tools/c0-browser-baseline.mjs \
            --output "$OUT" --url https://rozkalns.net --chrome "$chrome" --sha "$BASELINE_SHA"

      - name: Capture pinned Lighthouse mobile and desktop snapshots
        env:
          OUT: ${{ steps.baseline.outputs.out }}
          npm_config_audit: 'false'
          npm_config_fund: 'false'
          npm_config_ignore_scripts: 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          chrome=''
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then chrome="$(command -v "$candidate")"; break; fi
          done
          test -n "$chrome"
          export CHROME_PATH="$chrome"
          npm view lighthouse@13.4.1 version dist.integrity --json > "$OUT/lighthouse-package.json"
          npx --yes lighthouse@13.4.1 https://rozkalns.net/ \
            --quiet --output=json --output-path="$OUT/lighthouse-phone.json" \
            --only-categories=performance,accessibility,best-practices,seo \
            --chrome-flags='--headless=new --no-sandbox --disable-dev-shm-usage'
          npx --yes lighthouse@13.4.1 https://rozkalns.net/ \
            --quiet --preset=desktop --output=json --output-path="$OUT/lighthouse-desktop.json" \
            --only-categories=performance,accessibility,best-practices,seo \
            --chrome-flags='--headless=new --no-sandbox --disable-dev-shm-usage'

      - name: Write comparison summary and enforce artifact privacy
        env:
          OUT: ${{ steps.baseline.outputs.out }}
          BASELINE_SHA: ${{ steps.baseline.outputs.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os, pathlib
          out=pathlib.Path(os.environ['OUT']); b=json.loads((out/'browser-baseline.json').read_text()); inv=json.loads((out/'static-inventory.json').read_text())
          def lh(name):
              d=json.loads((out/f'lighthouse-{name}.json').read_text()); c=d['categories']; a=d['audits']
              return {'performance':round(c['performance']['score']*100),'accessibility':round(c['accessibility']['score']*100),'best_practices':round(c['best-practices']['score']*100),'seo':round(c['seo']['score']*100),'fcp_ms':a['first-contentful-paint']['numericValue'],'lcp_ms':a['largest-contentful-paint']['numericValue'],'cls':a['cumulative-layout-shift']['numericValue'],'tbt_ms':a['total-blocking-time']['numericValue'],'transfer_bytes':a['total-byte-weight']['numericValue']}
          phone,desktop=lh('phone'),lh('desktop')
          lines=['# Gate C0 before-state','',f"- baseline main: `{os.environ['BASELINE_SHA']}`",'- production writes: **none**','- origin-only headers: **gap recorded; access controls were not weakened**','- contact/chat production POSTs in interaction flow: **blocked locally by Chrome**','', '## Static identity','', '| files | total bytes |','|---:|---:|',f"| {len(inv)} | {sum(x['bytes'] for x in inv)} |",'', '## Browser network','', '| viewport | cold bytes | warm bytes | warm cache hits |','|---|---:|---:|---:|',f"| desktop | {b['desktop']['cold']['network']['transferredBytes']} | {b['desktop']['warm']['network']['transferredBytes']} | {b['desktop']['warm']['network']['cacheHits']} |",f"| phone | {b['phone']['cold']['network']['transferredBytes']} | {b['phone']['warm']['network']['transferredBytes']} | {b['phone']['warm']['network']['cacheHits']} |",'', '## Lighthouse 13.4.1','', '| viewport | perf | a11y | best practices | SEO | FCP ms | LCP ms | CLS | TBT ms | bytes |','|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|',f"| phone | {phone['performance']} | {phone['accessibility']} | {phone['best_practices']} | {phone['seo']} | {phone['fcp_ms']:.0f} | {phone['lcp_ms']:.0f} | {phone['cls']:.4f} | {phone['tbt_ms']:.0f} | {phone['transfer_bytes']:.0f} |",f"| desktop | {desktop['performance']} | {desktop['accessibility']} | {desktop['best_practices']} | {desktop['seo']} | {desktop['fcp_ms']:.0f} | {desktop['lcp_ms']:.0f} | {desktop['cls']:.4f} | {desktop['tbt_ms']:.0f} | {desktop['transfer_bytes']:.0f} |",'', '## Keyboard / interaction','',f"- skip link first Tab: **{'PASS' if b['desktop']['keyboard']['skipFirst'] else 'FAIL'}**",f"- EN/DE/LV in Tab flow: **{'PASS' if b['desktop']['keyboard']['langButtons'] else 'FAIL'}**",f"- keyboard language switch: **{'PASS' if b['desktop']['keyboard']['langSwitch'] else 'FAIL'}**",f"- keyboard nav activation: **{'PASS' if b['desktop']['keyboard']['nav'] else 'FAIL'}**",f"- contact verification UI entered: **{'PASS' if (b['desktop']['keyboard']['contact']['mount'] or b['desktop']['keyboard']['contact']['status']) else 'OBSERVED'}**",f"- chat send blocked locally + Escape focus return: **{'PASS' if b['desktop']['keyboard']['chatBlocked'] and b['desktop']['keyboard']['chatFocusReturn'] else 'FAIL'}**",'', '## Evidence files','', '- `static-inventory.json`: byte sizes + SHA-256 for built HTML/CSS/JS/i18n','- `headers/` + `public-http.tsv`: allowlisted public response contracts','- `browser-baseline.json`: cold/warm request waterfalls, transfer bytes, synthetic metrics, Chrome JS/CSS coverage, keyboard flow','- `screenshot-desktop.png`, `screenshot-phone.png`: visual baseline','- `lighthouse-phone.json`, `lighthouse-desktop.json`: reproducible Lighthouse snapshots','- `main-ci.json`: successful push CI identity for exact baseline SHA','- `ORIGIN_EVIDENCE_GAP.txt`: explicit least-privilege origin gap','']
          (out/'SUMMARY.md').write_text('\n'.join(lines),encoding='utf-8')
          (out/'ORIGIN_EVIDENCE_GAP.txt').write_text('Origin-only response headers were not collected because this GitHub-hosted evidence job has no approved read-only host path. Gate C0 requires recording this gap rather than weakening access controls.\n',encoding='utf-8')
          PY
          if grep -REn '"(email|phone|phone_uri|token|cookie)"[[:space:]]*:' \
            "$OUT/browser-baseline.json" "$OUT/api-contact-config.json"; then
            echo 'privacy-sensitive key found in sanitized artifacts' >&2
            exit 1
          fi
          cat "$OUT/SUMMARY.md" >> "$GITHUB_STEP_SUMMARY"
          printf 'C0_PRIVACY_ARTIFACT_GATE=PASS\n'

      - name: Upload Gate C0 evidence
        if: always() && steps.baseline.outputs.out != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-c0-${{ steps.baseline.outputs.sha }}-run-${{ github.run_id }}
          path: ${{ steps.baseline.outputs.out }}
          if-no-files-found: error
          retention-days: 90
