name: UI v3 shell materializer

on:
  push:
    branches:
      - feat/ui-v3-shell-254

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact branch head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch --no-tags origin "$GITHUB_SHA"
          git checkout -B feat/ui-v3-shell-254 FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Apply UI v3 shell patch
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/tmp-ui-v3-shell.py
          python3 -m py_compile tools/tmp-ui-v3-shell.py

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false

      - name: Rebuild and validate frontend
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:frontend
          npm run check:frontend
          node --test tests/frontend.test.mjs
          python3 tests/test_frontend_contract.py
          python3 tests/test_html_semantics.py
          python3 tests/test_localized_pages.py
          python3 tests/test_seo_canonical.py

      - name: Commit materialized source and dist
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            frontend/index.html \
            frontend/styles/layout.css \
            frontend/styles/components.css \
            frontend/styles/responsive.css \
            tests/test_frontend_contract.py \
            frontend-dist-manifest.json \
            html/assets \
            html/i18n \
            html/index.html \
            html/en/index.html \
            html/de/index.html \
            html/lv/index.html \
            html/smarthome.html \
            html/sitemap.xml
          git diff --cached --check
          git status --short
          if git diff --cached --quiet; then
            echo 'UI_V3_SHELL_MATERIALIZATION=NO_CHANGES'
            exit 0
          fi
          git commit -m 'feat: establish UI v3 shell hierarchy'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            push origin HEAD:refs/heads/feat/ui-v3-shell-254
