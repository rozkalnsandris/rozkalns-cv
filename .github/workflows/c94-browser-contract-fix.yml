name: C94 browser contract updater

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: c94-browser-contract-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  update:
    if: >-
      github.repository == 'rozkalnsandris/rozkalns-cv' &&
      github.actor == 'rozkalnsandris' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/94-public-email-verified-whatsapp-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out exact PR head
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch --no-tags origin "$EXPECTED_HEAD"
          git checkout -b fix/94-public-email-verified-whatsapp-v2 FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Update real-browser contact contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/browser-smoke.mjs')
          text = path.read_text(encoding='utf-8')

          old_fixture = '''        response.end(JSON.stringify({
                    email: "test@example.invalid",
                    phone: "+49 123 4567890",
                    phone_uri: "+491234567890"
                  }));'''
          new_fixture = '''        response.end(JSON.stringify({
                    email: "test@example.invalid",
                    phone: "+49 123 4567890",
                    phone_uri: "+491234567890",
                    whatsapp_url: "https://wa.me/491234567890"
                  }));'''
          if old_fixture not in text:
              raise SystemExit('browser fixture contact payload anchor missing')
          text = text.replace(old_fixture, new_fixture, 1)

          old_assertion = '''    await cdp.evaluate(`(() => {
                    window.turnstile = {
                      render(mount, options) {
                        const frame = document.createElement('iframe');
                        frame.title = 'Synthetic Turnstile';
                        frame.tabIndex = 0;
                        mount.append(frame);
                        setTimeout(() => options.callback('synthetic-turnstile-token'), 0);
                        return 'fixture-widget';
                      },
                      reset() {}
                    };
                    document.querySelector('#contactReveal').focus();
                  })()`);
                  await cdp.key("Enter");
                  await cdp.waitFor(
                    `document.querySelector('#contactReveal')?.hidden === true && document.querySelector('#turnstileMount')?.hidden === true && document.querySelector('#contactVerifyStatus')?.dataset.state === "success" && document.activeElement?.dataset.revealed === "true"`,
                    10_000,
                    "keyboard contact verification focus transfer"
                  );
                  assert.deepEqual(state.contactRequests, [{ token: "synthetic-turnstile-token" }]);
                  assert.equal(
                    await cdp.evaluate(`document.activeElement?.getAttribute('href')`),
                    "mailto:test@example.invalid"
                  );'''
          new_assertion = '''    assert.equal(
                    await cdp.evaluate(`document.querySelector('#contactEmail')?.getAttribute('href')`),
                    "mailto:andris@rozkalns.net"
                  );
                  assert.equal(
                    await cdp.evaluate(`document.querySelector('#contactPhone')?.tagName`),
                    "SPAN"
                  );
                  await cdp.evaluate(`(() => {
                    window.turnstile = {
                      render(mount, options) {
                        const frame = document.createElement('iframe');
                        frame.title = 'Synthetic Turnstile';
                        frame.tabIndex = 0;
                        mount.append(frame);
                        setTimeout(() => options.callback('synthetic-turnstile-token'), 0);
                        return 'fixture-widget';
                      },
                      reset() {}
                    };
                    document.querySelector('#contactReveal').focus();
                  })()`);
                  await cdp.key("Enter");
                  await cdp.waitFor(
                    `document.querySelector('#contactReveal')?.hidden === true && document.querySelector('#turnstileMount')?.hidden === true && document.querySelector('#contactVerifyStatus')?.dataset.state === "success" && document.activeElement?.dataset.revealed === "true"`,
                    10_000,
                    "keyboard phone verification focus transfer"
                  );
                  assert.deepEqual(state.contactRequests, [{ token: "synthetic-turnstile-token" }]);
                  assert.equal(
                    await cdp.evaluate(`document.activeElement?.getAttribute('href')`),
                    "tel:+491234567890"
                  );'''
          if old_assertion not in text:
              raise SystemExit('browser contact assertion anchor missing')
          text = text.replace(old_assertion, new_assertion, 1)
          path.write_text(text, encoding='utf-8')
          PY
          node --check tests/browser-smoke.mjs

      - name: Self-clean and publish browser contract fix
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/c94-browser-contract-fix.yml
          changed="$(git status --porcelain=v1 -uall)"
          printf '%s\n' "$changed"
          test "$(printf '%s\n' "$changed" | grep -c '^ M tests/browser-smoke.mjs$')" -eq 1
          test "$(printf '%s\n' "$changed" | grep -c '^ D .github/workflows/c94-browser-contract-fix.yml$')" -eq 1
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: align browser contact focus with verified phone flow (#94)'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            push origin HEAD:refs/heads/fix/94-public-email-verified-whatsapp-v2
          printf 'C94_BROWSER_CONTRACT_UPDATE=PASS\n'
