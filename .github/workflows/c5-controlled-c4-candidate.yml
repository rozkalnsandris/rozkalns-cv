name: C5 controlled C4-candidate comparison

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/c5-controlled-c4-candidate.yml
      - frontend/**
      - scripts/check-frontend-dist.mjs
      - tools/c5-startup-baseline.mjs

permissions:
  contents: read

jobs:
  compare:
    if: >-
      github.repository == 'rozkalnsandris/rozkalns-cv' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'perf/82-reduce-initial-background-work-v01'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      C4_SHA: c01a2beea0df8050a6e192504428c17574a852af
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out exact C5 candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Materialize exact C4 baseline
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" fetch --no-tags origin "$C4_SHA"
          git worktree add --detach "${RUNNER_TEMP}/c4" "$C4_SHA"
          test "$(git -C "${RUNNER_TEMP}/c4" rev-parse HEAD)" = "$C4_SHA"

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm

      - name: Verify committed C5 generated output
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:frontend
          npm run check:frontend
          git diff --exit-code -- frontend-dist-manifest.json html/assets html/i18n html/index.html html/smarthome.html

      - name: Capture three controlled C4 and C5 runs
        id: capture
        shell: bash
        run: |
          set -Eeuo pipefail
          chrome=''
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then chrome="$(command -v "$candidate")"; break; fi
          done
          test -n "$chrome"
          root="${RUNNER_TEMP}/c5-after"
          mkdir -p "$root"
          python3 -m http.server 18081 --bind 127.0.0.1 --directory "${RUNNER_TEMP}/c4/html" >"${RUNNER_TEMP}/c4-http.log" 2>&1 &
          c4_pid=$!
          python3 -m http.server 18082 --bind 127.0.0.1 --directory "$PWD/html" >"${RUNNER_TEMP}/c5-http.log" 2>&1 &
          c5_pid=$!
          cleanup() { kill "$c4_pid" "$c5_pid" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for port in 18081 18082; do
            for attempt in $(seq 1 20); do
              if curl -fsS "http://127.0.0.1:${port}/" >/dev/null; then break; fi
              test "$attempt" -lt 20
              sleep 0.25
            done
          done
          candidate_sha="${{ github.event.pull_request.head.sha }}"
          for n in 1 2 3; do
            node tools/c5-startup-baseline.mjs --output "$root/c4-$n" --url http://127.0.0.1:18081/ --chrome "$chrome" --sha "$C4_SHA"
            node tools/c5-startup-baseline.mjs --output "$root/c5-$n" --url http://127.0.0.1:18082/ --chrome "$chrome" --sha "$candidate_sha"
          done
          printf 'evidence=%s\n' "$root" >> "$GITHUB_OUTPUT"

      - name: Summarize C5 startup delta
        env:
          EVIDENCE: ${{ steps.capture.outputs.evidence }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os, statistics
          from collections import defaultdict
          from pathlib import Path
          root=Path(os.environ['EVIDENCE'])
          data={v:[json.loads((root/f'{v}-{n}'/'startup-baseline.json').read_text()) for n in (1,2,3)] for v in ('c4','c5')}
          summary={'c4Sha':os.environ['C4_SHA'],'c5Sha':data['c5'][0]['baselineSha'],'runs':3,'results':{}}
          for vp in ('desktop','phone'):
              summary['results'][vp]={}
              for version in ('c4','c5'):
                  runs=data[version]
                  row={'network':{},'coverage':{},'types':{},'coldUrls':[]}
                  for phase in ('cold','warm'):
                      bs=[r[vp][phase]['network']['transferredBytes'] for r in runs]
                      qs=[r[vp][phase]['network']['requests'] for r in runs]
                      row['network'][phase]={'medianBytes':int(statistics.median(bs)),'runsBytes':bs,'medianRequests':int(statistics.median(qs)),'runsRequests':qs}
                  js_total=[]; js_used=[]
                  for r in runs:
                      js_total.append(sum(x['bytes'] for x in r[vp]['coverage']['javascript']))
                      js_used.append(sum(x['usedBytes'] for x in r[vp]['coverage']['javascript']))
                  total=int(statistics.median(js_total)); used=int(statistics.median(js_used))
                  row['coverage']={'medianJsBytes':total,'medianUsedBytes':used,'usedPercent':round(100*used/total,2) if total else None}
                  type_runs=[]
                  for r in runs:
                      bucket=defaultdict(int)
                      for x in r[vp]['cold']['network']['rows']: bucket[x['type']]+=x['bytes']
                      type_runs.append(bucket)
                  for typ in sorted(set().union(*[set(x) for x in type_runs])):
                      row['types'][typ]=int(statistics.median([x.get(typ,0) for x in type_runs]))
                  row['coldUrls']=sorted({x['url'] for r in runs for x in r[vp]['cold']['network']['rows']})
                  summary['results'][vp][version]=row
              a=summary['results'][vp]['c4']; b=summary['results'][vp]['c5']
              for phase in ('cold','warm'):
                  av=a['network'][phase]['medianBytes']; bv=b['network'][phase]['medianBytes']
                  print(f'C5_AFTER_{vp.upper()}_{phase.upper()}_C4={av} C5={bv} DELTA={bv-av:+d}B ({(bv/av-1)*100:+.2f}%)')
                  print(f'C5_AFTER_{vp.upper()}_{phase.upper()}_REQUESTS_C4={a["network"][phase]["medianRequests"]} C5={b["network"][phase]["medianRequests"]}')
              print(f'C5_AFTER_{vp.upper()}_JS_BYTES_C4={a["coverage"]["medianJsBytes"]} C5={b["coverage"]["medianJsBytes"]} DELTA={b["coverage"]["medianJsBytes"]-a["coverage"]["medianJsBytes"]:+d}')
              print(f'C5_AFTER_{vp.upper()}_JS_USED_C4={a["coverage"]["medianUsedBytes"]}/{a["coverage"]["medianJsBytes"]} ({a["coverage"]["usedPercent"]}%) C5={b["coverage"]["medianUsedBytes"]}/{b["coverage"]["medianJsBytes"]} ({b["coverage"]["usedPercent"]}%)')
              print(f'C5_AFTER_{vp.upper()}_C4_TYPES={a["types"]}')
              print(f'C5_AFTER_{vp.upper()}_C5_TYPES={b["types"]}')
              print(f'C5_AFTER_{vp.upper()}_C5_COLD_URLS={b["coldUrls"]}')
          (root/'after-summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          PY

      - name: Upload after-change evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: c5-controlled-c4-candidate-${{ github.event.pull_request.head.sha }}
          path: ${{ steps.capture.outputs.evidence }}
          if-no-files-found: error
          retention-days: 30
