name: C5 production release proof

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/c5-release-proof.yml

permissions:
  actions: read
  contents: read

jobs:
  verify:
    if: >-
      github.repository == 'rozkalnsandris/rozkalns-cv' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'a11y/84-semantic-interaction-v01'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Require exact C5 main CI and production deploy
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_MAIN: a044e4c612f4952e0d59a8b2b76779137f92d06e
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ['REPOSITORY']
          expected = os.environ['EXPECTED_MAIN']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'rozkalns-cv-c5-release-proof',
          }

          def get(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)

          api = f'https://api.github.com/repos/{repo}'
          main = str(get(f'{api}/branches/main')['commit']['sha'])
          if main != expected:
              raise SystemExit(f'CURRENT_MAIN_CHANGED expected={expected} actual={main}')
          print(f'CURRENT_MAIN={main}')

          ci_runs = get(
              f'{api}/actions/workflows/ci.yml/runs?event=push&status=completed&per_page=100'
          ).get('workflow_runs', [])
          ci_matches = [
              row for row in ci_runs
              if row.get('event') == 'push'
              and row.get('head_branch') == 'main'
              and row.get('head_sha') == expected
              and row.get('conclusion') == 'success'
          ]
          if not ci_matches:
              raise SystemExit('C5_MAIN_CI=FAIL')
          ci_run = max(ci_matches, key=lambda row: int(row['id']))
          print(f'C5_MAIN_CI=PASS run_id={ci_run["id"]}')

          deploy_runs = get(
              f'{api}/actions/workflows/deploy-main.yml/runs?status=completed&per_page=100'
          ).get('workflow_runs', [])
          candidates = []
          for run in deploy_runs:
              run_id = int(run['id'])
              artifact_name = f'rozkalns-cv-deploy-{expected}-run-{run_id}'
              artifacts = get(f'{api}/actions/runs/{run_id}/artifacts?per_page=100').get('artifacts', [])
              if not any(str(row.get('name')) == artifact_name for row in artifacts):
                  continue
              jobs = get(f'{api}/actions/runs/{run_id}/jobs?per_page=100').get('jobs', [])
              job = next((row for row in jobs if row.get('name') == 'Deploy on RPi5'), None)
              if not job:
                  continue
              steps = {
                  str(step.get('name')): str(step.get('conclusion'))
                  for step in job.get('steps', [])
              }
              candidates.append((run_id, str(run.get('conclusion')), steps, artifact_name))

          if not candidates:
              raise SystemExit('C5_PRODUCTION_DEPLOY=FAIL no exact-SHA deploy artifact')

          run_id, conclusion, steps, artifact = max(candidates, key=lambda row: row[0])
          required = (
              'Verify installed deploy helper matches target source',
              'Deploy queued merge SHA',
              'Verify public frontend contracts',
              'Upload deploy evidence',
          )
          print(f'C5_DEPLOY_RUN={run_id} conclusion={conclusion}')
          for name in required:
              print(f'DEPLOY_STEP name={name} conclusion={steps.get(name)}')
          if conclusion != 'success' or any(steps.get(name) != 'success' for name in required):
              raise SystemExit('C5_PRODUCTION_GATE=FAIL')
          print(f'DEPLOY_ARTIFACT={artifact}')
          print('C5_PRODUCTION_GATE=PASS')
          PY
