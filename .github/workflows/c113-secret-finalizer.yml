name: C113 dedicated pseudonymization secret finalizer

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: c113-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  finalize:
    if: >-
      github.repository == 'rozkalnsandris/rozkalns-cv' &&
      github.actor == 'rozkalnsandris' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/113-dedicated-client-secret'
    runs-on: ubuntu-24.04
    timeout-minutes: 18

    steps:
      - name: Check out exact stacked head
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch --no-tags origin "$EXPECTED_HEAD"
          git checkout -b fix/113-dedicated-client-secret "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Apply fail-closed secret-domain policy
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'C113_PATCH=FAIL anchor={label} count={text.count(old)}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'bot/storage.py',
              'from dataclasses import dataclass\n',
              'import base64\nimport binascii\nfrom dataclasses import dataclass\n',
              'storage-imports',
          )
          replace_once(
              'bot/storage.py',
              'LOGGER = logging.getLogger(__name__)\n\n\n@dataclass(frozen=True)\n',
              '''LOGGER = logging.getLogger(__name__)\n\nCLIENT_KEY_SECRET_MIN_BYTES = 32\n_CLIENT_KEY_SECRET_ALPHABET = frozenset(\n    "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_"\n)\n\n\nclass ClientKeySecretError(RuntimeError):\n    """Raised when the dedicated pseudonymization key is unsafe to use."""\n\n\ndef validate_client_key_secret(value: str, provider_key: str = "") -> str:\n    """Validate a dedicated URL-safe HMAC key without exposing its value."""\n\n    if not isinstance(value, str) or not value:\n        raise ClientKeySecretError("CLIENT_KEY_SECRET is required")\n    if not value.isascii() or any(\n        character not in _CLIENT_KEY_SECRET_ALPHABET for character in value\n    ):\n        raise ClientKeySecretError("CLIENT_KEY_SECRET has invalid format")\n    padding = "=" * ((4 - len(value) % 4) % 4)\n    try:\n        decoded = base64.b64decode(\n            value + padding, altchars=b"-_", validate=True\n        )\n    except (binascii.Error, ValueError) as error:\n        raise ClientKeySecretError(\n            "CLIENT_KEY_SECRET has invalid format"\n        ) from error\n    if len(decoded) < CLIENT_KEY_SECRET_MIN_BYTES:\n        raise ClientKeySecretError("CLIENT_KEY_SECRET is too short")\n    if provider_key and hmac.compare_digest(value, provider_key):\n        raise ClientKeySecretError(\n            "CLIENT_KEY_SECRET must be dedicated to pseudonymization"\n        )\n    return value\n\n\n@dataclass(frozen=True)\n''',
              'storage-validator',
          )

          replace_once(
              'bot/app.py',
              'from storage import AssistantStore, RateDecision\n',
              'from storage import (\n    AssistantStore,\n    RateDecision,\n    validate_client_key_secret,\n)\n',
              'app-storage-import',
          )
          replace_once(
              'bot/app.py',
              'CLIENT_KEY_SECRET = os.getenv("CLIENT_KEY_SECRET", "") or LLM_API_KEY\n',
              'CLIENT_KEY_SECRET = validate_client_key_secret(\n    os.getenv("CLIENT_KEY_SECRET", ""), LLM_API_KEY\n)\n',
              'app-no-provider-fallback',
          )

          replace_once(
              'bot/.env.example',
              'CLIENT_KEY_SECRET=replace-with-a-long-random-secret\n',
              'CLIENT_KEY_SECRET=!generate-with-secrets-token-urlsafe-32!\n',
              'env-example',
          )

          replace_once(
              'tests/test_storage.py',
              'from storage import AssistantStore\n',
              'from storage import (\n    AssistantStore,\n    ClientKeySecretError,\n    validate_client_key_secret,\n)\n',
              'storage-test-import',
          )
          replace_once(
              'tests/test_storage.py',
              '    def test_pseudonym_is_stable_and_does_not_contain_address(self) -> None:\n',
              '''    def test_dedicated_client_key_secret_contract(self) -> None:\n        dedicated = "A" * 43\n        self.assertEqual(\n            validate_client_key_secret(dedicated, "provider-key"), dedicated\n        )\n        for invalid in ("", "short", "!" + dedicated):\n            with self.subTest(invalid=bool(invalid)):\n                with self.assertRaises(ClientKeySecretError):\n                    validate_client_key_secret(invalid, "provider-key")\n\n    def test_provider_key_cannot_be_reused_for_pseudonymization(self) -> None:\n        shared = "B" * 43\n        with self.assertRaises(ClientKeySecretError):\n            validate_client_key_secret(shared, shared)\n\n    def test_pseudonym_is_stable_and_does_not_contain_address(self) -> None:\n''',
              'storage-secret-tests',
          )
          for path in ('tests/test_bot.py', 'tests/test_bot_failures.py'):
              replace_once(
                  path,
                  '"CLIENT_KEY_SECRET": "test-client-secret",',
                  '"CLIENT_KEY_SECRET": "A" * 43,',
                  f'{path}-secret-fixture',
              )

          startup_test = '''from __future__ import annotations\n\nimport os\nfrom pathlib import Path\nimport subprocess\nimport sys\nimport tempfile\nimport unittest\n\nROOT = Path(__file__).resolve().parents[1]\nBOT = ROOT / "bot"\n\n\nclass ClientKeySecretStartupTests(unittest.TestCase):\n    def _import_app(\n        self, *, client_secret: str | None, provider_key: str\n    ) -> subprocess.CompletedProcess[str]:\n        with tempfile.TemporaryDirectory() as tmp:\n            env = os.environ.copy()\n            env.update(\n                {\n                    "LLM_API_KEY": provider_key,\n                    "ASSISTANT_DB_PATH": str(Path(tmp) / "assistant.sqlite3"),\n                    "CHAT_RETENTION_DAYS": "0",\n                    "TELEGRAM_TOKEN": "",\n                    "CHAT_ID": "",\n                }\n            )\n            if client_secret is None:\n                env.pop("CLIENT_KEY_SECRET", None)\n            else:\n                env["CLIENT_KEY_SECRET"] = client_secret\n            return subprocess.run(\n                [sys.executable, "-c", "import app"],\n                cwd=BOT,\n                env=env,\n                text=True,\n                capture_output=True,\n                check=False,\n            )\n\n    def test_missing_secret_fails_startup_without_provider_fallback(self) -> None:\n        result = self._import_app(\n            client_secret=None, provider_key="provider-secret-marker"\n        )\n        self.assertNotEqual(result.returncode, 0)\n        combined = result.stdout + result.stderr\n        self.assertIn("CLIENT_KEY_SECRET", combined)\n        self.assertNotIn("provider-secret-marker", combined)\n\n    def test_provider_key_reuse_fails_startup(self) -> None:\n        shared = "B" * 43\n        result = self._import_app(client_secret=shared, provider_key=shared)\n        self.assertNotEqual(result.returncode, 0)\n        combined = result.stdout + result.stderr\n        self.assertIn("dedicated", combined)\n        self.assertNotIn(shared, combined)\n\n    def test_valid_dedicated_secret_allows_startup(self) -> None:\n        result = self._import_app(\n            client_secret="A" * 43, provider_key="provider-key"\n        )\n        self.assertEqual(result.returncode, 0, result.stderr)\n\n\nif __name__ == "__main__":\n    unittest.main()\n'''
          Path('tests/test_client_key_secret.py').write_text(startup_test, encoding='utf-8')

          deploy = Path('runner/release/rozkalns-cv-deploy-main')
          text = deploy.read_text(encoding='utf-8')
          anchor = '\nprepare_cvbot_data() {\n'
          validator = r'''
validate_cvbot_runtime_secret() {
    local env_file="$RUNTIME/bot/.env"
    [[ -f "$env_file" && ! -L "$env_file" ]] || return 1
    python3 - "$env_file" <<'PY_SECRET'
from __future__ import annotations

import base64
import binascii
import hmac
from pathlib import Path
import sys

path = Path(sys.argv[1])
values: dict[str, str] = {}
for raw in path.read_text(encoding="utf-8").splitlines():
    line = raw.strip()
    if not line or line.startswith("#"):
        continue
    key, separator, value = line.partition("=")
    key = key.strip()
    if not separator or key not in {"CLIENT_KEY_SECRET", "LLM_API_KEY"}:
        continue
    if key in values:
        raise SystemExit("cvbot secret contract failed: duplicate key")
    value = value.strip()
    if len(value) >= 2 and value[0] == value[-1] and value[0] in {"'", '"'}:
        value = value[1:-1]
    values[key] = value

secret = values.get("CLIENT_KEY_SECRET", "")
allowed = set("ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_")
if not secret or not secret.isascii() or any(character not in allowed for character in secret):
    raise SystemExit("cvbot client pseudonymization secret contract failed")
padding = "=" * ((4 - len(secret) % 4) % 4)
try:
    decoded = base64.b64decode(secret + padding, altchars=b"-_", validate=True)
except (binascii.Error, ValueError):
    raise SystemExit("cvbot client pseudonymization secret contract failed") from None
if len(decoded) < 32:
    raise SystemExit("cvbot client pseudonymization secret contract failed")
provider = values.get("LLM_API_KEY", "")
if provider and hmac.compare_digest(secret, provider):
    raise SystemExit("cvbot client pseudonymization secret must be dedicated")
print("CVBOT_CLIENT_KEY_SECRET=PASS")
PY_SECRET
}

prepare_cvbot_data() {
'''
          if text.count(anchor) != 1:
              raise SystemExit(f'C113_PATCH=FAIL anchor=deploy-validator count={text.count(anchor)}')
          text = text.replace(anchor, '\n' + validator, 1)
          runtime_anchor = '''deploy_runtime() {\n    normalize_managed_permissions "$RUNTIME" || return 1\n    prepare_cvbot_data || return 1\n'''
          runtime_new = '''deploy_runtime() {\n    normalize_managed_permissions "$RUNTIME" || return 1\n    validate_cvbot_runtime_secret || return 1\n    prepare_cvbot_data || return 1\n'''
          if text.count(runtime_anchor) != 1:
              raise SystemExit(f'C113_PATCH=FAIL anchor=deploy-runtime count={text.count(runtime_anchor)}')
          deploy.write_text(text.replace(runtime_anchor, runtime_new, 1), encoding='utf-8')

          deploy_test = Path('tests/test_deploy_contract.py')
          text = deploy_test.read_text(encoding='utf-8')
          anchor = '\n\nif __name__ == "__main__":\n    unittest.main()\n'
          test = '''\n    def test_cvbot_client_secret_is_validated_without_disclosure(self) -> None:\n        helper = read(HELPER)\n        for marker in (\n            "validate_cvbot_runtime_secret()",\n            'values.get("CLIENT_KEY_SECRET", "")',\n            "len(decoded) < 32",\n            "hmac.compare_digest(secret, provider)",\n            "CVBOT_CLIENT_KEY_SECRET=PASS",\n            "validate_cvbot_runtime_secret || return 1",\n        ):\n            self.assertIn(marker, helper)\n        self.assertNotIn('printf \\'%s\\\\n\\' "$CLIENT_KEY_SECRET"', helper)\n        self.assertNotIn('echo "$CLIENT_KEY_SECRET"', helper)\n        self.assertNotIn('echo "$LLM_API_KEY"', helper)\n'''
          if text.count(anchor) != 1:
              raise SystemExit(f'C113_PATCH=FAIL anchor=deploy-test count={text.count(anchor)}')
          deploy_test.write_text(text.replace(anchor, test + anchor, 1), encoding='utf-8')

          docs = '''# CV assistant pseudonymization secret\n\n`CLIENT_KEY_SECRET` is a dedicated runtime-only HMAC key for visitor pseudonyms. It must never fall back to or equal `LLM_API_KEY`.\n\n## Generate\n\nGenerate a fresh URL-safe token from 32 random bytes on the production host, for example:\n\n```bash\npython3 -c 'import secrets; print(secrets.token_urlsafe(32))'\n```\n\nStore the resulting value only in the protected production `bot/.env` as `CLIENT_KEY_SECRET`. The tracked `.env.example` intentionally contains an invalid placeholder so copying it unchanged fails closed.\n\n## Startup and deploy contract\n\nStartup rejects a missing, empty, malformed, too-short, or provider-key-equal value with a sanitized error that never includes either secret. Deployment checks the same presence, URL-safe encoding, decoded minimum length, and domain-separation contract before starting cvbot. Deploy evidence records only `CVBOT_CLIENT_KEY_SECRET=PASS`.\n\n## Rotation\n\nPseudonyms are deterministic only while this secret is unchanged. Rotating it changes future HMAC pseudonyms, so existing per-client rate-limit rows and any retained rows keyed by the old pseudonym will no longer correlate to new requests. Rotation does not automatically delete SQLite state. Existing rate events age out under the rate-limit policy and raw chat rows follow `CHAT_RETENTION_DAYS`.\n\nIf old pseudonymous identity state must be cleared for an operational reason, that is a separate, explicit maintenance action with its own authorization and evidence. Secret rotation itself must not silently delete rate-limit or retained-chat rows.\n\nThe runtime `.env` is excluded from source synchronization, application backups, manifests, logs, and normal deployment evidence; no secret value belongs in tracked files.\n'''
          Path('docs/CVBOT_CLIENT_SECRET.md').write_text(docs, encoding='utf-8')
          print('C113_SOURCE_PATCH=PASS')
          PY

          python3 -m py_compile bot/app.py bot/storage.py tests/test_client_key_secret.py
          bash -n runner/release/rozkalns-cv-deploy-main

      - name: Run focused secret, retention and deploy regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          test_venv="${RUNNER_TEMP}/c113-test-venv"
          python3 -m venv "$test_venv"
          "$test_venv/bin/python" -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            --no-deps \
            -r bot/requirements.lock
          export PYTHONPYCACHEPREFIX="${RUNNER_TEMP}/c113-pycache"
          "$test_venv/bin/python" -m unittest \
            tests.test_client_key_secret \
            tests.test_storage \
            tests.test_bot \
            tests.test_bot_failures \
            tests.test_proxy_contract \
            tests.test_retention_policy \
            tests.test_deploy_contract \
            tests.test_current_contact_privacy
          bash scripts/validate-source.sh "$PWD"
          printf 'C113_FOCUSED_REGRESSION=PASS\n'

      - name: Self-clean and guard bounded diff
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/c113-secret-finalizer.yml
          python3 - <<'PY'
          import subprocess

          allowed = {
              '.github/workflows/c113-secret-finalizer.yml',
              'bot/app.py', 'bot/storage.py', 'bot/.env.example',
              'runner/release/rozkalns-cv-deploy-main',
              'docs/CVBOT_CLIENT_SECRET.md',
              'tests/test_client_key_secret.py',
              'tests/test_storage.py', 'tests/test_bot.py',
              'tests/test_bot_failures.py', 'tests/test_deploy_contract.py',
          }
          bad = []
          for row in subprocess.check_output(
              ['git', 'status', '--porcelain=v1', '-uall'], text=True
          ).splitlines():
              candidate = row[3:].split(' -> ', 1)[-1]
              if candidate not in allowed:
                  bad.append(candidate)
          if bad:
              raise SystemExit('unexpected C113 paths: ' + ', '.join(sorted(bad)))
          print('C113_DIFF_SCOPE=PASS')
          PY

      - name: Commit and push bounded C113 result
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git add -- \
            .github/workflows/c113-secret-finalizer.yml \
            bot/app.py bot/storage.py bot/.env.example \
            runner/release/rozkalns-cv-deploy-main \
            docs/CVBOT_CLIENT_SECRET.md \
            tests/test_client_key_secret.py tests/test_storage.py \
            tests/test_bot.py tests/test_bot_failures.py tests/test_deploy_contract.py
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'security(cvbot): require dedicated client pseudonym key (#113)'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            push origin HEAD:refs/heads/fix/113-dedicated-client-secret
          printf 'C113_FINALIZER=PASS\n'
