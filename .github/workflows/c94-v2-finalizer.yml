name: C94 v2 integration finalizer

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: c94-v2-finalizer-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.repository == 'rozkalnsandris/rozkalns-cv' &&
      github.actor == 'rozkalnsandris' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/94-public-email-verified-whatsapp-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out exact v2 head and prototype source
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch --no-tags origin "$EXPECTED_HEAD"
          git checkout -b fix/94-public-email-verified-whatsapp-v2 FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch --no-tags origin \
            'refs/heads/fix/94-current-contact-privacy:refs/remotes/origin/fix/94-current-contact-privacy'

      - name: Apply reviewed C94 source on current main baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          prototype='origin/fix/94-current-contact-privacy'
          paths=(
            bot/app.py
            bot/contact.py
            bot/system_prompt.txt
            content/profile.json
            content/profile.schema.json
            content/translations/en.json
            content/translations/de.json
            content/translations/lv.json
            docs/CONTENT_AUTHORING.md
            docs/PUBLIC_READINESS.md
            frontend/app.mjs
            frontend/features/contact.mjs
            frontend/media/whatsapp-contact-qr.svg
            frontend/public-contact.mjs
            frontend/styles/print.css
            scripts/build-content.py
            scripts/render-public-pdfs.py
            tests/test_contact.py
            tests/test_content_build.py
            tests/test_public_contact_policy.py
          )
          for path in "${paths[@]}"; do
            mkdir -p "$(dirname "$path")"
            git show "${prototype}:${path}" >"$path"
          done

          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/validate-source.sh')
          text = path.read_text(encoding='utf-8')
          anchor = '    frontend/app.mjs \\\n'
          addition = (
              '    frontend/app.mjs \\\n'
              '    frontend/public-contact.mjs \\\n'
              '    frontend/media/whatsapp-contact-qr.svg \\\n'
          )
          if 'frontend/public-contact.mjs' not in text:
              if anchor not in text:
                  raise SystemExit('validate-source frontend anchor missing')
              text = text.replace(anchor, addition, 1)
          anchor = '    scripts/build-content.py \\\n'
          addition = (
              '    scripts/build-content.py \\\n'
              '    scripts/render-public-pdfs.py \\\n'
          )
          if 'scripts/render-public-pdfs.py' not in text:
              if anchor not in text:
                  raise SystemExit('validate-source builder anchor missing')
              text = text.replace(anchor, addition, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Install PDF and QR verification tools
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils python3-opencv

      - name: Set up pinned Node.js frontend toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false

      - name: Build current-main frontend and reviewed PDFs
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:frontend
          python3 scripts/render-public-pdfs.py
          python3 scripts/build-content.py --write --accept-pdfs \
            --pdf-contact-policy verified-public-email-protected-phone
          python3 scripts/sync-system-prompt.py --write
          python3 scripts/build-content.py --check
          python3 scripts/sync-system-prompt.py --check

      - name: Verify PDF public-email protected-phone contract
        shell: bash
        run: |
          set -Eeuo pipefail
          evidence="${RUNNER_TEMP}/c94-pdf"
          mkdir -p "$evidence"
          for spec in \
            'en:html/cv.pdf:Experience' \
            'de:html/cv-de.pdf:Berufserfahrung' \
            'lv:html/cv-lv.pdf:Darba pieredze'
          do
            IFS=: read -r language pdf marker <<<"$spec"
            text="${evidence}/${language}.txt"
            png="${evidence}/${language}"
            urls="${evidence}/${language}.urls.txt"
            pdftotext "$pdf" "$text"
            grep -Fq 'andris@rozkalns.net' "$text"
            grep -Fiq "$marker" "$text"
            pdfinfo -url "$pdf" >"$urls"
            ! grep -Fq 'wa.me/' "$urls"
            ! grep -Fq 'tel:' "$urls"
            grep -Fq 'https://rozkalns.net/?contact=whatsapp' "$urls"
            pdftoppm -f 1 -singlefile -png -r 220 "$pdf" "$png" >/dev/null
            decoded="$(python3 - "${png}.png" <<'PY'
          import cv2
          import sys
          image = cv2.imread(sys.argv[1])
          if image is None:
              raise SystemExit(2)
          data, points, _ = cv2.QRCodeDetector().detectAndDecode(image)
          if points is None:
              raise SystemExit(3)
          print(data, end='')
          PY
            )"
            test "$decoded" = 'https://rozkalns.net/?contact=whatsapp'
            printf 'C94_PDF language=%s email=PASS phone=PROTECTED qr=PASS\n' "$language"
          done

      - name: Run focused canonical privacy tests
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m unittest tests.test_content_build tests.test_public_contact_policy
          node --check frontend/app.mjs
          node --check frontend/features/contact.mjs
          npm run check:frontend

      - name: Guard final diff and self-clean finalizer
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/c94-v2-finalizer.yml
          python3 - <<'PY'
          import subprocess
          allowed_exact = {
              'bot/app.py', 'bot/contact.py', 'bot/system_prompt.txt',
              'content/pdf-manifest.json', 'content/profile.json',
              'content/profile.schema.json', 'content/translations/en.json',
              'content/translations/de.json', 'content/translations/lv.json',
              'docs/CONTENT_AUTHORING.md', 'docs/PUBLIC_READINESS.md',
              'frontend/app.mjs', 'frontend/features/contact.mjs',
              'frontend/media/whatsapp-contact-qr.svg',
              'frontend/public-contact.mjs', 'frontend/styles/print.css',
              'frontend-dist-manifest.json',
              'html/index.html', 'html/smarthome.html',
              'html/cv.pdf', 'html/cv-de.pdf', 'html/cv-lv.pdf',
              'scripts/build-content.py', 'scripts/render-public-pdfs.py',
              'scripts/validate-source.sh',
              'tests/test_contact.py', 'tests/test_content_build.py',
              'tests/test_public_contact_policy.py',
              '.github/workflows/c94-v2-finalizer.yml',
          }
          allowed_prefixes = ('html/assets/', 'html/i18n/')
          names = subprocess.check_output(
              ['git', 'status', '--porcelain=v1', '-uall'], text=True
          ).splitlines()
          bad = []
          for row in names:
              path = row[3:]
              if ' -> ' in path:
                  path = path.split(' -> ', 1)[1]
              if path not in allowed_exact and not path.startswith(allowed_prefixes):
                  bad.append(path)
          if bad:
              raise SystemExit('unexpected C94 paths: ' + ', '.join(sorted(bad)))
          print('C94_DIFF_SCOPE=PASS')
          PY

      - name: Commit and push bounded C94 integration
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'security: protect CV phone behind verified WhatsApp flow (#94)'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            push origin HEAD:refs/heads/fix/94-public-email-verified-whatsapp-v2
          printf 'C94_V2_FINALIZER=PASS\n'
