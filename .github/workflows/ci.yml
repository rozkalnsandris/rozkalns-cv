name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Install test dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          test_venv="${RUNNER_TEMP}/rozkalns-cv-test-venv"
          python3 -m venv "$test_venv"
          "$test_venv/bin/python" -m pip install \
            --disable-pip-version-check \
            -r bot/requirements.txt
          echo "TEST_VENV=$test_venv" >> "$GITHUB_ENV"
          echo "PYTHONPYCACHEPREFIX=${RUNNER_TEMP}/rozkalns-cv-pycache" \
            >> "$GITHUB_ENV"

      - name: Validate source and application behavior
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/validate-source.sh "$PWD"
          "$TEST_VENV/bin/python" -m unittest discover \
            -s tests -p 'test_*.py' -v
          bash scripts/validate-source.sh "$PWD"

      - name: Validate nginx runtime configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm \
            --add-host=cvbot:127.0.0.1 \
            --mount "type=bind,src=$PWD/nginx.conf,dst=/etc/nginx/conf.d/default.conf,readonly" \
            nginx:alpine nginx -t

      - name: Build CV assistant image
        shell: bash
        run: |
          set -Eeuo pipefail
          cleanup() {
            rm -f cloudflared.env bot/.env
          }
          trap cleanup EXIT
          install -d -m 0700 bot
          printf 'CF_TUNNEL_TOKEN=ci-placeholder-not-a-secret\n' > cloudflared.env
          : > bot/.env
          chmod 0600 cloudflared.env bot/.env
          CF_TUNNEL_TOKEN='ci-placeholder-not-a-secret' \
            docker compose build cvbot

  apply_branding_once:
    name: apply branding once
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'chore/branding-cv-29' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout branding branch
        uses: actions/checkout@v5
        with:
          ref: chore/branding-cv-29
          fetch-depth: 0
      - name: Apply and commit branding
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          block = '''<p align="center">
            <img src="assets/branding/project-logo.svg" alt="rozkalns.net CV logo" width="160">
          </p>

          '''
          if 'assets/branding/project-logo.svg' not in text:
              readme.write_text(block + text, encoding='utf-8')
          Path('.github/workflows/apply-branding-once.yml').unlink(missing_ok=True)
          PY
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: add CV project branding (#29) [branding-applied]"
          git push origin HEAD:chore/branding-cv-29
