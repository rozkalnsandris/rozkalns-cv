name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out exact workflow SHA without third-party actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Install test dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          test_venv="${RUNNER_TEMP}/rozkalns-cv-test-venv"
          python3 -m venv "$test_venv"
          "$test_venv/bin/python" -m pip install \
            --disable-pip-version-check \
            -r bot/requirements.txt
          echo "TEST_VENV=$test_venv" >> "$GITHUB_ENV"
          echo "PYTHONPYCACHEPREFIX=${RUNNER_TEMP}/rozkalns-cv-pycache" \
            >> "$GITHUB_ENV"

      - name: Validate source and Python behavior with coverage
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/validate-source.sh "$PWD"
          coverage_log="${RUNNER_TEMP}/python-coverage.log"
          "$TEST_VENV/bin/python" scripts/run-python-tests.py \
            --coverage-dir "${RUNNER_TEMP}/python-coverage" \
            | tee "$coverage_log"
          {
            echo '## Python behavioral coverage'
            echo
            echo '```text'
            tail -n 40 "$coverage_log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate frontend modules and behavior
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check html/assets/app.d878d409f278.mjs
          node --check html/assets/smarthome.70da56476fdb.mjs
          node --check tests/browser-smoke.mjs
          node --test tests/frontend.test.mjs
          bash scripts/validate-source.sh "$PWD"

      - name: Run real Chromium frontend smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          chrome_bin=''
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then
              chrome_bin="$(command -v "$candidate")"
              break
            fi
          done
          test -n "$chrome_bin"
          CHROME_BIN="$chrome_bin" node tests/browser-smoke.mjs

      - name: Validate nginx runtime configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm \
            --add-host=cvbot:127.0.0.1 \
            --mount "type=bind,src=$PWD/nginx.conf,dst=/etc/nginx/conf.d/default.conf,readonly" \
            nginx:alpine nginx -t

      - name: Build CV assistant image
        shell: bash
        run: |
          set -Eeuo pipefail
          cleanup() {
            rm -f cloudflared.env bot/.env
          }
          trap cleanup EXIT
          install -d -m 0700 bot
          printf 'CF_TUNNEL_TOKEN=ci-placeholder-not-a-secret\n' > cloudflared.env
          : > bot/.env
          chmod 0600 cloudflared.env bot/.env
          CF_TUNNEL_TOKEN='ci-placeholder-not-a-secret' \
            docker compose build cvbot

      - name: Publish test categories
        if: always()
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Executed test categories

          - Flask request validation, streaming payloads, proxy identity, rate limits, privacy and redaction
          - SQLite persistence, retention, UTC reset and pseudonymous identities
          - transactional deploy fault injection, rollback and backup behavior
          - Prometheus parsing, retries, schema validation and atomic stats publication
          - frontend module behavior, translation parity, content hashes and size budgets
          - real Chromium language, statistics, streaming chat, failure-history and keyboard-flow smoke
          - rendered nginx configuration and CV assistant container build
          EOF
