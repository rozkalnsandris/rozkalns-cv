name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Check out exact workflow SHA with complete history
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch --no-tags --prune origin \
            '+refs/heads/*:refs/remotes/origin/*'
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch --no-tags origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse --is-shallow-repository)" = false

      - name: Install hash-locked test dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          test_venv="${RUNNER_TEMP}/rozkalns-cv-test-venv"
          python3 -m venv "$test_venv"
          "$test_venv/bin/python" -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            --no-deps \
            -r bot/requirements.lock
          echo "TEST_VENV=$test_venv" >> "$GITHUB_ENV"
          echo "PYTHONPYCACHEPREFIX=${RUNNER_TEMP}/rozkalns-cv-pycache" \
            >> "$GITHUB_ENV"

      - name: Validate source and Python behavior with coverage
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/validate-source.sh "$PWD"
          coverage_log="${RUNNER_TEMP}/python-coverage.log"
          "$TEST_VENV/bin/python" scripts/run-python-tests.py \
            --coverage-dir "${RUNNER_TEMP}/python-coverage" \
            | tee "$coverage_log"
          {
            echo '## Python behavioral coverage'
            echo
            echo '```text'
            tail -n 40 "$coverage_log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up pinned Node.js frontend toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false

      - name: Rebuild deterministic frontend dist from authoritative source
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:frontend
          first="${RUNNER_TEMP}/frontend-first.sha256"
          second="${RUNNER_TEMP}/frontend-second.sha256"
          {
            find html/assets html/i18n -type f -print0
            printf '%s\0' html/index.html html/smarthome.html frontend-dist-manifest.json
          } | sort -z | xargs -0 sha256sum > "$first"
          npm run build:frontend
          {
            find html/assets html/i18n -type f -print0
            printf '%s\0' html/index.html html/smarthome.html frontend-dist-manifest.json
          } | sort -z | xargs -0 sha256sum > "$second"
          cmp "$first" "$second"
          npm run check:frontend
          git diff --exit-code -- \
            package-lock.json frontend-dist-manifest.json \
            html/assets html/i18n html/index.html html/smarthome.html
          printf 'FRONTEND_DOUBLE_BUILD_DETERMINISTIC=PASS\n'

      - name: Validate frontend source modules and behavior
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check frontend/app.mjs
          node --check frontend/enhancements.mjs
          node --check frontend/smarthome.mjs
          node --check scripts/build-frontend.mjs
          node --check scripts/check-frontend-dist.mjs
          node --check tests/browser-smoke.mjs
          node --test tests/frontend.test.mjs
          npm run check:frontend

      - name: Run real Chromium frontend smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          chrome_bin=''
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then
              chrome_bin="$(command -v "$candidate")"
              break
            fi
          done
          test -n "$chrome_bin"
          browser_log="${RUNNER_TEMP}/browser-smoke.log"
          for attempt in 1 2 3; do
            set +e
            CHROME_BIN="$chrome_bin" node tests/browser-smoke.mjs \
              >"$browser_log" 2>&1
            browser_status=$?
            set -e
            cat "$browser_log"
            if [[ "$browser_status" -eq 0 ]]; then
              break
            fi
            if ! grep -Fq 'DevToolsActivePort' "$browser_log"; then
              exit "$browser_status"
            fi
            if [[ "$attempt" -eq 3 ]]; then
              exit "$browser_status"
            fi
            sleep "$attempt"
          done

      - name: Scan complete Git history for secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/run-gitleaks.sh "$PWD"

      - name: Validate pinned nginx runtime and HTTP response contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          image='nginx:1.31.3-alpine@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752'
          docker run --rm \
            --add-host=cvbot:127.0.0.1 \
            --mount "type=bind,src=$PWD/nginx.conf,dst=/etc/nginx/conf.d/default.conf,readonly" \
            "$image" \
            nginx -t

          container="cv-nginx-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup_nginx() {
            docker rm -f "$container" >/dev/null 2>&1 || true
          }
          trap cleanup_nginx EXIT

          docker run -d \
            --name "$container" \
            --add-host=cvbot:127.0.0.1 \
            --publish 127.0.0.1:18088:80 \
            --mount "type=bind,src=$PWD/nginx.conf,dst=/etc/nginx/conf.d/default.conf,readonly" \
            --mount "type=bind,src=$PWD/html,dst=/usr/share/nginx/html,readonly" \
            "$image" >/dev/null

          module_path="$(python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          manifest = json.loads(Path('frontend-dist-manifest.json').read_text(encoding='utf-8'))
          path = manifest.get('index.html', {}).get('file', '')
          if not re.fullmatch(r'assets/app\.[0-9a-f]{12}\.mjs', path):
              raise SystemExit(f'unexpected app entry: {path!r}')
          print('/' + path)
          PY
          )"
          test -n "$module_path"

          headers=''
          for attempt in $(seq 1 20); do
            if headers="$(curl --fail --silent --show-error --head \
              "http://127.0.0.1:18088${module_path}" 2>/dev/null)"; then
              break
            fi
            sleep 0.25
          done
          test -n "$headers"
          printf '%s\n' "$headers"
          content_type="$(printf '%s\n' "$headers" \
            | awk 'BEGIN { IGNORECASE=1 } /^Content-Type:/ { sub(/\r$/, ""); print $2; exit }')"
          test "$content_type" = 'text/javascript'
          printf '%s\n' "$headers" | grep -Eiq '^Cache-Control:.*immutable'
          printf '%s\n' "$headers" | grep -Eiq '^X-Content-Type-Options:[[:space:]]*nosniff'
          module_csp="$(printf '%s\n' "$headers" \
            | awk 'BEGIN { IGNORECASE=1 } /^Content-Security-Policy:/ { sub(/\r$/, ""); sub(/^[^:]+:[[:space:]]*/, ""); print; exit }')"
          [[ "$module_csp" =~ nonce-[0-9a-f]{32} ]]
          [[ "$module_csp" == *"script-src-attr 'none'"* ]]
          [[ "$module_csp" != *"unsafe-inline"* ]]

          root_headers_a="$(curl --fail --silent --show-error --head \
            http://127.0.0.1:18088/)"
          root_headers_b="$(curl --fail --silent --show-error --head \
            http://127.0.0.1:18088/)"
          csp_a="$(printf '%s\n' "$root_headers_a" \
            | awk 'BEGIN { IGNORECASE=1 } /^Content-Security-Policy:/ { sub(/\r$/, ""); sub(/^[^:]+:[[:space:]]*/, ""); print; exit }')"
          csp_b="$(printf '%s\n' "$root_headers_b" \
            | awk 'BEGIN { IGNORECASE=1 } /^Content-Security-Policy:/ { sub(/\r$/, ""); sub(/^[^:]+:[[:space:]]*/, ""); print; exit }')"
          nonce_a="$(grep -oE 'nonce-[0-9a-f]{32}' <<<"$csp_a" | head -n 1)"
          nonce_b="$(grep -oE 'nonce-[0-9a-f]{32}' <<<"$csp_b" | head -n 1)"
          test -n "$nonce_a"
          test -n "$nonce_b"
          test "$nonce_a" != "$nonce_b"
          [[ "$csp_a" == *"https://static.cloudflareinsights.com/beacon.min.js"* ]]
          [[ "$csp_a" == *"connect-src 'self';"* ]]
          [[ "$csp_a" != *"connect-src 'self' https://cloudflareinsights.com"* ]]

          curl --fail --silent --show-error --head \
            http://127.0.0.1:18088/favicon.svg >/dev/null
          favicon_status="$(curl --silent --show-error --output /dev/null \
            --write-out '%{http_code}' http://127.0.0.1:18088/favicon.ico)"
          test "$favicon_status" = '308'

      - name: Build and verify CV assistant image identity
        shell: bash
        run: |
          set -Eeuo pipefail
          cleanup() {
            rm -f cloudflared.env bot/.env
          }
          trap cleanup EXIT
          install -d -m 0700 bot
          printf 'CF_TUNNEL_TOKEN=ci-placeholder-not-a-secret\n' > cloudflared.env
          : > bot/.env
          chmod 0600 cloudflared.env bot/.env
          export CVBOT_VCS_REF="$GITHUB_SHA"
          export CVBOT_BUILD_INPUT_SHA256="$(python3 scripts/build-input-id.py "$PWD")"
          [[ "$CVBOT_BUILD_INPUT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          image_ref="rozkalns-cv-cvbot:${CVBOT_VCS_REF}"
          CF_TUNNEL_TOKEN='ci-placeholder-not-a-secret' \
            docker compose build cvbot
          docker image inspect "$image_ref" >/dev/null
          revision="$(docker image inspect "$image_ref" \
            --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          build_input="$(docker image inspect "$image_ref" \
            --format '{{index .Config.Labels "net.rozkalns.cv.build-input-sha256"}}')"
          test "$revision" = "$CVBOT_VCS_REF"
          test "$build_input" = "$CVBOT_BUILD_INPUT_SHA256"
          echo "CVBOT_IMAGE_REF=$image_ref" >> "$GITHUB_ENV"
          printf 'CVBOT_IMAGE_IDENTITY=PASS\n'

      - name: Scan CV assistant image for HIGH and CRITICAL vulnerabilities
        shell: bash
        run: |
          set -Eeuo pipefail
          trivy_digest="$(python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('security/supply-chain.json').read_text(encoding='utf-8'))
          print(data['images']['aquasec/trivy:0.72.0'])
          PY
          )"
          [[ "$trivy_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            "aquasec/trivy:0.72.0@${trivy_digest}" \
            image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --no-progress \
            "$CVBOT_IMAGE_REF"

      - name: Revalidate clean source after container checks
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f cloudflared.env bot/.env
          rm -rf node_modules
          bash scripts/validate-source.sh "$PWD"

      - name: Publish test categories
        if: always()
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Executed test categories

          - Flask request validation, streaming payloads, proxy identity, rate limits, privacy and redaction
          - SQLite persistence, retention, UTC reset and pseudonymous identities
          - transactional deploy fault injection, rollback, data ownership and image identity behavior
          - Prometheus parsing, retries, schema validation and atomic stats publication
          - frontend source behavior, Vite manifest integrity, deterministic rebuilds and size budgets
          - real Chromium language, statistics, streaming chat, failure-history and keyboard-flow smoke
          - full Git-history Gitleaks scan with mandatory detector canary
          - pinned nginx configuration plus live module MIME/cache, nonce CSP, inherited security-header and favicon assertions
          - hash-locked CV assistant build and explicit SHA-tagged OCI revision/build-input identity verification
          - pinned Trivy HIGH/CRITICAL image vulnerability gate
          EOF
