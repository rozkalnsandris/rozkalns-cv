name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Install test dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --disable-pip-version-check \
            -r bot/requirements.txt

      - name: Validate source and application behavior
        shell: bash
        run: |
          set -Eeuo pipefail
          . .venv/bin/activate
          bash scripts/validate-source.sh "$PWD"
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Validate nginx runtime configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm \
            --add-host=cvbot:127.0.0.1 \
            --mount "type=bind,src=$PWD/nginx.conf,dst=/etc/nginx/conf.d/default.conf,readonly" \
            nginx:alpine nginx -t

      - name: Build CV assistant image
        shell: bash
        run: |
          set -Eeuo pipefail
          cleanup() {
            rm -f cloudflared.env bot/.env
          }
          trap cleanup EXIT
          install -d -m 0700 bot
          printf 'CF_TUNNEL_TOKEN=ci-placeholder-not-a-secret\n' > cloudflared.env
          : > bot/.env
          chmod 0600 cloudflared.env bot/.env
          CF_TUNNEL_TOKEN='ci-placeholder-not-a-secret' \
            docker compose build cvbot
