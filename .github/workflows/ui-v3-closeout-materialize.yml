name: UI v3 closeout materializer

on:
  push:
    branches:
      - test/ui-v3-closeout-254

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" fetch --no-tags origin "$GITHUB_SHA"
          git checkout -B test/ui-v3-closeout-254 FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Strengthen closeout gates
        shell: bash
        env:
          RESPONSIVE_BLOCK_B64: 
          CLOSEOUT_TEST_B64: 
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          browser_path = Path('tests/browser-smoke.mjs')
          browser = browser_path.read_text(encoding='utf-8')
          start = browser.index('    const responsiveMatrix = [')
          end = browser.index('    await cdp.navigate(`${baseUrl}/smarthome.html`);', start)
          replacement = base64.b64decode(os.environ['RESPONSIVE_BLOCK_B64']).decode('utf-8')
          browser_path.write_text(browser[:start] + replacement + browser[end:], encoding='utf-8')

          contract_path = Path('tests/test_frontend_contract.py')
          contract = contract_path.read_text(encoding='utf-8')
          constant_anchor = 'SOURCE_LAYOUT = ROOT / "frontend" / "styles" / "layout.css"\n'
          if contract.count(constant_anchor) != 1:
              raise SystemExit('base CSS constant anchor mismatch')
          contract = contract.replace(constant_anchor, constant_anchor + 'SOURCE_BASE = ROOT / "frontend" / "styles" / "base.css"\n', 1)
          method_anchor = '    def test_cloudflare_analytics_is_not_manually_embedded(self) -> None:\n'
          if contract.count(method_anchor) != 1:
              raise SystemExit('accessibility method anchor mismatch')
          closeout_test = base64.b64decode(os.environ['CLOSEOUT_TEST_B64']).decode('utf-8')
          contract = contract.replace(method_anchor, closeout_test + method_anchor, 1)
          contract_path.write_text(contract, encoding='utf-8')
          PY
          node --check tests/browser-smoke.mjs
          python3 tests/test_frontend_contract.py
          git diff --check -- tests/browser-smoke.mjs tests/test_frontend_contract.py

      - name: Commit closeout gates
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- tests/browser-smoke.mjs tests/test_frontend_contract.py
          git diff --cached --check
          git commit -m 'test: close out UI v3 responsive accessibility matrix'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" push origin HEAD:refs/heads/test/ui-v3-closeout-254
