name: Sync main into canonical branch

on:
  push:
    branches:
      - refactor/canonical-cv-content-v01
    paths:
      - .github/workflows/sync-main-canonical.yml

permissions:
  contents: write

concurrency:
  group: sync-main-canonical
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Merge current main with a fail-closed conflict policy
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch --no-tags origin \
            "$GITHUB_SHA" \
            main \
            refactor/canonical-cv-content-v01
          git checkout --detach "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse refs/remotes/origin/refactor/canonical-cv-content-v01)" = "$GITHUB_SHA"
          git switch -c refactor/canonical-cv-content-v01
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          set +e
          git merge --no-commit --no-ff refs/remotes/origin/main
          merge_status=$?
          set -e

          conflicts="$(git diff --name-only --diff-filter=U)"
          if [[ -n "$conflicts" && "$conflicts" != 'nginx.conf' ]]; then
            printf 'Unexpected merge conflicts:\n%s\n' "$conflicts" >&2
            git merge --abort || true
            exit 1
          fi
          if [[ "$conflicts" == 'nginx.conf' ]]; then
            git checkout --theirs -- nginx.conf
            git add -- nginx.conf
          elif (( merge_status != 0 )); then
            echo 'Merge failed without the single permitted conflict.' >&2
            git merge --abort || true
            exit 1
          fi

          rm -f .github/workflows/sync-main-canonical.yml
          git add -- .github/workflows/sync-main-canonical.yml
          git diff --cached --check
          git commit -m 'Merge main into canonical content branch'

          remote_head="$(git ls-remote origin refs/heads/refactor/canonical-cv-content-v01 | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            push origin HEAD:refactor/canonical-cv-content-v01
