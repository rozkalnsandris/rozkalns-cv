name: UI dist capture

on:
  push:
    branches:
      - fix/desktop-layout-polish

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact branch SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch --no-tags origin "refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"
          git checkout -B "$GITHUB_REF_NAME" "refs/remotes/origin/${GITHUB_REF_NAME}"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "AUTH_HEADER=AUTHORIZATION: basic ${auth}" >> "$GITHUB_ENV"

      - name: Set up pinned Node.js frontend toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false

      - name: Build deterministic frontend
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:frontend

      - name: Commit generated frontend only
        shell: bash
        run: |
          set -Eeuo pipefail
          git add -A -- html frontend-dist-manifest.json
          test -n "$(git status --short -- html frontend-dist-manifest.json)"
          test -z "$(git status --short --untracked-files=no -- ':!html' ':!frontend-dist-manifest.json' '.github/workflows/ui-dist-capture.yml')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: refresh desktop layout frontend dist"
          git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
