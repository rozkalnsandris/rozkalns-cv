name: Current contact remediation finalizer

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/94-current-contact-finalizer.yml

permissions:
  contents: write

jobs:
  finalize:
    if: >-
      github.repository == 'rozkalnsandris/rozkalns-cv' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'security/94-current-contact-literals-v01'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out exact owner branch head
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" fetch --no-tags origin "$HEAD_SHA" 4f14c8aa9a371f18e782afc2d23c662bce94a990
          git checkout --detach "$HEAD_SHA"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git merge-base "$HEAD_SHA" 4f14c8aa9a371f18e782afc2d23c662bce94a990)" = "4f14c8aa9a371f18e782afc2d23c662bce94a990"

      - name: Install ephemeral PDF redaction dependency
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --disable-pip-version-check --no-input 'PyMuPDF==1.26.4'

      - name: Apply fail-closed current-tree privacy remediation
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile tools/94-current-contact-remediation.py
          python3 tools/94-current-contact-remediation.py

      - name: Validate canonical privacy and generated-content contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m unittest tests.test_content_build tests.test_current_contact_privacy -v
          python3 scripts/build-content.py --check
          python3 scripts/sync-system-prompt.py --check
          rm -rf -- tools/__pycache__ tests/__pycache__ scripts/__pycache__
          bash scripts/validate-source.sh "$PWD"
          python3 - <<'PY'
          import json
          from pathlib import Path
          profile=json.loads(Path('content/profile.json').read_text(encoding='utf-8'))
          assert profile['schema_version'] == 2
          assert profile['contact']['email'] == {'visibility':'runtime-protected'}
          assert profile['contact']['phone'] == {'visibility':'runtime-protected'}
          prompt=Path('bot/system_prompt.txt').read_text(encoding='utf-8')
          assert 'Email:' not in prompt and 'Phone:' not in prompt
          assert 'verified contact section' in prompt.lower()
          print('CURRENT_CONTACT_CANONICAL_GATE=PASS')
          PY

      - name: Verify privacy-clean PDF layout remains one page
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils >/dev/null
          for pdf in html/cv.pdf html/cv-de.pdf html/cv-lv.pdf; do
            pages="$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2; exit}')"
            test "$pages" = '1'
            pdftoppm -f 1 -singlefile -png -r 72 "$pdf" "${RUNNER_TEMP}/$(basename "$pdf" .pdf)" >/dev/null 2>&1
            test -s "${RUNNER_TEMP}/$(basename "$pdf" .pdf).png"
          done
          printf 'PDF_ONE_PAGE_RENDER_GATE=PASS\n'

      - name: Validate final changed-file boundary before cleanup
        shell: bash
        run: |
          set -Eeuo pipefail
          changed="$(git status --porcelain | awk '{print $2}')"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(content/profile\.json|content/profile\.schema\.json|content/pdf-manifest\.json|html/cv\.pdf|html/cv-de\.pdf|html/cv-lv\.pdf|scripts/build-content\.py|scripts/bootstrap-github\.sh|docs/CONTENT_AUTHORING\.md|bot/system_prompt\.txt|bot/app\.py|tests/test_current_contact_privacy\.py)$' || true)"
          test -z "$unexpected" || { printf 'unexpected remediation changes:\n%s\n' "$unexpected" >&2; exit 1; }

      - name: Remove temporary audit and remediation infrastructure
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f -- \
            .github/workflows/94-current-contact-audit.yml \
            .github/workflows/94-pdf-contact-audit.yml \
            .github/workflows/94-pdf-tooling-inventory.yml \
            .github/workflows/94-pdf-redaction-prototype.yml \
            .github/workflows/94-current-contact-finalizer.yml \
            tools/94-current-contact-remediation.py

      - name: Commit validated current-tree remediation
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git add -A
          staged="$(git diff --cached --name-only)"
          test -n "$staged"
          printf '%s\n' "$staged"
          unexpected="$(printf '%s\n' "$staged" | grep -Ev '^(\.github/workflows/94-current-contact-audit\.yml|\.github/workflows/94-pdf-contact-audit\.yml|\.github/workflows/94-pdf-tooling-inventory\.yml|\.github/workflows/94-pdf-redaction-prototype\.yml|\.github/workflows/94-current-contact-finalizer\.yml|tools/94-current-contact-remediation\.py|content/profile\.json|content/profile\.schema\.json|content/pdf-manifest\.json|html/cv\.pdf|html/cv-de\.pdf|html/cv-lv\.pdf|scripts/build-content\.py|scripts/bootstrap-github\.sh|docs/CONTENT_AUTHORING\.md|bot/system_prompt\.txt|bot/app\.py|tests/test_current_contact_privacy\.py)$' || true)"
          test -z "$unexpected" || { printf 'unexpected staged files:\n%s\n' "$unexpected" >&2; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'security: remove current protected contact literals'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          remote_head="$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" ls-remote origin refs/heads/security/94-current-contact-literals-v01 | awk '{print $1}')"
          test "$remote_head" = "$HEAD_SHA"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" push origin HEAD:refs/heads/security/94-current-contact-literals-v01
