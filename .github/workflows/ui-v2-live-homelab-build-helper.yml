name: UI v2 live homelab build helper

on:
  push:
    branches:
      - feat/cv-ui-v2-live-homelab-243

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Set up pinned Node.js frontend toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false
      - name: Rebuild deterministic frontend dist
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:frontend
          npm run check:frontend
          git add -- frontend-dist-manifest.json html/assets html/i18n html/index.html html/smarthome.html
          if git diff --cached --quiet; then
            echo 'Generated frontend dist already matches source.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: refresh live homelab frontend dist'
          git push origin "HEAD:${GITHUB_REF_NAME}"
