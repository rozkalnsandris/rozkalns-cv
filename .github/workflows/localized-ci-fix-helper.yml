name: Localized CI fix helper

on:
  push:
    branches:
      - feat/crawlable-locales-251

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Apply focused CI fixes
        run: python tools/tmp-localized-ci-fix.py
      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false
      - name: Rebuild and validate localized frontend
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:frontend
          npm run check:frontend
          node --test tests/frontend.test.mjs
          python tests/test_accessible_label_i18n.py
          python tests/test_html_semantics.py
          python tests/test_main_document_title.py
          python tests/test_localized_pages.py
          python tests/test_seo_canonical.py
          python tests/test_person_structured_data.py
          python tests/test_sitemap_contract.py
      - name: Commit source and generated fixes
        shell: bash
        run: |
          set -Eeuo pipefail
          git add -- \
            frontend/index.html \
            tests/test_html_semantics.py tests/test_main_document_title.py \
            html/index.html html/en html/de html/lv html/sitemap.xml html/smarthome.html \
            html/assets html/i18n frontend-dist-manifest.json
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: align localized routing contracts'
          git push origin "HEAD:${GITHUB_REF_NAME}"
