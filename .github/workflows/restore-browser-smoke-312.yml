name: Restore browser smoke 312

on:
  push:
    branches:
      - fix/312-recruiter-mobile-ui-polish

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out branch with complete history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Restore full browser smoke and patch lean-hero assertion
        shell: bash
        run: |
          set -Eeuo pipefail
          git show origin/main:tests/browser-smoke.mjs > tests/browser-smoke.mjs
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/browser-smoke.mjs')
          text = path.read_text(encoding='utf-8')
          old = '''    assert.deepEqual(
              await cdp.evaluate(`(() => ({
                language: document.querySelector('.language-switcher')?.getAttribute('aria-label'),
                focus: document.querySelector('.focus-tags')?.getAttribute('aria-label'),
                navigation: document.querySelector('.site-nav')?.getAttribute('aria-label'),
                profileListRole: document.querySelector('.profile-languages')?.getAttribute('role'),
                profileListLabel: document.querySelector('.profile-languages')?.getAttribute('aria-label'),
                profileListItems: [...document.querySelectorAll('.profile-languages .profile-language')].map((item) => item.getAttribute('role'))
              }))()`),
              {
                language: "Valodas",
                focus: null,
                navigation: "CV",
                profileListRole: "list",
                profileListLabel: "Valodas",
                profileListItems: ["listitem", "listitem", "listitem"]
              }
            );'''
          new = '''    assert.equal(
              await cdp.evaluate(`document.querySelector('.focus-tags')`),
              null
            );
            assert.deepEqual(
              await cdp.evaluate(`(() => ({
                language: document.querySelector('.language-switcher')?.getAttribute('aria-label'),
                navigation: document.querySelector('.site-nav')?.getAttribute('aria-label'),
                profileListRole: document.querySelector('.profile-languages')?.getAttribute('role'),
                profileListLabel: document.querySelector('.profile-languages')?.getAttribute('aria-label'),
                profileListItems: [...document.querySelectorAll('.profile-languages .profile-language')].map((item) => item.getAttribute('role'))
              }))()`),
              {
                language: "Valodas",
                navigation: "CV",
                profileListRole: "list",
                profileListLabel: "Valodas",
                profileListItems: ["listitem", "listitem", "listitem"]
              }
            );'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one old browser assertion, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          test "$(wc -c < tests/browser-smoke.mjs)" -gt 45000
          node --check tests/browser-smoke.mjs
          git diff --check

      - name: Commit restored test and remove helper
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/browser-smoke.mjs
          git rm .github/workflows/restore-browser-smoke-312.yml
          git diff --cached --check
          git commit -m 'test: restore Chromium smoke for #312'
          git push origin HEAD:fix/312-recruiter-mobile-ui-polish
