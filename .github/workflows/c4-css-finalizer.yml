name: C4 CSS source finalizer

on:
  push:
    branches:
      - refactor/80-consolidate-css-v01
    paths:
      - .github/workflows/c4-css-finalizer.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.repository == 'rozkalnsandris/rozkalns-cv' && github.ref == 'refs/heads/refactor/80-consolidate-css-v01'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out exact C4 branch SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" fetch --no-tags origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Finalize authoritative CSS source architecture
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')
          index = root / 'frontend/index.html'
          smart = root / 'frontend/smarthome.html'
          validator = root / 'scripts/validate-source.sh'
          contract = root / 'tests/test_frontend_contract.py'
          tokens = root / 'frontend/styles/tokens.css'

          text = index.read_text(encoding='utf-8')
          old = '  <link rel="stylesheet" href="./styles/main.css">\n  <link rel="stylesheet" href="./styles/extra.css">'
          new = '  <link rel="stylesheet" href="./styles/index.css">'
          if text.count(old) != 1:
              raise SystemExit('unexpected CV stylesheet source contract')
          index.write_text(text.replace(old, new), encoding='utf-8')

          text = smart.read_text(encoding='utf-8')
          old = '  <link rel="stylesheet" href="./styles/main.css">'
          new = '  <link rel="stylesheet" href="./styles/index.css">'
          if text.count(old) != 1:
              raise SystemExit('unexpected Smart Home stylesheet source contract')
          smart.write_text(text.replace(old, new), encoding='utf-8')

          text = validator.read_text(encoding='utf-8')
          old = '''    frontend/styles/main.css \\\n    frontend/styles/extra.css \\\n'''
          new = '''    frontend/styles/index.css \\\n    frontend/styles/tokens.css \\\n    frontend/styles/base.css \\\n    frontend/styles/layout.css \\\n    frontend/styles/components.css \\\n    frontend/styles/features/stats.css \\\n    frontend/styles/features/chat.css \\\n    frontend/styles/features/contact.css \\\n    frontend/styles/features/smarthome.css \\\n    frontend/styles/responsive.css \\\n    frontend/styles/print.css \\\n'''
          if text.count(old) != 1:
              raise SystemExit('unexpected validator stylesheet required-file block')
          text = text.replace(old, new)
          old = 'for retired in update.sh update_cv-1.sh cloudflared.env.example; do'
          new = 'for retired in update.sh update_cv-1.sh cloudflared.env.example frontend/styles/main.css frontend/styles/extra.css; do'
          if text.count(old) != 1:
              raise SystemExit('unexpected validator retired-file loop')
          validator.write_text(text.replace(old, new), encoding='utf-8')

          text = contract.read_text(encoding='utf-8')
          old = 'SOURCE_CSS = ROOT / "frontend" / "styles" / "main.css"'
          new = '''STYLE_ROOT = ROOT / "frontend" / "styles"\nSOURCE_CSS_FILES = (\n    STYLE_ROOT / "tokens.css",\n    STYLE_ROOT / "base.css",\n    STYLE_ROOT / "layout.css",\n    STYLE_ROOT / "components.css",\n    STYLE_ROOT / "features" / "stats.css",\n    STYLE_ROOT / "features" / "chat.css",\n    STYLE_ROOT / "features" / "contact.css",\n    STYLE_ROOT / "features" / "smarthome.css",\n    STYLE_ROOT / "responsive.css",\n    STYLE_ROOT / "print.css",\n)'''
          if text.count(old) != 1:
              raise SystemExit('unexpected frontend contract CSS source constant')
          text = text.replace(old, new)
          old = '        css = SOURCE_CSS.read_text(encoding="utf-8")'
          new = '''        css = "\\n".join(\n            path.read_text(encoding="utf-8") for path in SOURCE_CSS_FILES\n        )'''
          if text.count(old) != 1:
              raise SystemExit('unexpected rich-layout CSS read')
          contract.write_text(text.replace(old, new), encoding='utf-8')

          token_text = tokens.read_text(encoding='utf-8')
          needle = '  --section-gap: clamp(46px,6.5vw,68px);\n'
          additions = '''  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 20px;\n  --space-6: 24px;\n  --radius-sm: 7px;\n  --radius-md: 10px;\n  --radius-lg: 12px;\n  --radius-xl: 16px;\n'''
          if additions not in token_text:
              if token_text.count(needle) != 1:
                  raise SystemExit('unexpected token insertion point')
              tokens.write_text(token_text.replace(needle, needle + additions), encoding='utf-8')

          architecture = root / 'tests/test_css_architecture.py'
          architecture.write_text('''from __future__ import annotations\n\nfrom pathlib import Path\nimport re\nimport unittest\n\nROOT = Path(__file__).resolve().parents[1]\nSTYLE_ROOT = ROOT / "frontend" / "styles"\nENTRY = STYLE_ROOT / "index.css"\nMODULES = (\n    "tokens.css",\n    "base.css",\n    "layout.css",\n    "components.css",\n    "features/stats.css",\n    "features/chat.css",\n    "features/contact.css",\n    "features/smarthome.css",\n    "responsive.css",\n    "print.css",\n)\n\n\nclass CssArchitectureTests(unittest.TestCase):\n    def test_one_authoritative_source_entry(self) -> None:\n        cv = (ROOT / "frontend/index.html").read_text(encoding="utf-8")\n        smart = (ROOT / "frontend/smarthome.html").read_text(encoding="utf-8")\n        for html in (cv, smart):\n            self.assertEqual(html.count('./styles/index.css'), 1)\n            self.assertNotIn('./styles/main.css', html)\n            self.assertNotIn('./styles/extra.css', html)\n        self.assertFalse((STYLE_ROOT / "main.css").exists())\n        self.assertFalse((STYLE_ROOT / "extra.css").exists())\n\n    def test_entry_imports_each_responsibility_once_in_order(self) -> None:\n        text = ENTRY.read_text(encoding="utf-8")\n        expected = [f'@import "./{path}";' for path in MODULES]\n        self.assertEqual([line for line in text.splitlines() if line], expected)\n        for relative in MODULES:\n            path = STYLE_ROOT / relative\n            self.assertTrue(path.is_file(), path)\n            self.assertTrue(path.read_text(encoding="utf-8").strip(), path)\n\n    def test_breakpoints_have_one_authoritative_home(self) -> None:\n        responsive = (STYLE_ROOT / "responsive.css").read_text(encoding="utf-8")\n        self.assertEqual(\n            re.findall(r'@media \\(max-width: (\\d+)px\\)', responsive),\n            ["760", "560", "620"],\n        )\n        for relative in MODULES:\n            if relative == "responsive.css":\n                continue\n            self.assertNotIn(\n                "@media (max-width:",\n                (STYLE_ROOT / relative).read_text(encoding="utf-8"),\n                relative,\n            )\n\n    def test_tokens_cover_visual_system(self) -> None:\n        text = (STYLE_ROOT / "tokens.css").read_text(encoding="utf-8")\n        for token in (\n            "--bg:", "--surface:", "--text:", "--accent:",\n            "--sans:", "--mono:", "--section-gap:",\n            "--space-1:", "--space-6:",\n            "--radius-sm:", "--radius-xl:",\n        ):\n            self.assertIn(token, text)\n\n    def test_feature_modules_do_not_add_specificity_shortcuts(self) -> None:\n        for relative in (\n            "layout.css", "components.css", "features/stats.css",\n            "features/chat.css", "features/contact.css",\n            "features/smarthome.css", "responsive.css",\n        ):\n            text = (STYLE_ROOT / relative).read_text(encoding="utf-8")\n            self.assertNotIn("!important", text, relative)\n        components = (STYLE_ROOT / "components.css").read_text(encoding="utf-8")\n        self.assertIn(".skill-chip svg", components)\n        self.assertNotIn(".skill-chip::before", components)\n\n    def test_print_hides_interactive_contact_and_chat_ui(self) -> None:\n        text = (STYLE_ROOT / "print.css").read_text(encoding="utf-8")\n        self.assertIn(".contact-verify", text)\n        self.assertIn(".chat-launcher", text)\n        self.assertIn(".dialog-backdrop", text)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')

          for retired in (root / 'frontend/styles/main.css', root / 'frontend/styles/extra.css'):
              retired.unlink()
          PY

          python3 -m unittest tests.test_css_architecture tests.test_frontend_contract -v

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm

      - name: Rebuild and verify deterministic frontend output
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:frontend
          cp -a html "${RUNNER_TEMP}/c4-first-html"
          cp frontend-dist-manifest.json "${RUNNER_TEMP}/c4-first-manifest.json"
          npm run build:frontend
          diff -ruN "${RUNNER_TEMP}/c4-first-html" html
          cmp "${RUNNER_TEMP}/c4-first-manifest.json" frontend-dist-manifest.json
          npm run check:frontend
          node --test tests/frontend.test.mjs
          python3 -m unittest tests.test_css_architecture tests.test_frontend_contract -v
          bash scripts/validate-source.sh .

      - name: Commit only C4 source, tests and generated frontend
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git add -- \
            frontend/index.html \
            frontend/smarthome.html \
            frontend/styles \
            scripts/validate-source.sh \
            tests/test_frontend_contract.py \
            tests/test_css_architecture.py \
            frontend-dist-manifest.json \
            html/index.html \
            html/smarthome.html \
            html/assets \
            html/i18n
          staged="$(git diff --cached --name-only)"
          test -n "$staged"
          printf '%s\n' "$staged"
          if grep -E '^html/.*\\.pdf$' <<<"$staged"; then
            echo 'PDF files changed unexpectedly' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: consolidate authoritative CSS source'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" push origin HEAD:refs/heads/refactor/80-consolidate-css-v01
