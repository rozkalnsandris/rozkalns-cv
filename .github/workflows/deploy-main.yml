name: Deploy merged main to RPi5

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  resolve:
    name: Resolve successful main CI
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      ci_run_id: ${{ steps.resolve.outputs.ci_run_id }}

    steps:
      - name: Resolve queued merge SHA
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re
          import urllib.parse
          import urllib.request

          repo = os.environ["REPOSITORY"]
          if repo != "rozkalnsandris/rozkalns-cv":
              raise SystemExit("unexpected repository")

          event = json.loads(
              pathlib.Path(os.environ["GITHUB_EVENT_PATH"]).read_text()
          )
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "rozkalns-cv-serial-deploy",
          }

          def get_json(url: str):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)

          main = get_json(f"https://api.github.com/repos/{repo}/branches/main")
          current_main = str(main.get("commit", {}).get("sha", ""))
          if not re.fullmatch(r"[0-9a-f]{40}", current_main):
              raise SystemExit("current main SHA is invalid")

          if os.environ["EVENT_NAME"] == "workflow_run":
              run = event.get("workflow_run") or {}
              if run.get("name") != "CI":
                  raise SystemExit("unexpected source workflow")
              if run.get("event") != "push" or run.get("head_branch") != "main":
                  raise SystemExit("deploy source is not a main push")
              if run.get("status") != "completed":
                  raise SystemExit("source CI is not completed")
              if run.get("conclusion") != "success":
                  raise SystemExit("main CI did not succeed")
              sha = str(run.get("head_sha") or "")
              ci_run_id = int(run.get("id") or 0)
          else:
              sha = current_main
              encoded = urllib.parse.quote(sha, safe="")
              runs = get_json(
                  f"https://api.github.com/repos/{repo}/actions/workflows/ci.yml/runs"
                  f"?branch=main&head_sha={encoded}&status=completed&per_page=100"
              ).get("workflow_runs", [])
              successful = [
                  row for row in runs
                  if row.get("event") == "push"
                  and row.get("head_branch") == "main"
                  and row.get("head_sha") == sha
                  and row.get("conclusion") == "success"
              ]
              if not successful:
                  raise SystemExit(
                      "current main has no successful push CI run"
                  )
              ci_run_id = max(int(row["id"]) for row in successful)

          if not re.fullmatch(r"[0-9a-f]{40}", sha) or ci_run_id <= 0:
              raise SystemExit("resolved deploy identity is invalid")

          if sha != current_main:
              comparison = get_json(
                  f"https://api.github.com/repos/{repo}/compare/{sha}...{current_main}"
              )
              if comparison.get("status") != "ahead":
                  raise SystemExit(
                      "queued SHA is no longer an ancestor of main"
                  )

          output = pathlib.Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as handle:
              handle.write(f"sha={sha}\n")
              handle.write(f"ci_run_id={ci_run_id}\n")

          pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(
              "## rozkalns.net production deploy queued\n\n"
              f"- Merge SHA: `{sha}`\n"
              f"- Successful main CI: `{ci_run_id}`\n"
              "- RPi5 deploys run one at a time on the dedicated CV runner.\n",
              encoding="utf-8",
          )
          PY

  deploy:
    name: Deploy on RPi5
    needs: resolve
    runs-on:
      - self-hosted
      - Linux
      - ARM64
      - rozkalns-cv-release
    timeout-minutes: 30

    steps:
      - name: Verify installed deploy helper matches target source
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.resolve.outputs.sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail
          helper='/usr/local/sbin/rozkalns-cv-deploy-main'
          test -f "$helper"
          test ! -L "$helper"
          expected_blob="$(python3 - <<'PY'
          import json
          import os
          import re
          import urllib.parse
          import urllib.request

          repo = os.environ['REPOSITORY']
          sha = os.environ['TARGET_SHA']
          if repo != 'rozkalnsandris/rozkalns-cv':
              raise SystemExit('unexpected repository')
          if not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise SystemExit('invalid target SHA')
          ref = urllib.parse.quote(sha, safe='')
          path = 'runner/release/rozkalns-cv-deploy-main'
          request = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/contents/{path}?ref={ref}',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'rozkalns-cv-helper-gate',
              },
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              payload = json.load(response)
          blob = str(payload.get('sha') or '')
          if not re.fullmatch(r'[0-9a-f]{40}', blob):
              raise SystemExit('target helper blob SHA is invalid')
          print(blob)
          PY
          )"
          actual_blob="$(git hash-object "$helper")"
          test "$actual_blob" = "$expected_blob"
          test "$(stat -c '%U:%G:%a' "$helper")" = 'root:root:755'
          printf 'INSTALLED_HELPER_IDENTITY=PASS\n'
          printf 'HELPER_BLOB_SHA=%s\n' "$actual_blob"

      - name: Deploy queued merge SHA
        id: deploy
        env:
          TARGET_SHA: ${{ needs.resolve.outputs.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          evidence_dir="${RUNNER_TEMP}/rozkalns-cv-main-deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          install -d -m 0700 "$evidence_dir"
          echo "evidence_dir=$evidence_dir" >> "$GITHUB_OUTPUT"
          sudo --non-interactive /usr/local/sbin/rozkalns-cv-deploy-main \
            "$TARGET_SHA" \
            "$evidence_dir"

      - name: Verify public frontend contracts
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          html="$(mktemp)"
          root_headers="$(mktemp)"
          cleanup_public() {
            rm -f "$html" "$root_headers"
          }
          trap cleanup_public EXIT

          curl --fail --silent --show-error --max-time 20 \
            --dump-header "$root_headers" \
            --output "$html" \
            https://rozkalns.net/

          module_path="$(grep -oE '/assets/app\.[0-9a-f]{12}\.mjs\?cfg=[0-9a-f]{12}' \
            "$html" | head -n 1)"
          test -n "$module_path"
          module_headers="$(curl --fail --silent --show-error --head --max-time 20 \
            "https://rozkalns.net${module_path}")"
          printf '%s\n' "$module_headers"

          content_type="$(printf '%s\n' "$module_headers" \
            | awk 'tolower($1) == "content-type:" { value=$2; sub(/\r$/, "", value); print value; exit }')"
          case "$content_type" in
            text/javascript|application/javascript) ;;
            *)
              printf 'PUBLIC_MODULE_MIME=FAIL content_type=%s\n' "$content_type" >&2
              exit 1
              ;;
          esac
          printf '%s\n' "$module_headers" | grep -Eiq '^Cache-Control:.*immutable'
          printf '%s\n' "$module_headers" | grep -Eiq '^X-Content-Type-Options:[[:space:]]*nosniff'

          csp="$(awk 'tolower($1) == "content-security-policy:" { line=$0; sub(/\r$/, "", line); sub(/^[^:]+:[[:space:]]*/, "", line); print line; exit }' \
            "$root_headers")"
          [[ "$csp" =~ nonce-[0-9a-f]{32} ]]
          [[ "$csp" == *"script-src-attr 'none'"* ]]
          [[ "$csp" == *"https://static.cloudflareinsights.com/beacon.min.js"* ]]
          [[ "$csp" != *"unsafe-inline"* ]]

          printf 'PUBLIC_SITE=PASS\n'
          printf 'PUBLIC_MODULE_MIME=PASS type=%s\n' "$content_type"
          printf 'PUBLIC_CSP_NONCE=PASS\n'

      - name: Upload deploy evidence
        if: always() && steps.deploy.outputs.evidence_dir != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rozkalns-cv-deploy-${{ needs.resolve.outputs.sha }}-run-${{ github.run_id }}
          path: ${{ steps.deploy.outputs.evidence_dir }}
          if-no-files-found: warn
          retention-days: 30
