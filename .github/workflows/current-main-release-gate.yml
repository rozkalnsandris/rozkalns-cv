name: Current main release gate

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/current-main-release-gate.yml

permissions:
  actions: read
  contents: read

jobs:
  verify:
    if: github.repository == 'rozkalnsandris/rozkalns-cv'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Require green current-main CI and deploy
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ['REPOSITORY']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'rozkalns-cv-current-main-release-gate',
          }

          def get(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)

          api = f'https://api.github.com/repos/{repo}'
          main = str(get(f'{api}/branches/main')['commit']['sha'])
          print(f'CURRENT_MAIN={main}')

          ci_runs = get(
              f'{api}/actions/workflows/ci.yml/runs?event=push&status=completed&per_page=100'
          ).get('workflow_runs', [])
          ci_matches = [
              run for run in ci_runs
              if run.get('event') == 'push'
              and run.get('head_branch') == 'main'
              and run.get('head_sha') == main
              and run.get('conclusion') == 'success'
          ]
          if not ci_matches:
              raise SystemExit('CURRENT_MAIN_CI=FAIL')
          ci_run = max(ci_matches, key=lambda row: int(row['id']))
          print(f'CURRENT_MAIN_CI=PASS run_id={ci_run["id"]}')

          deploy_runs = get(
              f'{api}/actions/workflows/deploy-main.yml/runs?status=completed&per_page=100'
          ).get('workflow_runs', [])
          matches = []
          for run in deploy_runs:
              run_id = int(run['id'])
              artifacts = get(f'{api}/actions/runs/{run_id}/artifacts?per_page=100').get('artifacts', [])
              expected_artifact = f'rozkalns-cv-deploy-{main}-run-{run_id}'
              if not any(str(row.get('name')) == expected_artifact for row in artifacts):
                  continue
              jobs = get(f'{api}/actions/runs/{run_id}/jobs?per_page=100').get('jobs', [])
              deploy_job = next((row for row in jobs if row.get('name') == 'Deploy on RPi5'), None)
              if not deploy_job:
                  continue
              steps = {
                  str(step.get('name')): str(step.get('conclusion'))
                  for step in deploy_job.get('steps', [])
              }
              matches.append((run_id, str(run.get('conclusion')), steps, expected_artifact))

          if not matches:
              raise SystemExit('CURRENT_MAIN_DEPLOY=FAIL no completed deploy artifact')

          run_id, conclusion, steps, artifact = max(matches, key=lambda row: row[0])
          print(f'CURRENT_MAIN_DEPLOY_RUN={run_id} conclusion={conclusion}')
          required = (
              'Verify installed deploy helper matches target source',
              'Deploy queued merge SHA',
              'Verify public frontend contracts',
              'Upload deploy evidence',
          )
          for name in required:
              print(f'DEPLOY_STEP name={name} conclusion={steps.get(name)}')
          if conclusion != 'success' or any(steps.get(name) != 'success' for name in required):
              raise SystemExit('CURRENT_MAIN_PRODUCTION_GATE=FAIL')

          print(f'DEPLOY_ARTIFACT={artifact}')
          print('CURRENT_MAIN_PRODUCTION_GATE=PASS')
          PY
