name: C112 current-main retention finalizer

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: c112-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  finalize:
    if: >-
      github.repository == 'rozkalnsandris/rozkalns-cv' &&
      github.actor == 'rozkalnsandris' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/112-chat-retention-expiry-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out exact PR head and validated source
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          VALIDATED_C112: 36d85fe9b29d1d5e7fbd2ae3fed3e5d7a826a597
        shell: bash
        run: |
          set -Eeuo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch --no-tags origin "$EXPECTED_HEAD" "$VALIDATED_C112"
          git checkout -b fix/112-chat-retention-expiry-v2 "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git cat-file -e "$VALIDATED_C112^{commit}"

      - name: Transplant validated C112 files and patch current app
        env:
          VALIDATED_C112: 36d85fe9b29d1d5e7fbd2ae3fed3e5d7a826a597
        shell: bash
        run: |
          set -Eeuo pipefail
          for path in \
            bot/storage.py \
            bot/.env.example \
            docs/CVBOT_DATA_RETENTION.md \
            tests/test_retention_policy.py \
            tests/test_storage.py \
            tests/test_proxy_contract.py \
            tests/test_bot.py \
            tests/test_bot_failures.py
          do
            mkdir -p "$(dirname "$path")"
            git show "$VALIDATED_C112:$path" > "$path"
          done

          python3 - <<'PY'
          from pathlib import Path

          path = Path('bot/app.py')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  'import ipaddress\n',
                  'import atexit\nimport ipaddress\n',
                  'atexit-import',
              ),
              (
                  'CHAT_RETENTION_DAYS = int(os.getenv("CHAT_RETENTION_DAYS", "7"))',
                  'CHAT_RETENTION_DAYS = int(os.getenv("CHAT_RETENTION_DAYS", "0"))',
                  'zero-default',
              ),
              (
                  '    chat_retention_days=CHAT_RETENTION_DAYS,\n)\n\n\n# ---------------- GENERATED KNOWLEDGE (do not edit) ----------------',
                  '    chat_retention_days=CHAT_RETENTION_DAYS,\n)\nSTORE.start_retention_maintenance()\natexit.register(STORE.close)\n\n\n# ---------------- GENERATED KNOWLEDGE (do not edit) ----------------',
                  'store-lifecycle',
              ),
          ]
          for old, new, label in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'C112_V2_PATCH=FAIL anchor={label} count={text.count(old)}')
              text = text.replace(old, new, 1)

          # Preserve the already-merged #119 public-email/protected-phone policy.
          required = (
              'Email: andris@rozkalns.net',
              'Phone and WhatsApp: available only through the verified contact section',
              'The dedicated recruiting email is public and may be provided directly.',
          )
          for marker in required:
              if marker not in text:
                  raise SystemExit(f'C112_V2_PATCH=FAIL missing-main-marker={marker}')

          path.write_text(text, encoding='utf-8')
          print('C112_V2_TRANSPLANT=PASS')
          PY

      - name: Run focused retention and source regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          test_venv="${RUNNER_TEMP}/c112-test-venv"
          python3 -m venv "$test_venv"
          "$test_venv/bin/python" -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            --no-deps \
            -r bot/requirements.lock
          export PYTHONPYCACHEPREFIX="${RUNNER_TEMP}/c112-pycache"
          "$test_venv/bin/python" -m unittest \
            tests.test_storage \
            tests.test_retention_policy \
            tests.test_proxy_contract \
            tests.test_bot \
            tests.test_bot_failures \
            tests.test_content_build \
            tests.test_current_contact_privacy \
            tests.test_deploy_contract
          bash scripts/validate-source.sh "$PWD"
          printf 'C112_V2_REGRESSION=PASS\n'

      - name: Self-clean and guard bounded diff
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/c112-v2-finalizer.yml
          python3 - <<'PY'
          import subprocess

          allowed = {
              '.github/workflows/c112-v2-finalizer.yml',
              'bot/app.py',
              'bot/storage.py',
              'bot/.env.example',
              'docs/CVBOT_DATA_RETENTION.md',
              'tests/test_retention_policy.py',
              'tests/test_storage.py',
              'tests/test_proxy_contract.py',
              'tests/test_bot.py',
              'tests/test_bot_failures.py',
          }
          bad = []
          for row in subprocess.check_output(
              ['git', 'status', '--porcelain=v1', '-uall'], text=True
          ).splitlines():
              candidate = row[3:].split(' -> ', 1)[-1]
              if candidate not in allowed:
                  bad.append(candidate)
          if bad:
              raise SystemExit('unexpected C112 v2 paths: ' + ', '.join(sorted(bad)))
          print('C112_V2_DIFF_SCOPE=PASS')
          PY

      - name: Commit and push bounded C112 result
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git add -- \
            .github/workflows/c112-v2-finalizer.yml \
            bot/app.py bot/storage.py bot/.env.example \
            docs/CVBOT_DATA_RETENTION.md \
            tests/test_retention_policy.py tests/test_storage.py \
            tests/test_proxy_contract.py tests/test_bot.py tests/test_bot_failures.py
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(cvbot): enforce independent raw chat expiry (#112)'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            push origin HEAD:refs/heads/fix/112-chat-retention-expiry-v2
          printf 'C112_V2_FINALIZER=PASS\n'
