name: Sanitized current contact exposure audit

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/94-current-contact-audit.yml

permissions:
  contents: read

jobs:
  audit:
    if: >-
      github.repository == 'rozkalnsandris/rozkalns-cv' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'security/94-current-contact-literals-v01'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact audit SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch --no-tags origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Audit current tracked contact exposure without printing values
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import json
          from pathlib import Path
          import re
          import shutil
          import subprocess

          root = Path.cwd()
          profile = json.loads((root / 'content/profile.json').read_text(encoding='utf-8'))
          email_re = re.compile(r'(?i)[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}')
          phone_re = re.compile(r'(?<!\w)\+?\d(?:[\s()./-]*\d){7,}(?!\w)')

          candidates: list[tuple[str, str, bytes]] = []
          seen: set[bytes] = set()
          contact_structure: list[tuple[str, str, int]] = []

          def classify(text: str) -> str | None:
              if email_re.search(text):
                  return 'email_like'
              if phone_re.search(text):
                  return 'phone_like'
              return None

          def add_candidate(path: str, kind: str, text: str) -> None:
              encoded = text.strip().encode('utf-8')
              if len(encoded) < 6 or encoded in seen:
                  return
              seen.add(encoded)
              candidates.append((path, kind, encoded))

          def walk(value, path: str = '$') -> None:
              if isinstance(value, dict):
                  for key, item in value.items():
                      walk(item, f'{path}.{key}')
                  return
              if isinstance(value, list):
                  for index, item in enumerate(value):
                      walk(item, f'{path}[{index}]')
                  return
              if not isinstance(value, str):
                  return
              text = value.strip()
              kind = classify(text)
              path_lower = path.lower()
              if 'contact' in path_lower or 'email' in path_lower or 'phone' in path_lower or 'mobile' in path_lower:
                  contact_structure.append((path, kind or 'other_string', len(text)))
              if kind:
                  add_candidate(path, kind, text)

          walk(profile)
          print(f'PROFILE_CONTACT_STRUCTURE_COUNT={len(contact_structure)}')
          for index, (path, kind, length) in enumerate(contact_structure, 1):
              print(f'PROFILE_CONTACT_STRUCTURE_{index}=path:{path};kind:{kind};length:{length}')
          print(f'PROTECTED_CANDIDATE_COUNT={len(candidates)}')
          for index, (path, kind, _) in enumerate(candidates, 1):
              print(f'PROTECTED_CANDIDATE_{index}=path:{path};kind:{kind}')

          tracked = subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
          findings: list[list[str]] = [[] for _ in candidates]
          pdf_files: list[Path] = []
          for raw_path in tracked:
              if not raw_path:
                  continue
              relative = raw_path.decode('utf-8', errors='strict')
              path = root / relative
              if not path.is_file():
                  continue
              if path.suffix.lower() == '.pdf':
                  pdf_files.append(path)
                  continue
              data = path.read_bytes()
              for index, (_, _, candidate) in enumerate(candidates):
                  if candidate in data:
                      findings[index].append(relative)

          total_hits = 0
          for index, files in enumerate(findings, 1):
              unique = sorted(set(files))
              total_hits += len(unique)
              print(f'CANDIDATE_{index}_TRACKED_FILE_COUNT={len(unique)}')
              for file_index, relative in enumerate(unique, 1):
                  print(f'CANDIDATE_{index}_TRACKED_FILE_{file_index}={relative}')

          pdf_hit_count = 0
          pdftotext = shutil.which('pdftotext')
          if not pdftotext:
              raise SystemExit('PDF_TEXT_AUDIT=FAIL pdftotext unavailable')
          for path in pdf_files:
              completed = subprocess.run(
                  [pdftotext, '-layout', str(path), '-'],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.DEVNULL,
                  check=True,
              )
              if any(candidate in completed.stdout for _, _, candidate in candidates):
                  pdf_hit_count += 1
                  print(f'PDF_PROTECTED_LITERAL_PRESENT={path.relative_to(root)}')

          profile_hit = any('content/profile.json' in files for files in findings)
          assistant_files = sorted({
              name
              for files in findings
              for name in files
              if name.startswith('bot/')
          })
          print(f'CANONICAL_PROFILE_LITERAL_PRESENT={str(profile_hit).lower()}')
          print(f'GENERATED_ASSISTANT_LITERAL_PRESENT={str(bool(assistant_files)).lower()}')
          for index, name in enumerate(assistant_files, 1):
              print(f'GENERATED_ASSISTANT_LITERAL_FILE_{index}={name}')
          print(f'PDF_PROTECTED_LITERAL_FILE_COUNT={pdf_hit_count}')
          print(f'TRACKED_LITERAL_FILE_HITS={total_hits}')
          if candidates:
              print('CURRENT_CONTACT_LITERAL_AUDIT=FINDINGS' if total_hits or pdf_hit_count else 'CURRENT_CONTACT_LITERAL_AUDIT=CANDIDATES_WITHOUT_TRACKED_MATCHES')
          else:
              print('CURRENT_CONTACT_LITERAL_AUDIT=PASS no email-like or phone-like canonical strings')
          PY
