name: C94 v4 public contact finalizer

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: c94-v4-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  finalize:
    if: >-
      github.repository == 'rozkalnsandris/rozkalns-cv' &&
      github.actor == 'rozkalnsandris' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/94-public-email-whatsapp-qr-v4'
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out exact PR head
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch --no-tags origin "$EXPECTED_HEAD"
          git checkout -b fix/94-public-email-whatsapp-qr-v4 FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Apply fail-closed C94 v4 policy patch
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/c94-v4-apply.py
          PYTHONPYCACHEPREFIX="${RUNNER_TEMP}/syntax-pycache" \
            python3 -m py_compile scripts/c94-v4-apply.py scripts/build-content.py
          node --check frontend/app.mjs
          node --check frontend/features/contact.mjs
          node --check tests/browser-smoke.mjs

      - name: Install locked app and PDF tools
        shell: bash
        run: |
          set -Eeuo pipefail
          test_venv="${RUNNER_TEMP}/c94-test-venv"
          python3 -m venv "$test_venv"
          "$test_venv/bin/python" -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            --no-deps \
            -r bot/requirements.lock
          echo "TEST_VENV=$test_venv" >> "$GITHUB_ENV"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            poppler-utils qpdf python3-reportlab python3-qrcode python3-pil python3-opencv

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false

      - name: Build deterministic frontend
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:frontend
          npm run check:frontend

      - name: Overlay public email and protected-site WhatsApp QR
        shell: bash
        run: |
          set -Eeuo pipefail
          work="${RUNNER_TEMP}/c94-pdf"
          mkdir -p "$work"
          python3 - "$work" <<'PY'
          from pathlib import Path
          import sys
          import qrcode
          from qrcode.constants import ERROR_CORRECT_H
          from PIL import ImageDraw
          from reportlab.lib.colors import HexColor
          from reportlab.lib.pagesizes import A4
          from reportlab.lib.utils import ImageReader
          from reportlab.pdfbase.pdfmetrics import stringWidth
          from reportlab.pdfgen import canvas

          work = Path(sys.argv[1])
          target = 'https://rozkalns.net/?contact=whatsapp'
          email = 'andris@rozkalns.net'

          qr = qrcode.QRCode(error_correction=ERROR_CORRECT_H, box_size=16, border=4)
          qr.add_data(target)
          qr.make(fit=True)
          image = qr.make_image(fill_color='black', back_color='white').convert('RGBA')
          draw = ImageDraw.Draw(image)
          width, height = image.size
          logo = int(min(width, height) * 0.18)
          cx, cy = width // 2, height // 2
          box = (cx - logo // 2, cy - logo // 2, cx + logo // 2, cy + logo // 2)
          draw.ellipse(box, fill=(37, 211, 102, 255))
          inset = int(logo * 0.23)
          handset = (box[0] + inset, box[1] + inset, box[2] - inset, box[3] - inset)
          stroke = max(3, int(logo * 0.09))
          draw.arc(handset, start=120, end=300, fill='white', width=stroke)
          draw.line(
              [(int(cx - logo * 0.18), int(cy + logo * 0.12)),
               (int(cx - logo * 0.29), int(cy + logo * 0.26))],
              fill='white', width=stroke,
          )
          image.save(work / 'whatsapp-qr.png')

          overlay = work / 'contact-overlay.pdf'
          c = canvas.Canvas(str(overlay), pagesize=A4)
          c.setFillColor(HexColor('#737b86'))
          c.setFont('Helvetica', 8.5)
          email_text = ' · ' + email
          email_x, email_y = 160.0, 765.0
          c.drawString(email_x, email_y, email_text)
          c.linkURL(
              'mailto:' + email,
              (email_x, email_y - 2,
               email_x + stringWidth(email_text, 'Helvetica', 8.5), email_y + 9),
              relative=0,
          )
          c.drawImage(
              ImageReader(str(work / 'whatsapp-qr.png')),
              430.0, 775.0, width=50.0, height=50.0,
              preserveAspectRatio=True, mask='auto',
          )
          c.save()
          print('C94_V4_PDF_OVERLAY=PASS')
          PY

          for pdf in html/cv.pdf html/cv-de.pdf html/cv-lv.pdf; do
            test "$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2}')" = '1'
            tmp="${pdf%.pdf}.c94.pdf"
            qpdf "$pdf" --overlay "$work/contact-overlay.pdf" -- "$tmp"
            mv "$tmp" "$pdf"
            test "$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2}')" = '1'
          done

      - name: Bind generated prompt and PDFs
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/build-content.py --write --accept-pdfs
          python3 scripts/sync-system-prompt.py --write
          python3 scripts/build-content.py --check
          python3 scripts/sync-system-prompt.py --check

      - name: Verify PDF email, protected phone and QR
        shell: bash
        run: |
          set -Eeuo pipefail
          preview="${RUNNER_TEMP}/c94-v4-preview"
          mkdir -p "$preview"
          for spec in en:html/cv.pdf de:html/cv-de.pdf lv:html/cv-lv.pdf; do
            IFS=: read -r language pdf <<<"$spec"
            text="${preview}/${language}.txt"
            png="${preview}/${language}"
            urls="${preview}/${language}.urls.txt"
            test "$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2}')" = '1'
            pdftotext "$pdf" "$text"
            grep -Fq 'andris@rozkalns.net' "$text"
            if grep -Eq '\+49[[:space:][:digit:]()/-]{8,}' "$text"; then
              printf 'C94_V4_PDF_PHONE language=%s FAIL\n' "$language" >&2
              exit 1
            fi
            pdfinfo -url "$pdf" >"$urls"
            if grep -Eq 'tel:|https://wa\.me/[0-9]' "$urls"; then
              printf 'C94_V4_PDF_DIRECT_PHONE language=%s FAIL\n' "$language" >&2
              exit 1
            fi
            pdftoppm -f 1 -singlefile -png -r 180 "$pdf" "$png" >/dev/null
            decoded="$(python3 - "${png}.png" <<'PY'
          import cv2
          import sys
          image = cv2.imread(sys.argv[1])
          if image is None:
              raise SystemExit(2)
          data, points, _ = cv2.QRCodeDetector().detectAndDecode(image)
          if points is None:
              raise SystemExit(3)
          print(data, end='')
          PY
            )"
            test "$decoded" = 'https://rozkalns.net/?contact=whatsapp'
            printf 'C94_V4_PDF language=%s pages=1 email=PASS phone=PROTECTED qr=PASS\n' "$language"
          done

      - name: Run focused policy regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          PYTHONPYCACHEPREFIX="${RUNNER_TEMP}/test-pycache" \
            "$TEST_VENV/bin/python" -m unittest \
            tests.test_content_build \
            tests.test_current_contact_privacy \
            tests.test_contact_markup \
            tests.test_contact
          node --test tests/frontend.test.mjs
          npm run check:frontend
          printf 'C94_V4_FOCUSED=PASS\n'

      - name: Revalidate clean source
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf -- node_modules
          test ! -e node_modules
          if find . -path ./.git -prune -o -type d -name __pycache__ -print -quit | grep -q .; then
            printf 'C94_V4_PYCACHE=FAIL\n' >&2
            exit 1
          fi
          bash scripts/validate-source.sh "$PWD"
          printf 'C94_V4_SOURCE=PASS\n'

      - name: Self-clean temporary finalizer files
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/c94-v4-finalizer.yml scripts/c94-v4-apply.py
          python3 - <<'PY'
          import subprocess

          allowed = {
              '.github/workflows/c94-v4-finalizer.yml',
              'scripts/c94-v4-apply.py',
              'scripts/build-content.py',
              'bot/app.py', 'bot/contact.py', 'bot/system_prompt.txt',
              'content/pdf-manifest.json', 'content/profile.json',
              'content/profile.schema.json',
              'docs/CONTENT_AUTHORING.md', 'docs/PUBLIC_READINESS.md',
              'frontend/app.mjs', 'frontend/features/contact.mjs',
              'frontend/index.html', 'frontend-dist-manifest.json',
              'html/index.html', 'html/smarthome.html',
              'html/cv.pdf', 'html/cv-de.pdf', 'html/cv-lv.pdf',
              'tests/browser-smoke.mjs', 'tests/frontend.test.mjs',
              'tests/test_contact.py', 'tests/test_contact_markup.py',
              'tests/test_current_contact_privacy.py',
          }
          prefixes = ('content/translations/', 'html/assets/', 'html/i18n/')
          bad = []
          for row in subprocess.check_output(
              ['git', 'status', '--porcelain=v1', '-uall'], text=True
          ).splitlines():
              path = row[3:].split(' -> ', 1)[-1]
              if path not in allowed and not path.startswith(prefixes):
                  bad.append(path)
          if bad:
              raise SystemExit('unexpected C94 v4 paths: ' + ', '.join(sorted(bad)))
          print('C94_V4_DIFF_SCOPE=PASS')
          PY

      - name: Commit and push bounded C94 v4 result
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git add -- \
            .github/workflows/c94-v4-finalizer.yml \
            scripts/c94-v4-apply.py scripts/build-content.py \
            bot/app.py bot/contact.py bot/system_prompt.txt \
            content/pdf-manifest.json content/profile.json content/profile.schema.json \
            content/translations \
            docs/CONTENT_AUTHORING.md docs/PUBLIC_READINESS.md \
            frontend/app.mjs frontend/features/contact.mjs frontend/index.html \
            frontend-dist-manifest.json \
            html/index.html html/smarthome.html html/cv.pdf html/cv-de.pdf html/cv-lv.pdf \
            html/assets html/i18n \
            tests/browser-smoke.mjs tests/frontend.test.mjs tests/test_contact.py \
            tests/test_contact_markup.py tests/test_current_contact_privacy.py
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'security: publish CV email and verify WhatsApp QR (#94)'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            push origin HEAD:refs/heads/fix/94-public-email-whatsapp-qr-v4
          printf 'C94_V4_FINALIZER=PASS\n'

      - name: Upload sanitized PDF previews
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: c94-v4-pdf-preview
          path: ${{ runner.temp }}/c94-v4-preview/*.png
          retention-days: 2
