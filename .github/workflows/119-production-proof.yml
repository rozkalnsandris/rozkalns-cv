name: C94 final contact production proof

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/119-production-proof.yml

permissions:
  actions: read
  contents: read

jobs:
  verify:
    if: >-
      github.repository == 'rozkalnsandris/rozkalns-cv' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'audit/119-production-proof-v01'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      EXPECTED_MAIN: 5eb2a18d424754ff2019f0fc5cdfaa21d80eb2a3
      REPOSITORY: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Wait for exact main CI and trusted RPi5 deployment
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.parse, urllib.request
          repo=os.environ['REPOSITORY']; expected=os.environ['EXPECTED_MAIN']
          headers={'Accept':'application/vnd.github+json','Authorization':f"Bearer {os.environ['GH_TOKEN']}",'X-GitHub-Api-Version':'2022-11-28','User-Agent':'rozkalns-cv-119-production-proof'}
          def get(url):
              request=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(request,timeout=20) as response: return json.load(response)
          api=f'https://api.github.com/repos/{repo}'; encoded=urllib.parse.quote(expected,safe='')
          deadline=time.monotonic()+30*60; last=None
          while time.monotonic()<deadline:
              main=str(get(f'{api}/branches/main')['commit']['sha'])
              if main != expected:
                  raise SystemExit(f'CURRENT_MAIN_CHANGED expected={expected} actual={main}')
              ci_runs=get(f'{api}/actions/workflows/ci.yml/runs?branch=main&head_sha={encoded}&per_page=30').get('workflow_runs',[])
              ci_ok=[r for r in ci_runs if r.get('event')=='push' and r.get('head_sha')==expected and r.get('conclusion')=='success']
              if not ci_ok:
                  state=('ci',tuple((r.get('id'),r.get('status'),r.get('conclusion')) for r in ci_runs))
                  if state!=last: print(f'WAITING_MAIN_CI={state[1]}'); last=state
                  bad=[r for r in ci_runs if r.get('status')=='completed' and r.get('conclusion') not in (None,'success')]
                  if bad and not any(r.get('status')!='completed' for r in ci_runs): raise SystemExit('exact main CI completed without success')
                  time.sleep(15); continue
              ci=max(ci_ok,key=lambda r:int(r['id']))
              deploy_runs=get(f'{api}/actions/workflows/deploy-main.yml/runs?branch=main&head_sha={encoded}&per_page=50').get('workflow_runs',[])
              matches=[]
              for run in deploy_runs:
                  run_id=int(run['id']); artifact=f'rozkalns-cv-deploy-{expected}-run-{run_id}'
                  artifacts=get(f'{api}/actions/runs/{run_id}/artifacts?per_page=100').get('artifacts',[])
                  if not any(str(a.get('name'))==artifact for a in artifacts): continue
                  jobs=get(f'{api}/actions/runs/{run_id}/jobs?per_page=100').get('jobs',[])
                  job=next((j for j in jobs if j.get('name')=='Deploy on RPi5'),None)
                  if not job: continue
                  steps={str(s.get('name')):str(s.get('conclusion')) for s in job.get('steps',[])}
                  matches.append((run,steps,artifact))
              required=('Verify installed deploy helper matches target source','Deploy queued merge SHA','Verify public frontend contracts','Upload deploy evidence')
              good=[row for row in matches if row[0].get('conclusion')=='success' and all(row[1].get(name)=='success' for name in required)]
              if good:
                  run,steps,artifact=max(good,key=lambda row:int(row[0]['id']))
                  print(f'C94_MAIN_CI=PASS run_id={int(ci["id"])}')
                  print(f'C94_DEPLOY=PASS run_id={int(run["id"])}')
                  for name in required: print(f'C94_DEPLOY_STEP={name}:success')
                  print(f'C94_DEPLOY_ARTIFACT={artifact}')
                  print('C94_FINAL_CONTACT_PRODUCTION_GATE=PASS')
                  break
              state=('deploy',tuple((r.get('id'),r.get('status'),r.get('conclusion')) for r in deploy_runs))
              if state!=last: print(f'WAITING_DEPLOY={state[1]}'); last=state
              bad=[r for r in deploy_runs if r.get('status')=='completed' and r.get('conclusion') not in (None,'success')]
              if bad and not any(r.get('status')!='completed' for r in deploy_runs): raise SystemExit('exact deploy completed without success')
              time.sleep(15)
          else:
              raise SystemExit('timed out waiting for exact main CI/deploy')
          PY
