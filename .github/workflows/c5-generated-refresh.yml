name: C5 generated frontend refresh

on:
  push:
    branches:
      - perf/82-reduce-initial-background-work-v01
    paths:
      - .github/workflows/c5-generated-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.repository == 'rozkalnsandris/rozkalns-cv' && github.ref == 'refs/heads/perf/82-reduce-initial-background-work-v01'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out exact owner branch SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" fetch --no-tags origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Run focused C5 source tests
        shell: bash
        run: |
          set -Eeuo pipefail
          node --test tests/frontend.test.mjs

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm

      - name: Build deterministic frontend twice
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:frontend
          cp -a html "${RUNNER_TEMP}/c5-first-html"
          cp frontend-dist-manifest.json "${RUNNER_TEMP}/c5-first-manifest.json"
          npm run build:frontend
          diff -ruN "${RUNNER_TEMP}/c5-first-html" html
          cmp "${RUNNER_TEMP}/c5-first-manifest.json" frontend-dist-manifest.json
          npm run check:frontend
          node --test tests/frontend.test.mjs

      - name: Run real Chromium behavior smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          chrome_bin=''
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then
              chrome_bin="$(command -v "$candidate")"
              break
            fi
          done
          test -n "$chrome_bin"
          CHROME_BIN="$chrome_bin" node tests/browser-smoke.mjs

      - name: Commit only generated frontend output and remove refresher
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f -- .github/workflows/c5-generated-refresh.yml
          git add -- \
            .github/workflows/c5-generated-refresh.yml \
            frontend-dist-manifest.json \
            html/index.html \
            html/smarthome.html \
            html/assets \
            html/i18n
          staged="$(git diff --cached --name-only)"
          test -n "$staged"
          printf '%s\n' "$staged"
          if grep -E '^html/.*\.pdf$' <<<"$staged"; then
            echo 'PDF files changed unexpectedly' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: refresh C5 lazy frontend dist'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" push origin HEAD:refs/heads/perf/82-reduce-initial-background-work-v01
