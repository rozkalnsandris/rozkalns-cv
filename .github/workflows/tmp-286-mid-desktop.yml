name: Temporary #286 mid-desktop build

on:
  push:
    branches:
      - fix/286-mid-desktop-header

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" fetch --no-tags origin fix/286-mid-desktop-header
          git checkout -B fix/286-mid-desktop-header FETCH_HEAD

      - name: Apply #286 source and browser regression
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          responsive = Path('frontend/styles/responsive.css')
          css = responsive.read_text()
          desktop_header = ''.join((
              '  .hero-shell {\n',
              '    grid-template-columns: auto minmax(0,1fr) 260px;\n',
              '    grid-template-areas:\n',
              '      "brand nav lang"\n',
              '      "name name photo"\n',
              '      "role role photo"\n',
              '      "tagline tagline photo"\n',
              '      "contacts contacts photo"\n',
              '      "focus focus photo"\n',
              '      "langs langs photo"\n',
              '      "actions actions photo"\n',
              '      "verify verify photo";\n',
              '    gap: 7px 28px;\n',
              '    padding-block: 20px 21px;\n',
              '    padding-inline: 26px;\n',
              '  }\n',
              '  .hero-shell::before { width: 320px; height: 320px; inset-block-start: -156px; inset-inline-end: -90px; }\n',
              '  .brand { font-size: 24px; }\n',
              '  .site-nav { justify-content: center; overflow: visible; }\n',
              '  .site-nav a { padding-inline: 13px; }\n',
              '  .language-switcher { align-self: center; }\n',
              '  .profile-photo { width: 100%; height: 100%; min-height: 286px; max-height: 330px; border-radius: 24px; }\n',
              '  .hero-shell h1 { align-self: end; max-width: 12ch; font-size: clamp(56px,5.2vw,74px); }\n',
              '  .role { font-size: 15px; }\n',
              '  .tagline { max-width: 48ch; font-size: 18px; line-height: 1.55; }\n',
              '  .contacts { display: flex; flex-wrap: wrap; gap: 2px 18px; padding: 0; border: 0; border-radius: 0; background: transparent; box-shadow: none; }\n',
              '  .contact-row { min-height: 30px; }\n',
              '  .focus-tags { max-width: 52ch; }\n',
          ))
          education_grid = '  .education-list { grid-template-columns: repeat(3,minmax(0,1fr)); gap: 0 24px; }\n'
          css = replace_once(css, desktop_header, '', '900px desktop hero rules')
          css = replace_once(css, education_grid, '', '900px education grid')
          css += '\n@media (min-width: 1120px) {\n' + desktop_header + education_grid + '}\n'
          responsive.write_text(css)

          smoke = Path('tests/browser-smoke.mjs')
          js = smoke.read_text()
          js = replace_once(
              js,
              '''      { width: 768, height: 1024, mobile: false },\n      { width: 1280, height: 900, mobile: false },''',
              '''      { width: 768, height: 1024, mobile: false },\n      { width: 900, height: 900, mobile: false },\n      { width: 1024, height: 900, mobile: false },\n      { width: 1100, height: 900, mobile: false },\n      { width: 1280, height: 900, mobile: false },''',
              'responsive matrix'
          )
          js = replace_once(
              js,
              '''          const locationRow = document.querySelector('#profileLocation')?.closest('.contact-row');\n          const primaryTargets = [...document.querySelectorAll(''',
              '''          const locationRow = document.querySelector('#profileLocation')?.closest('.contact-row');\n          const headerElement = document.querySelector('.hero-shell');\n          const headerRect = headerElement?.getBoundingClientRect();\n          const navigationElement = document.querySelector('.site-nav');\n          const navigationRect = navigationElement?.getBoundingClientRect();\n          const languageElement = document.querySelector('.language-switcher');\n          const languageRect = languageElement?.getBoundingClientRect();\n          const primaryTargets = [...document.querySelectorAll(''',
              'header geometry setup'
          )
          js = replace_once(
              js,
              '''            bodyScrollWidth: document.body.scrollWidth,\n            page:''',
              '''            bodyScrollWidth: document.body.scrollWidth,\n            overflowingElements: [...document.querySelectorAll('body *')].map((element) => {\n              const rect = element.getBoundingClientRect();\n              return {\n                tag: element.tagName,\n                id: element.id || '',\n                className: typeof element.className === 'string' ? element.className : '',\n                left: rect.left,\n                right: rect.right,\n                width: rect.width\n              };\n            }).filter((item) => item.left < -1 || item.right > document.documentElement.clientWidth + 1).slice(0, 12),\n            internalOverflow: [...document.querySelectorAll('body *')].filter((element) => element.scrollWidth > element.clientWidth + 1).map((element) => ({\n              tag: element.tagName,\n              id: element.id || '',\n              className: typeof element.className === 'string' ? element.className : '',\n              clientWidth: element.clientWidth,\n              scrollWidth: element.scrollWidth,\n              text: (element.textContent || '').trim().replace(/\\s+/g, ' ').slice(0, 160)\n            })).slice(0, 16),\n            page:''',
              'overflow diagnostics'
          )
          js = replace_once(
              js,
              '''            page: page ? { left: page.left, right: page.right, width: page.width } : null,\n            launcher:''',
              '''            page: page ? { left: page.left, right: page.right, width: page.width } : null,\n            header: headerRect ? { left: headerRect.left, right: headerRect.right } : null,\n            navigation: navigationElement && navigationRect ? {\n              left: navigationRect.left,\n              right: navigationRect.right,\n              clientWidth: navigationElement.clientWidth,\n              scrollWidth: navigationElement.scrollWidth\n            } : null,\n            languageSwitcher: languageRect ? { left: languageRect.left, right: languageRect.right } : null,\n            launcher:''',
              'header geometry result'
          )
          js = replace_once(
              js,
              '''        assert.ok(layout.page.right <= viewport.width + 0.5, `${context} page right overflow`);\n        assert.ok(layout.launcher, `${context} chat launcher missing`);''',
              '''        assert.ok(layout.page.right <= viewport.width + 0.5, `${context} page right overflow`);\n        if (viewport.width >= 900) {\n          assert.ok(layout.header, `${context} hero header missing`);\n          assert.ok(layout.navigation, `${context} navigation missing`);\n          assert.ok(layout.languageSwitcher, `${context} language switcher missing`);\n          assert.ok(\n            layout.navigation.left >= layout.header.left - 0.5 && layout.navigation.right <= layout.header.right + 0.5,\n            `${context} navigation outside hero: ${JSON.stringify(layout)}`\n          );\n          assert.ok(\n            layout.navigation.scrollWidth <= layout.navigation.clientWidth + 1,\n            `${context} navigation overflow: ${JSON.stringify(layout.navigation)}`\n          );\n          assert.ok(\n            layout.languageSwitcher.left >= layout.header.left - 0.5 && layout.languageSwitcher.right <= layout.header.right + 0.5,\n            `${context} language switcher outside hero: ${JSON.stringify(layout.languageSwitcher)}`\n          );\n        }\n        assert.ok(layout.launcher, `${context} chat launcher missing`);''',
              'header geometry assertions'
          )
          smoke.write_text(js)
          PY

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false

      - name: Build and validate
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:frontend
          npm run check:frontend
          node --check tests/browser-smoke.mjs
          node --test tests/frontend.test.mjs
          chrome_bin=''
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then
              chrome_bin="$(command -v "$candidate")"
              break
            fi
          done
          test -n "$chrome_bin"
          CHROME_BIN="$chrome_bin" node tests/browser-smoke.mjs

      - name: Commit validated source and deterministic output
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/styles/responsive.css tests/browser-smoke.mjs frontend-dist-manifest.json html
          git diff --cached --quiet && exit 1
          git commit -m 'fix: stabilize mid-desktop responsive layout'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" push origin HEAD:fix/286-mid-desktop-header
