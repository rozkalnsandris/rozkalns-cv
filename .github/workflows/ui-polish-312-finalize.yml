name: UI polish 312 finalize

on:
  push:
    branches:
      - fix/312-recruiter-mobile-ui-polish

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false

      - name: Build and validate final frontend
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:frontend
          npm run check:frontend
          node --check frontend/app.mjs
          node --test tests/frontend.test.mjs
          python3 -m unittest \
            tests.test_accessible_label_i18n \
            tests.test_css_source_contract \
            tests.test_frontend_contract \
            tests.test_ui_polish_312
          git diff --check

      - name: Commit deterministic output and remove helper
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf node_modules
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- frontend-dist-manifest.json html
          git rm -- .github/workflows/ui-polish-312-finalize.yml
          git diff --cached --check
          git status --short
          git commit -m 'ci: refresh #312 deterministic frontend'
          git push origin HEAD:fix/312-recruiter-mobile-ui-polish
