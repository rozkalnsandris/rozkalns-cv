name: Issue 397 398 candidate materializer

on:
  push:
    branches:
      - fix/398-copy-397-pdf

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact workflow SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch --no-tags origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up pinned Node.js frontend toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false

      - name: Materialize fact-preserving copy candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "${RUNNER_TEMP}/baseline"
          cp html/cv.pdf "${RUNNER_TEMP}/baseline/cv.pdf"
          cp html/cv-de.pdf "${RUNNER_TEMP}/baseline/cv-de.pdf"
          cp html/cv-lv.pdf "${RUNNER_TEMP}/baseline/cv-lv.pdf"

          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new):
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old!r}")
              file.write_text(text.replace(old, new), encoding="utf-8")

          replacements = {
              "content/profile.json": [
                  ('"content_version": "2026-08-18.1"', '"content_version": "2026-08-31.1"'),
                  ('"Built process discipline and reliability transferable to IT operations"', '"Maintained reliable, process-focused work across rotating logistics shifts"'),
                  ('"role": "Painting Area Manager / Main Paint Sprayer"', '"role": "Paint Shop Supervisor / Lead Sprayer"'),
                  ('"title": "Production Linux server stack"', '"title": "Self-hosted Linux server environment"'),
              ],
              "content/translations/en.json": [
                  ('"about_p1": "I am a self-taught Linux and DevOps engineer based in Dortmund, deliberately returning to IT after a long logistics career. My first hands-on experience came at school, where I administered Linux game servers over SSH and FTP, maintained PHP forums and built HTML websites."', '"about_p1": "I\u0027m based in Dortmund and have learned Linux and DevOps through self-study. After a long career in logistics, I\u0027m deliberately returning to IT. I first gained hands-on experience at school by administering Linux game servers over SSH/FTP, maintaining PHP forums and building HTML websites."'),
                  ('"about_p2": "Today I design, deploy and operate a production Raspberry Pi 5 homelab with Docker, monitoring, DNS, automation and AI services running around the clock. I am looking for a Junior DevOps or Linux Systems Administrator role and am available from January 2027."', '"about_p2": "Today I design, automate and operate a self-hosted Raspberry Pi 5 environment running 24/7 with Docker, monitoring, DNS and AI services. I am looking for a Junior DevOps or Linux Systems Administrator role and am available from January 2027."'),
                  ('"e1_b3": "Process discipline and reliability directly transferable to IT operations."', '"e1_b3": "Reliable, process-focused work across rotating logistics shifts."'),
                  ('"e2_title": "Painting Area Manager / Main Paint Sprayer"', '"e2_title": "Paint Shop Supervisor / Lead Sprayer"'),
                  ('"p1_title": "Production Linux server stack"', '"p1_title": "Self-hosted Linux server environment"'),
                  ('"footer": "Served live from a Raspberry Pi 5 I build, operate and monitor."', '"footer": "This site runs on a Raspberry Pi 5 that I build, operate and monitor myself."'),
                  ('"smart_intro": "A simplified, non-interactive view inspired by my production dashboard."', '"smart_intro": "A simplified, non-interactive view inspired by my Home Assistant dashboard."'),
              ],
              "content/translations/de.json": [
                  ('"role": "Junior DevOps- & Linux-Engineer"', '"role": "Junior DevOps & Linux Engineer"'),
                  ('"tagline": "Ich baue und automatisiere zuverlässige Linux-Infrastruktur – zunehmend mit KI-Agenten. Diese Seite läuft darauf."', '"tagline": "Ich baue und automatisiere zuverlässige Linux-Infrastruktur – zunehmend mit Unterstützung von KI-Agenten. Diese Website läuft auf meiner eigenen Infrastruktur."'),
                  ('"about_p1": "Ich bin ein autodidaktischer Linux- und DevOps-Engineer aus Dortmund und kehre nach einer langen Laufbahn in der Logistik bewusst in die IT zurück. Meine ersten praktischen Erfahrungen sammelte ich in der Schulzeit mit Linux-Spieleservern über SSH/FTP, PHP-Foren und HTML-Websites."', '"about_p1": "Linux und DevOps habe ich mir im Selbststudium angeeignet. Ich lebe in Dortmund und kehre nach einer langen Laufbahn in der Logistik bewusst in die IT zurück. Meine ersten praktischen Erfahrungen sammelte ich bereits in der Schulzeit: Linux-Spieleserver über SSH/FTP administrieren, PHP-Foren pflegen und HTML-Websites erstellen."'),
                  ('"about_p2": "Heute entwerfe, deploye und betreibe ich ein produktives Raspberry-Pi-5-Homelab mit Docker, Monitoring, DNS, Automatisierung und KI-Diensten rund um die Uhr. Ich suche eine Position als Junior DevOps- oder Linux-Systemadministrator und bin ab Januar 2027 verfügbar."', '"about_p2": "Heute konzipiere, automatisiere und betreibe ich eine selbst gehostete Raspberry-Pi-5-Umgebung, die rund um die Uhr läuft – mit Docker, Monitoring, DNS und KI-Diensten. Ich suche eine Position als Junior DevOps Engineer oder Linux-Systemadministrator und bin ab Januar 2027 verfügbar."'),
                  ('"e1_b2": "Kabelkonfektionierung, Staplerbetrieb und Schichtlogistik."', '"e1_b2": "Kabelkonfektionierung, Staplerfahren und Arbeit im Schichtbetrieb."'),
                  ('"e1_b3": "Prozessdisziplin und Zuverlässigkeit, direkt übertragbar auf den IT-Betrieb."', '"e1_b3": "Verlässliche, prozessorientierte Arbeit bei hohem Auftragsvolumen und im Schichtbetrieb."'),
                  ('"e2_title": "Leiter Lackiererei / Hauptlackierer"', '"e2_title": "Leiter der Lackiererei / Hauptlackierer"'),
                  ('"p1_title": "Produktiver Linux-Server-Stack"', '"p1_title": "Selbst gehostete Linux-Serverumgebung"'),
                  ('"ed2_sub": "Rīga Stradiņš University · Teilstudium"', '"ed2_sub": "Rīga Stradiņš University · Studium ohne Abschluss"'),
                  ('"ed3_title": "Sekundarschulabschluss"', '"ed3_title": "Sekundarschulbildung"'),
                  ('"footer": "Live ausgeliefert von einem Raspberry Pi 5, den ich selbst aufbaue, betreibe und überwache."', '"footer": "Diese Website läuft auf einem Raspberry Pi 5, den ich selbst aufbaue, betreibe und überwache."'),
                  ('"smart_intro": "Eine vereinfachte, nicht interaktive Ansicht meines produktiven Dashboards."', '"smart_intro": "Eine vereinfachte, nicht interaktive Ansicht meines Home-Assistant-Dashboards."'),
              ],
              "content/translations/lv.json": [
                  ('"about_p1": "Esmu pašmācības ceļā apguvis Linux un DevOps un dzīvoju Dortmundē. Pēc ilgas karjeras loģistikā apzināti atgriežos IT. Pirmo praktisko pieredzi ieguvu skolā, administrējot Linux spēļu serverus ar SSH/FTP, uzturot PHP forumus un veidojot HTML lapas."', '"about_p1": "Linux un DevOps esmu apguvis pašmācībā un dzīvoju Dortmundē. Pēc ilgas karjeras loģistikā apzināti atgriežos IT. Pirmo praktisko pieredzi ieguvu jau skolas laikā, administrējot Linux spēļu serverus ar SSH/FTP, uzturot PHP forumus un veidojot HTML vietnes."'),
                  ('"about_p2": "Šobrīd projektēju, izvietoju un uzturu 24/7 darbojošos Raspberry Pi 5 mājas serveri ar Docker, monitoringu, DNS, automatizāciju un AI servisiem. Meklēju Junior DevOps vai Linux sistēmu administratora darbu un esmu pieejams no 2027. gada janvāra."', '"about_p2": "Šobrīd projektēju, automatizēju un uzturu 24/7 pašhostētu Raspberry Pi 5 servera vidi ar Docker, monitoringu, DNS un AI servisiem. Meklēju Junior DevOps vai Linux sistēmu administratora darbu un esmu pieejams no 2027. gada janvāra."'),
                  ('"e1_org": "Sonepar Deutschland · Dortmunde"', '"e1_org": "Sonepar Deutschland · Dortmund"'),
                  ('"e1_b3": "Procesu disciplīna un uzticamība, kas tieši pārnesama uz IT uzturēšanu."', '"e1_b3": "Konsekvents un uzticams darbs pēc noteiktiem procesiem lielā pasūtījumu apjomā un maiņās."'),
                  ('"p1_title": "Produkcijas Linux servera steks"', '"p1_title": "Pašhostēta Linux servera vide"'),
                  ('"p3_desc": "Prometheus, Grafana un eksportētāji ar tiešiem veselības un veiktspējas rādītājiem."', '"p3_desc": "Prometheus, Grafana un eksportētāji ar reāllaika sistēmas stāvokļa un veiktspējas rādītājiem."'),
                  ('"footer": "Lapa tiek servēta no Raspberry Pi 5, ko pats būvēju, uzturu un uzraugu."', '"footer": "Šī lapa darbojas uz Raspberry Pi 5, ko pats būvēju, uzturu un uzraugu."'),
                  ('"smart_intro": "Vienkāršots, neinteraktīvs skats, kas veidots pēc mana produkcijas paneļa parauga."', '"smart_intro": "Vienkāršots, neinteraktīvs skats, kas veidots pēc mana Home Assistant paneļa parauga."'),
              ],
          }

          for path, pairs in replacements.items():
              for old, new in pairs:
                  replace_exact(path, old, new)
          PY

          python3 -m json.tool content/profile.json >/dev/null
          for language in en de lv; do
            python3 -m json.tool "content/translations/${language}.json" >/dev/null
          done

          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:frontend
          python3 scripts/sync-system-prompt.py --write

      - name: Generate tagged PDF candidate with Chromium
        shell: bash
        run: |
          set -Eeuo pipefail
          chrome_bin=''
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then
              chrome_bin="$(command -v "$candidate")"
              break
            fi
          done
          test -n "$chrome_bin"
          echo "CHROME_BIN=$chrome_bin" >> "$GITHUB_ENV"

          cat > "${RUNNER_TEMP}/generate-pdfs.mjs" <<'NODE'
          import { spawn } from "node:child_process";
          import { mkdtemp, readFile, rm, writeFile } from "node:fs/promises";
          import { tmpdir } from "node:os";
          import { join } from "node:path";
          import { setTimeout as delay } from "node:timers/promises";

          const chromeBin = process.env.CHROME_BIN;
          const baseUrl = process.env.PDF_BASE_URL;
          if (!chromeBin || !baseUrl || typeof WebSocket !== "function") throw new Error("missing Chromium PDF prerequisites");

          async function readPort(profile) {
            const file = join(profile, "DevToolsActivePort");
            const deadline = Date.now() + 20000;
            while (Date.now() < deadline) {
              try {
                const [line] = (await readFile(file, "utf8")).trim().split(/\r?\n/);
                if (/^[0-9]+$/.test(line)) return Number(line);
              } catch {}
              await delay(100);
            }
            throw new Error("Chrome did not publish DevToolsActivePort");
          }

          async function fetchJson(url, options = {}) {
            const deadline = Date.now() + 20000;
            let last;
            while (Date.now() < deadline) {
              try {
                const response = await fetch(url, options);
                if (response.ok) return await response.json();
                last = new Error(`${response.status} ${response.statusText}`);
              } catch (error) { last = error; }
              await delay(100);
            }
            throw last || new Error(`timed out fetching ${url}`);
          }

          class Cdp {
            constructor(url) { this.socket = new WebSocket(url); this.id = 1; this.pending = new Map(); this.events = new Map(); }
            async open() {
              await new Promise((resolve, reject) => {
                this.socket.addEventListener("open", resolve, { once: true });
                this.socket.addEventListener("error", () => reject(new Error("CDP open failed")), { once: true });
              });
              this.socket.addEventListener("message", (event) => {
                const msg = JSON.parse(String(event.data));
                if (msg.id) {
                  const p = this.pending.get(msg.id); if (!p) return;
                  this.pending.delete(msg.id); msg.error ? p.reject(new Error(msg.error.message)) : p.resolve(msg.result || {}); return;
                }
                for (const callback of this.events.get(msg.method) || []) callback(msg.params || {});
              });
            }
            send(method, params = {}) {
              const id = this.id++;
              return new Promise((resolve, reject) => { this.pending.set(id, { resolve, reject }); this.socket.send(JSON.stringify({ id, method, params })); });
            }
            wait(method, timeout = 15000) {
              return new Promise((resolve, reject) => {
                const callbacks = this.events.get(method) || new Set();
                const timer = setTimeout(() => { callbacks.delete(done); reject(new Error(`timeout ${method}`)); }, timeout);
                const done = (params) => { clearTimeout(timer); callbacks.delete(done); resolve(params); };
                callbacks.add(done); this.events.set(method, callbacks);
              });
            }
            close() { this.socket.close(); }
          }

          const profile = await mkdtemp(join(tmpdir(), "rozkalns-pdf-"));
          const chrome = spawn(chromeBin, [
            "--headless=new", "--no-sandbox", "--disable-gpu", "--disable-dev-shm-usage",
            "--disable-background-networking", "--disable-component-update", "--disable-default-apps",
            "--disable-sync", "--metrics-recording-only", "--no-first-run", "--remote-debugging-port=0",
            `--user-data-dir=${profile}`, "about:blank"
          ], { stdio: ["ignore", "ignore", "pipe"] });
          let stderr = ""; chrome.stderr.on("data", (chunk) => { stderr += chunk.toString(); });
          let cdp;
          try {
            const port = await readPort(profile);
            const target = await fetchJson(`http://127.0.0.1:${port}/json/new?about:blank`, { method: "PUT" });
            cdp = new Cdp(target.webSocketDebuggerUrl); await cdp.open();
            await cdp.send("Page.enable");
            await cdp.send("Emulation.setScriptExecutionDisabled", { value: true });
            for (const [language, output] of [["en", "html/cv.pdf"], ["de", "html/cv-de.pdf"], ["lv", "html/cv-lv.pdf"]]) {
              const loaded = cdp.wait("Page.loadEventFired");
              await cdp.send("Page.navigate", { url: `${baseUrl}/${language}/` });
              await loaded;
              const result = await cdp.send("Page.printToPDF", {
                landscape: false,
                displayHeaderFooter: false,
                printBackground: true,
                paperWidth: 8.27,
                paperHeight: 11.69,
                marginTop: 0.25,
                marginBottom: 0.25,
                marginLeft: 0.35,
                marginRight: 0.35,
                preferCSSPageSize: false,
                generateTaggedPDF: true,
                generateDocumentOutline: true
              });
              if (!result.data) throw new Error(`no PDF data for ${language}`);
              await writeFile(output, Buffer.from(result.data, "base64"));
            }
          } finally {
            try { cdp?.close(); } catch {}
            if (chrome.exitCode === null) chrome.kill("SIGTERM");
            await delay(250);
            if (chrome.exitCode === null) chrome.kill("SIGKILL");
            await rm(profile, { recursive: true, force: true });
          }
          if (stderr && chrome.exitCode && chrome.exitCode !== 0) throw new Error(stderr);
          NODE

          python3 -m http.server 18089 --bind 127.0.0.1 --directory html >"${RUNNER_TEMP}/pdf-http.log" 2>&1 &
          http_pid=$!
          cleanup_http() { kill "$http_pid" >/dev/null 2>&1 || true; }
          trap cleanup_http EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18089/en/ >/dev/null; then break; fi
            sleep 0.2
          done
          curl --fail --silent http://127.0.0.1:18089/en/ >/dev/null

          CHROME_BIN="$chrome_bin" PDF_BASE_URL='http://127.0.0.1:18089' node "${RUNNER_TEMP}/generate-pdfs.mjs"
          cp "${RUNNER_TEMP}/generate-pdfs.mjs" scripts/generate-pdfs.mjs

          python3 scripts/build-content.py --write --accept-pdfs
          python3 scripts/sync-system-prompt.py --write

          for pdf in html/cv.pdf html/cv-de.pdf html/cv-lv.pdf; do
            test -s "$pdf"
            printf '%s ' "$pdf"
            sha256sum "$pdf"
            python3 - "$pdf" <<'PY'
          import re, sys
          data = open(sys.argv[1], 'rb').read()
          print(f"PDF_BYTES={len(data)} PAGE_OBJECTS={len(re.findall(rb'/Type\s*/Page\b', data))} LANG_PRESENT={b'/Lang' in data} STRUCT_TREE={b'/StructTreeRoot' in data}")
          PY
          done

          git diff --check

      - name: Export baseline and candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          out="${RUNNER_TEMP}/issue397398-artifact"
          mkdir -p "$out/baseline" "$out/candidate"
          cp "${RUNNER_TEMP}/baseline/"*.pdf "$out/baseline/"
          git status --porcelain=v1 > "$out/git-status.txt"
          git diff --name-status > "$out/diff-name-status.txt"
          git diff --stat > "$out/diff-stat.txt"
          git diff -- . ':(exclude)html/cv.pdf' ':(exclude)html/cv-de.pdf' ':(exclude)html/cv-lv.pdf' > "$out/text.patch"
          while IFS=$'\t' read -r status path rest; do
            case "$status" in
              D*) continue ;;
              R*) path="$rest" ;;
            esac
            if [[ -f "$path" ]]; then
              install -D "$path" "$out/candidate/$path"
            fi
          done < "$out/diff-name-status.txt"
          install -D scripts/generate-pdfs.mjs "$out/candidate/scripts/generate-pdfs.mjs"
          cp html/cv.pdf html/cv-de.pdf html/cv-lv.pdf "$out/candidate/html/"

      - name: Upload audited candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: issue397398-candidate
          if-no-files-found: error
          retention-days: 1
          path: ${{ runner.temp }}/issue397398-artifact
