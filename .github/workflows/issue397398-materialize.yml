name: Issue 397 398 candidate finalizer

on:
  push:
    branches:
      - fix/398-copy-397-pdf

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact workflow SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" fetch --no-tags origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up pinned Node.js frontend toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false

      - name: Install PDF inspection tools
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils
          command -v pdfinfo
          command -v pdftotext

      - name: Rebuild and verify audited candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:frontend
          python3 scripts/sync-system-prompt.py --write

          chrome_bin=''
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then chrome_bin="$(command -v "$candidate")"; break; fi
          done
          test -n "$chrome_bin"
          CHROME_BIN="$chrome_bin" node scripts/generate-pdfs.mjs

          python3 scripts/build-content.py --write --accept-pdfs
          python3 scripts/sync-system-prompt.py --write
          python3 scripts/check-pdfs.py --write
          python3 scripts/build-content.py --check
          python3 scripts/check-pdfs.py
          git diff --check

          expected="${RUNNER_TEMP}/expected-generated.txt"
          actual="${RUNNER_TEMP}/actual-generated.txt"
          cat > "$expected" <<'EOF'
          bot/system_prompt.txt
          content/pdf-manifest.json
          content/pdf-provenance.json
          frontend-dist-manifest.json
          html/assets/app.7d367ca4ad62.mjs
          html/assets/app.ade90c17116a.mjs
          html/assets/i18n.26a2b77fd831.mjs
          html/assets/i18n.adf62a050548.mjs
          html/assets/smarthome.553a812904af.mjs
          html/assets/smarthome.8c1c264f6d2f.mjs
          html/cv-de.pdf
          html/cv-lv.pdf
          html/cv.pdf
          html/de/index.html
          html/en/index.html
          html/i18n/de.7d1171bd0e54.json
          html/i18n/de.b6096e285e72.json
          html/i18n/en.9053a48ffd4a.json
          html/i18n/en.a01bd0261269.json
          html/i18n/lv.21648fe72bbd.json
          html/i18n/lv.e4f5e26919f9.json
          html/index.html
          html/lv/index.html
          html/smarthome.html
          EOF
          git status --porcelain=v1 | sed -E 's/^.. //' | sort > "$actual"
          sort -o "$expected" "$expected"
          diff -u "$expected" "$actual"
          printf 'FINALIZER_ALLOWLIST=PASS\n'

      - name: Commit exact generated candidate and remove finalizer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          current_remote="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test "$current_remote" = "$GITHUB_SHA"

          git add -A -- \
            bot/system_prompt.txt \
            content/pdf-manifest.json content/pdf-provenance.json \
            frontend-dist-manifest.json \
            html/assets html/i18n \
            html/index.html html/smarthome.html \
            html/en/index.html html/de/index.html html/lv/index.html \
            html/cv.pdf html/cv-de.pdf html/cv-lv.pdf
          git rm .github/workflows/issue397398-materialize.yml

          expected="${RUNNER_TEMP}/expected-staged.txt"
          actual="${RUNNER_TEMP}/actual-staged.txt"
          cat > "$expected" <<'EOF'
          .github/workflows/issue397398-materialize.yml
          bot/system_prompt.txt
          content/pdf-manifest.json
          content/pdf-provenance.json
          frontend-dist-manifest.json
          html/assets/app.7d367ca4ad62.mjs
          html/assets/app.ade90c17116a.mjs
          html/assets/i18n.26a2b77fd831.mjs
          html/assets/i18n.adf62a050548.mjs
          html/assets/smarthome.553a812904af.mjs
          html/assets/smarthome.8c1c264f6d2f.mjs
          html/cv-de.pdf
          html/cv-lv.pdf
          html/cv.pdf
          html/de/index.html
          html/en/index.html
          html/i18n/de.7d1171bd0e54.json
          html/i18n/de.b6096e285e72.json
          html/i18n/en.9053a48ffd4a.json
          html/i18n/en.a01bd0261269.json
          html/i18n/lv.21648fe72bbd.json
          html/i18n/lv.e4f5e26919f9.json
          html/index.html
          html/lv/index.html
          html/smarthome.html
          EOF
          git diff --cached --name-only | sort > "$actual"
          sort -o "$expected" "$expected"
          diff -u "$expected" "$actual"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: materialize audited localized CV PDFs (#397 #398)'
          final_sha="$(git rev-parse HEAD)"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          printf 'FINAL_SHA=%s\n' "$final_sha"
