name: Issue 397 398 candidate materializer

on:
  push:
    branches:
      - fix/398-copy-397-pdf

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact workflow SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" fetch --no-tags origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up pinned Node.js frontend toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false

      - name: Build source and generate canonical PDFs
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "${RUNNER_TEMP}/baseline" "${RUNNER_TEMP}/inspection"
          cp html/cv.pdf html/cv-de.pdf html/cv-lv.pdf "${RUNNER_TEMP}/baseline/"

          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:frontend
          python3 scripts/sync-system-prompt.py --write

          chrome_bin=''
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then chrome_bin="$(command -v "$candidate")"; break; fi
          done
          test -n "$chrome_bin"
          CHROME_BIN="$chrome_bin" node scripts/generate-pdfs.mjs

          command -v pdfinfo
          command -v pdftotext
          for spec in 'en html/cv.pdf' 'de html/cv-de.pdf' 'lv html/cv-lv.pdf'; do
            set -- $spec
            language="$1"; pdf="$2"
            pdfinfo "$pdf" > "${RUNNER_TEMP}/inspection/${language}-pdfinfo.txt"
            test "$(awk -F: '/^Pages:/ {gsub(/ /, "", $2); print $2}' "${RUNNER_TEMP}/inspection/${language}-pdfinfo.txt")" = '1'
            pdftotext -layout "$pdf" "${RUNNER_TEMP}/inspection/${language}-text.txt"
            test -s "${RUNNER_TEMP}/inspection/${language}-text.txt"
          done

          grep -Fq 'Paint Shop Supervisor / Lead Sprayer' "${RUNNER_TEMP}/inspection/en-text.txt"
          grep -Fq 'Self-hosted Linux server environment' "${RUNNER_TEMP}/inspection/en-text.txt"
          grep -Fq 'Leiter der Lackiererei / Hauptlackierer' "${RUNNER_TEMP}/inspection/de-text.txt"
          grep -Fq 'Selbst gehostete Linux-Serverumgebung' "${RUNNER_TEMP}/inspection/de-text.txt"
          grep -Fq 'Sonepar Deutschland · Dortmund' "${RUNNER_TEMP}/inspection/lv-text.txt"
          grep -Fq 'Pašhostēta Linux servera vide' "${RUNNER_TEMP}/inspection/lv-text.txt"

          for forbidden in '14-year logistics' '12+ Docker services' '100% uptime' 'CI/CD-style' 'Remote-friendly' '44319 Dortmund'; do
            ! grep -Fqi "$forbidden" "${RUNNER_TEMP}/inspection/en-text.txt"
            ! grep -Fqi "$forbidden" "${RUNNER_TEMP}/inspection/de-text.txt"
            ! grep -Fqi "$forbidden" "${RUNNER_TEMP}/inspection/lv-text.txt"
          done

          python3 scripts/build-content.py --write --accept-pdfs
          python3 scripts/sync-system-prompt.py --write
          python3 scripts/build-content.py --check
          git diff --check

      - name: Export candidate and inspection evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          out="${RUNNER_TEMP}/issue397398-candidate-v2"
          mkdir -p "$out/baseline" "$out/candidate/html/en" "$out/candidate/html/de" "$out/candidate/html/lv" "$out/candidate/content" "$out/candidate/bot" "$out/inspection"
          cp "${RUNNER_TEMP}/baseline/"*.pdf "$out/baseline/"
          cp html/cv.pdf html/cv-de.pdf html/cv-lv.pdf "$out/candidate/html/"
          cp html/en/index.html "$out/candidate/html/en/index.html"
          cp html/de/index.html "$out/candidate/html/de/index.html"
          cp html/lv/index.html "$out/candidate/html/lv/index.html"
          cp frontend-dist-manifest.json "$out/candidate/frontend-dist-manifest.json"
          cp content/pdf-manifest.json "$out/candidate/content/pdf-manifest.json"
          cp bot/system_prompt.txt "$out/candidate/bot/system_prompt.txt"
          cp "${RUNNER_TEMP}/inspection/"* "$out/inspection/"
          git status --porcelain=v1 > "$out/git-status.txt"
          git diff --stat > "$out/diff-stat.txt"
          git diff --name-status > "$out/diff-name-status.txt"

      - name: Upload audited candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: issue397398-candidate-v2
          if-no-files-found: error
          retention-days: 1
          path: ${{ runner.temp }}/issue397398-candidate-v2
