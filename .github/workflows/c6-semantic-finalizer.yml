name: C6 semantic finalizer

on:
  push:
    branches:
      - a11y/84-semantic-interaction-v01
    paths:
      - .github/workflows/c6-semantic-finalizer.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.repository == 'rozkalnsandris/rozkalns-cv' && github.ref == 'refs/heads/a11y/84-semantic-interaction-v01'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out exact owner branch SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" fetch --no-tags origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git merge-base "$GITHUB_SHA" a044e4c612f4952e0d59a8b2b76779137f92d06e)" = "a044e4c612f4952e0d59a8b2b76779137f92d06e"

      - name: Apply fail-closed C6 source refactor
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile tools/c6-semantic-refactor.py
          python3 tools/c6-semantic-refactor.py
          test "$(grep -c '<dialog id="chatDialog"' frontend/index.html)" -eq 1
          test "$(grep -c 'chatBackdrop' frontend/index.html || true)" -eq 0
          test "$(grep -c 'role="group" aria-label="Language"' frontend/index.html)" -eq 1
          test "$(grep -c 'role="group" aria-label="Language"' frontend/smarthome.html)" -eq 1
          test "$(grep -c '<article class="demo-device card"><h3' frontend/smarthome.html)" -eq 8
          ! grep -Fq 'shell.inert' frontend/features/chat.mjs
          ! grep -Fq 'focusableElements' frontend/features/chat.mjs
          ! grep -Fq 'button.disabled = true' frontend/features/contact.mjs

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Build twice and validate focused C6 contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:frontend
          first="${RUNNER_TEMP}/c6-first.sha256"
          second="${RUNNER_TEMP}/c6-second.sha256"
          {
            find html/assets html/i18n -type f -print0
            printf '%s\0' html/index.html html/smarthome.html frontend-dist-manifest.json
          } | sort -z | xargs -0 sha256sum > "$first"
          npm run build:frontend
          {
            find html/assets html/i18n -type f -print0
            printf '%s\0' html/index.html html/smarthome.html frontend-dist-manifest.json
          } | sort -z | xargs -0 sha256sum > "$second"
          cmp "$first" "$second"
          npm run check:frontend
          node --check frontend/app.mjs
          node --check frontend/features/chat.mjs
          node --check frontend/features/contact.mjs
          node --check tests/browser-smoke.mjs
          node --test tests/frontend.test.mjs
          python3 -m unittest tests.test_html_semantics tests.test_contact_markup tests.test_frontend_contract -v

      - name: Run real Chromium C6 smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          chrome_bin=''
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then
              chrome_bin="$(command -v "$candidate")"
              break
            fi
          done
          test -n "$chrome_bin"
          browser_log="${RUNNER_TEMP}/c6-browser-smoke.log"
          CHROME_BIN="$chrome_bin" node tests/browser-smoke.mjs | tee "$browser_log"
          grep -Fq 'BROWSER_SMOKE=PASS' "$browser_log"

      - name: Validate clean source and changed-file boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf -- node_modules tools/__pycache__
          bash scripts/validate-source.sh "$PWD"
          changed="$(git status --short)"
          printf '%s\n' "$changed"
          test -n "$changed"
          if grep -E '^.. html/.*\.pdf$' <<<"$changed"; then
            echo 'PDF files changed unexpectedly' >&2
            exit 1
          fi
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -Ev '^(.github/workflows/c6-semantic-finalizer.yml|tools/c6-semantic-refactor.py|docs/A11Y_C6_AUDIT.md|frontend/index.html|frontend/smarthome.html|frontend/features/chat.mjs|frontend/features/contact.mjs|frontend/styles/features/chat.css|frontend/styles/features/smarthome.css|frontend/styles/responsive.css|tests/frontend.test.mjs|tests/test_html_semantics.py|tests/browser-smoke.mjs|frontend-dist-manifest.json|html/index.html|html/smarthome.html|html/assets/|html/i18n/)' || true)"
          test -z "$unexpected" || { printf 'unexpected changes:\n%s\n' "$unexpected" >&2; exit 1; }

      - name: Commit validated C6 source and generated dist
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f -- .github/workflows/c6-semantic-finalizer.yml tools/c6-semantic-refactor.py
          git add -A -- \
            .github/workflows/c6-semantic-finalizer.yml \
            tools/c6-semantic-refactor.py \
            docs/A11Y_C6_AUDIT.md \
            frontend/index.html frontend/smarthome.html \
            frontend/features/chat.mjs frontend/features/contact.mjs \
            frontend/styles/features/chat.css frontend/styles/features/smarthome.css frontend/styles/responsive.css \
            tests/frontend.test.mjs tests/test_html_semantics.py tests/browser-smoke.mjs \
            frontend-dist-manifest.json html/index.html html/smarthome.html html/assets html/i18n
          staged="$(git diff --cached --name-only)"
          test -n "$staged"
          printf '%s\n' "$staged"
          if grep -E '^html/.*\.pdf$' <<<"$staged"; then
            echo 'PDF files changed unexpectedly' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'a11y: use native dialog and harden interaction semantics'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" push origin HEAD:refs/heads/a11y/84-semantic-interaction-v01
