name: Sync main into browser CI branch

on:
  push:
    branches:
      - test/browser-behavior-ci-v01
    paths:
      - .github/workflows/sync-main-browser-ci.yml

permissions:
  contents: write

concurrency:
  group: sync-main-browser-ci
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Merge current main with a fail-closed conflict policy
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch --no-tags origin \
            "$GITHUB_SHA" \
            main \
            test/browser-behavior-ci-v01
          git checkout --detach "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse refs/remotes/origin/test/browser-behavior-ci-v01)" = "$GITHUB_SHA"
          git switch -c test/browser-behavior-ci-v01
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          set +e
          git merge --no-commit --no-ff refs/remotes/origin/main
          merge_status=$?
          set -e

          conflicts="$(git diff --name-only --diff-filter=U | sort)"
          allowed=$'.github/workflows/ci.yml\nnginx.conf'
          if [[ -n "$conflicts" && "$conflicts" != 'nginx.conf' \
                && "$conflicts" != '.github/workflows/ci.yml' \
                && "$conflicts" != "$allowed" ]]; then
            printf 'Unexpected merge conflicts:\n%s\n' "$conflicts" >&2
            git merge --abort || true
            exit 1
          fi
          if grep -Fxq 'nginx.conf' <<<"$conflicts"; then
            git checkout --theirs -- nginx.conf
            git add -- nginx.conf
          fi
          if grep -Fxq '.github/workflows/ci.yml' <<<"$conflicts"; then
            git checkout --ours -- .github/workflows/ci.yml
            git add -- .github/workflows/ci.yml
          fi
          if (( merge_status != 0 )) && [[ -z "$conflicts" ]]; then
            echo 'Merge failed without an allowed conflict.' >&2
            git merge --abort || true
            exit 1
          fi

          rm -f .github/workflows/sync-main-browser-ci.yml
          git add -- .github/workflows/sync-main-browser-ci.yml
          git diff --cached --check
          git commit -m 'Merge main into browser CI branch'

          remote_head="$(git ls-remote origin refs/heads/test/browser-behavior-ci-v01 | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            push origin HEAD:test/browser-behavior-ci-v01
