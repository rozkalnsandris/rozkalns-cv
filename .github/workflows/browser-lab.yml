name: Browser lab synthetic stability

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: browser-lab-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  synthetic-browser-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out exact workflow SHA with complete history
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch --no-tags --prune origin \
            '+refs/heads/*:refs/remotes/origin/*'
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch --no-tags origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse --is-shallow-repository)" = false

      - name: Set up pinned Node.js browser-lab toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false

      - name: Build deterministic frontend fixture
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:frontend
          npm run check:frontend
          git diff --exit-code -- \
            package-lock.json frontend-dist-manifest.json \
            html/assets html/i18n html/index.html html/smarthome.html \
            html/proof.html html/en/proof html/de/proof html/lv/proof

      - name: Run repeated synthetic visual/loading stability gate
        shell: bash
        run: |
          set -Eeuo pipefail
          chrome_bin=''
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then
              chrome_bin="$(command -v "$candidate")"
              break
            fi
          done
          test -n "$chrome_bin"
          node --check tests/browser-lab.mjs
          node --check tests/browser-lab-support.mjs
          node --check tests/browser-runtime-errors.mjs
          node --check tests/browser-no-js.mjs
          lab_log="${RUNNER_TEMP}/browser-lab.log"
          : > "$lab_log"
          for repeat in 1 2 3; do
            printf 'LAB_SYNTHETIC_REPEAT=%s\n' "$repeat" | tee -a "$lab_log"
            CHROME_BIN="$chrome_bin" node tests/browser-lab.mjs | tee -a "$lab_log"
          done
          CHROME_BIN="$chrome_bin" node tests/browser-lab-support.mjs | tee -a "$lab_log"
          CHROME_BIN="$chrome_bin" node tests/browser-runtime-errors.mjs | tee -a "$lab_log"
          CHROME_BIN="$chrome_bin" node tests/browser-no-js.mjs | tee -a "$lab_log"
          grep -Fq 'LAB_SYNTHETIC_REGRESSION_DETECTOR=PASS' "$lab_log"
          grep -Fq 'LAB_SYNTHETIC_NOT_FIELD_CWV=PASS' "$lab_log"
          grep -Fq 'BROWSER_LAB_STABILITY=PASS' "$lab_log"
          grep -Fq 'LAB_SUPPORT_SURFACES=PASS' "$lab_log"
          grep -Fq 'BROWSER_LAB_SUPPORT_STABILITY=PASS' "$lab_log"
          grep -Fq 'LAB_RUNTIME_EXCEPTION_DETECTOR=PASS' "$lab_log"
          grep -Fq 'LAB_UNHANDLED_REJECTION_DETECTOR=PASS' "$lab_log"
          grep -Fq 'LAB_CONSOLE_ERROR_DETECTOR=PASS' "$lab_log"
          grep -Fq 'LAB_RUNTIME_CLEAN_SURFACES=PASS' "$lab_log"
          grep -Fq 'BROWSER_RUNTIME_ERRORS=PASS' "$lab_log"
          grep -Fq 'LAB_NO_JS_RECRUITER_PATH=PASS' "$lab_log"
          grep -Fq 'BROWSER_NO_JS=PASS' "$lab_log"
          {
            echo '## Deterministic browser lab'
            echo
            echo 'Synthetic/lab evidence only; this is not field Core Web Vitals or CrUX evidence.'
            echo
            echo '```text'
            tail -n 120 "$lab_log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
