name: C7 photo candidate audit

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/c7-photo-candidates.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out exact PR head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" fetch --no-tags origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Install WebP measurement tool
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends webp
          cwebp -version

      - name: Encode full-resolution WebP candidates
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "${RUNNER_TEMP}/c7-photo"
          cp html/photo.jpg "${RUNNER_TEMP}/c7-photo/original.jpg"
          original_bytes="$(stat -c '%s' html/photo.jpg)"
          printf 'ORIGINAL_JPEG_BYTES=%s\n' "$original_bytes"
          for quality in 80 85 90; do
            output="${RUNNER_TEMP}/c7-photo/photo-q${quality}.webp"
            log="${RUNNER_TEMP}/c7-photo/q${quality}.log"
            cwebp -preset photo -q "$quality" -m 6 -mt -print_psnr -print_ssim \
              html/photo.jpg -o "$output" 2>&1 | tee "$log"
            bytes="$(stat -c '%s' "$output")"
            savings="$(python3 - "$original_bytes" "$bytes" <<'PY'
          import sys
          old = int(sys.argv[1])
          new = int(sys.argv[2])
          print(f'{(old-new)*100/old:.2f}')
          PY
            )"
            printf 'WEBP_Q%s_BYTES=%s\n' "$quality" "$bytes"
            printf 'WEBP_Q%s_SAVINGS_PERCENT=%s\n' "$quality" "$savings"
          done
          file "${RUNNER_TEMP}/c7-photo/"*.webp

      - name: Upload visual comparison candidates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: c7-photo-candidates-${{ github.sha }}
          path: ${{ runner.temp }}/c7-photo
          if-no-files-found: error
          retention-days: 7
