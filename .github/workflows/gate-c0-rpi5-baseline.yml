name: Gate C0 RPi5 read-only baseline

on:
  pull_request:
    paths:
      - .github/workflows/gate-c0-rpi5-baseline.yml
      - tools/c0-browser-baseline.mjs
      - tools/c0-rpi5-baseline.sh

permissions:
  actions: read
  contents: read

jobs:
  baseline:
    if: github.event.pull_request.head.ref == 'audit/gate-c0-baseline-70'
    runs-on:
      - self-hosted
      - Linux
      - ARM64
      - rozkalns-cv-release
    timeout-minutes: 35

    steps:
      - name: Check out exact audit revision in isolated runner workspace
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$PWD" != /home/andris/rozkalns-cv
          test "$PWD" != /home/andris/docker/cv
          case "$PWD" in
            /home/github-cv-runner/actions-runner/_work/*) ;;
            *) printf 'unexpected runner workspace: %s\n' "$PWD" >&2; exit 1 ;;
          esac
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init .
          git remote remove origin >/dev/null 2>&1 || true
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*'
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch --no-tags origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          git clean -ffdx
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'ISOLATED_CHECKOUT=PASS\n'

      - name: Capture Gate C0 production before-state read-only
        id: capture
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n tools/c0-rpi5-baseline.sh
          node --check tools/c0-browser-baseline.mjs
          bash tools/c0-rpi5-baseline.sh
          cat "${RUNNER_TEMP}/gate-c0-rpi5-$(git rev-parse refs/remotes/origin/main)-${GITHUB_RUN_ID}/SUMMARY.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Prove production boundary after capture
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$PWD" != /home/andris/rozkalns-cv
          test "$PWD" != /home/andris/docker/cv
          test ! -e cloudflared.env
          test ! -e bot/.env
          printf 'PRODUCTION_WRITE=false\n'
          printf 'DOCKER_ACCESS=false\n'
          printf 'SUDO_USED=false\n'

      - name: Upload Gate C0 RPi5 evidence
        if: always() && steps.capture.outputs.out != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-c0-rpi5-${{ steps.capture.outputs.sha }}-run-${{ github.run_id }}
          path: ${{ steps.capture.outputs.out }}
          if-no-files-found: error
          retention-days: 90
