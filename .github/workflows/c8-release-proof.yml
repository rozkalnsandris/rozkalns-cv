name: C8 production release proof

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/c8-release-proof.yml

permissions:
  actions: read
  contents: read

jobs:
  verify:
    if: >-
      github.repository == 'rozkalnsandris/rozkalns-cv' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'audit/101-final-production-proof-v01'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require exact C8 main CI and production deploy
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_MAIN: 4f14c8aa9a371f18e782afc2d23c662bce94a990
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          repo = os.environ['REPOSITORY']
          expected = os.environ['EXPECTED_MAIN']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'rozkalns-cv-c8-release-proof',
          }
          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=20) as response:
                  return json.load(response)
          api = f'https://api.github.com/repos/{repo}'
          main = str(get(f'{api}/branches/main')['commit']['sha'])
          if main != expected:
              raise SystemExit(f'CURRENT_MAIN_CHANGED expected={expected} actual={main}')
          print(f'CURRENT_MAIN={main}')
          ci_runs = get(f'{api}/actions/workflows/ci.yml/runs?event=push&status=completed&per_page=100').get('workflow_runs', [])
          ci = [r for r in ci_runs if r.get('head_branch') == 'main' and r.get('head_sha') == expected and r.get('conclusion') == 'success']
          if not ci:
              raise SystemExit('C8_MAIN_CI=FAIL')
          ci_run = max(ci, key=lambda r: int(r['id']))
          print(f'C8_MAIN_CI=PASS run_id={ci_run["id"]}')
          deploy_runs = get(f'{api}/actions/workflows/deploy-main.yml/runs?status=completed&per_page=100').get('workflow_runs', [])
          candidates = []
          for run in deploy_runs:
              run_id = int(run['id'])
              artifact_name = f'rozkalns-cv-deploy-{expected}-run-{run_id}'
              artifacts = get(f'{api}/actions/runs/{run_id}/artifacts?per_page=100').get('artifacts', [])
              if not any(str(a.get('name')) == artifact_name for a in artifacts):
                  continue
              jobs = get(f'{api}/actions/runs/{run_id}/jobs?per_page=100').get('jobs', [])
              job = next((j for j in jobs if j.get('name') == 'Deploy on RPi5'), None)
              if not job:
                  continue
              steps = {str(s.get('name')): str(s.get('conclusion')) for s in job.get('steps', [])}
              candidates.append((run_id, str(run.get('conclusion')), steps, artifact_name))
          if not candidates:
              raise SystemExit('C8_PRODUCTION_DEPLOY=FAIL no exact-SHA deploy artifact')
          run_id, conclusion, steps, artifact = max(candidates, key=lambda row: row[0])
          required = (
              'Verify installed deploy helper matches target source',
              'Deploy queued merge SHA',
              'Verify public frontend contracts',
              'Upload deploy evidence',
          )
          print(f'C8_DEPLOY_RUN={run_id} conclusion={conclusion}')
          for name in required:
              print(f'DEPLOY_STEP name={name} conclusion={steps.get(name)}')
          if conclusion != 'success' or any(steps.get(name) != 'success' for name in required):
              raise SystemExit('C8_PRODUCTION_GATE=FAIL')
          print(f'DEPLOY_ARTIFACT={artifact}')
          print('C8_PRODUCTION_GATE=PASS')
          PY
