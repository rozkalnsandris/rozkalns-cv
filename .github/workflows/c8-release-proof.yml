name: C8 production release proof

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/c8-release-proof.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Prove exact merged C8 production release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: 4f14c8aa9a371f18e782afc2d23c662bce94a990
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import time
          import urllib.parse
          import urllib.request

          repo = os.environ['REPOSITORY']
          target = os.environ['TARGET_SHA']
          if repo != 'rozkalnsandris/rozkalns-cv':
              raise SystemExit('unexpected repository')
          if not re.fullmatch(r'[0-9a-f]{40}', target):
              raise SystemExit('invalid target SHA')

          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'rozkalns-cv-c8-release-proof',
          }

          def get_json(url: str):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)

          base = f'https://api.github.com/repos/{repo}'
          encoded = urllib.parse.quote(target, safe='')
          ci = None
          deploy = None
          deadline = time.monotonic() + 20 * 60

          while time.monotonic() < deadline:
              ci_runs = get_json(
                  f'{base}/actions/workflows/ci.yml/runs?branch=main&head_sha={encoded}&status=completed&per_page=100'
              ).get('workflow_runs', [])
              successful_ci = [
                  row for row in ci_runs
                  if row.get('event') == 'push'
                  and row.get('head_branch') == 'main'
                  and row.get('head_sha') == target
                  and row.get('conclusion') == 'success'
              ]
              if successful_ci:
                  ci = max(successful_ci, key=lambda row: int(row['id']))

              deploy_runs = get_json(
                  f'{base}/actions/workflows/deploy-main.yml/runs?status=completed&per_page=100'
              ).get('workflow_runs', [])
              successful_deploys = [
                  row for row in deploy_runs
                  if row.get('event') == 'workflow_run'
                  and row.get('head_branch') == 'main'
                  and row.get('head_sha') == target
                  and row.get('conclusion') == 'success'
              ]
              if successful_deploys:
                  deploy = max(successful_deploys, key=lambda row: int(row['id']))

              if ci and deploy:
                  break
              time.sleep(15)

          if not ci:
              raise SystemExit('exact merged C8 SHA has no successful main push CI')
          if not deploy:
              raise SystemExit('exact merged C8 SHA has no successful serial deploy workflow')

          deploy_id = int(deploy['id'])
          jobs = get_json(f'{base}/actions/runs/{deploy_id}/jobs?per_page=100').get('jobs', [])
          required = {
              'Resolve successful main CI': {'Resolve queued merge SHA'},
              'Deploy on RPi5': {
                  'Verify installed deploy helper matches target source',
                  'Deploy queued merge SHA',
                  'Verify public frontend contracts',
                  'Upload deploy evidence',
              },
          }
          by_name = {str(job.get('name')): job for job in jobs}
          for job_name, step_names in required.items():
              job = by_name.get(job_name)
              if not job or job.get('conclusion') != 'success':
                  raise SystemExit(f'required deploy job not successful: {job_name}')
              steps = {str(step.get('name')): step for step in job.get('steps', [])}
              for step_name in step_names:
                  step = steps.get(step_name)
                  if not step or step.get('conclusion') != 'success':
                      raise SystemExit(f'required deploy step not successful: {step_name}')

          artifacts = get_json(f'{base}/actions/runs/{deploy_id}/artifacts?per_page=100').get('artifacts', [])
          expected = f'rozkalns-cv-deploy-{target}-run-{deploy_id}'
          matches = [row for row in artifacts if row.get('name') == expected and not row.get('expired')]
          if len(matches) != 1:
              raise SystemExit(f'exact deploy evidence artifact missing: {expected}')

          print(f'C8_TARGET_SHA={target}')
          print(f'C8_MAIN_CI_RUN={ci["id"]}')
          print(f'C8_DEPLOY_RUN={deploy_id}')
          print(f'C8_DEPLOY_ARTIFACT={expected}')
          print('C8_PRODUCTION_RELEASE=PASS')
          PY
