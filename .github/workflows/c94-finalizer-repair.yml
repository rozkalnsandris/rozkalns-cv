name: Repair C94 v3 finalizer

on:
  push:
    branches:
      - fix/94-public-email-verified-whatsapp-v3
    paths:
      - .github/workflows/c94-finalizer-repair.yml

permissions:
  contents: write

jobs:
  repair:
    if: >-
      github.repository == 'rozkalnsandris/rozkalns-cv' &&
      github.ref == 'refs/heads/fix/94-public-email-verified-whatsapp-v3'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out exact owner branch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" fetch --no-tags origin "$HEAD_SHA"
          git checkout -b fix/94-public-email-verified-whatsapp-v3 FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"

      - name: Pin prototype source and simplify finalizer migration step
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/c94-pdf-layout-audit.yml')
          text = path.read_text(encoding='utf-8')
          exact_v2 = '4a85a475d94e3383d54deef36ea9a9e67dd0a43b'

          moving_ref = "'refs/heads/fix/94-public-email-verified-whatsapp-v2:refs/remotes/origin/c94-v2'"
          if text.count(moving_ref) != 1:
              raise SystemExit('moving v2 fetch ref anchor drifted')
          text = text.replace(moving_ref, f"'{exact_v2}'", 1)

          start_marker = '      - name: Apply owner-approved current contact policy\n'
          end_marker = '      - name: Install locked app dependencies and PDF overlay tools\n'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('C94 apply-step boundaries missing')
          replacement = f'''      - name: Apply owner-approved current contact policy
        shell: bash
        run: |
          set -Eeuo pipefail
          # Reuse only the already-reviewed backend/contact controller implementations,
          # pinned to the exact reviewed v2 commit rather than a moving branch ref.
          git show {exact_v2}:bot/contact.py > bot/contact.py
          git show {exact_v2}:frontend/features/contact.mjs > frontend/features/contact.mjs
          git show {exact_v2}:tests/test_contact.py > tests/test_contact.py
          python3 scripts/c94-apply-public-contact.py

'''
          text = text[:start] + replacement + text[end:]

          cleanup = '          rm -f .github/workflows/c94-pdf-layout-audit.yml\n'
          cleanup_new = (
              '          rm -f .github/workflows/c94-pdf-layout-audit.yml \\\n'
              '            scripts/c94-apply-public-contact.py\n'
          )
          if text.count(cleanup) != 1:
              raise SystemExit('C94 self-clean anchor drifted')
          text = text.replace(cleanup, cleanup_new, 1)

          allowed_anchor = "              '.github/workflows/c94-pdf-layout-audit.yml',\n"
          if text.count(allowed_anchor) != 1:
              raise SystemExit('C94 diff allowlist anchor drifted')
          text = text.replace(
              allowed_anchor,
              allowed_anchor + "              'scripts/c94-apply-public-contact.py',\n",
              1,
          )

          path.write_text(text, encoding='utf-8')
          print('C94_FINALIZER_REPAIR=PASS')
          PY
          grep -Fq '4a85a475d94e3383d54deef36ea9a9e67dd0a43b:bot/contact.py' .github/workflows/c94-pdf-layout-audit.yml
          grep -Fq 'python3 scripts/c94-apply-public-contact.py' .github/workflows/c94-pdf-layout-audit.yml
          ! grep -Fq 'origin/c94-v2:' .github/workflows/c94-pdf-layout-audit.yml

      - name: Self-clean and push repair only
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/c94-finalizer-repair.yml
          git add -A -- .github/workflows/c94-pdf-layout-audit.yml .github/workflows/c94-finalizer-repair.yml
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: pin and simplify C94 v3 finalizer'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          remote_head="$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" ls-remote origin refs/heads/fix/94-public-email-verified-whatsapp-v3 | awk '{print $1}')"
          test "$remote_head" = "$HEAD_SHA"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" push origin HEAD:refs/heads/fix/94-public-email-verified-whatsapp-v3
