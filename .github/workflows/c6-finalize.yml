name: Finalize C6 semantic accessibility changes

on:
  push:
    branches:
      - a11y/84-semantic-interaction-v01
    paths:
      - tools/c6_finalize.py
      - .github/workflows/c6-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out exact branch SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF_NAME" = 'a11y/84-semantic-interaction-v01'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch --no-tags origin "$GITHUB_SHA"
          git checkout -B "$GITHUB_REF_NAME" FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Apply bounded C6 source transform
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/c6_finalize.py
          git diff --check

      - name: Set up pinned Node.js frontend toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false

      - name: Build deterministic frontend twice
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:frontend
          first="${RUNNER_TEMP}/c6-first.sha256"
          second="${RUNNER_TEMP}/c6-second.sha256"
          {
            find html/assets html/i18n -type f -print0
            printf '%s\0' html/index.html html/smarthome.html frontend-dist-manifest.json
          } | sort -z | xargs -0 sha256sum > "$first"
          npm run build:frontend
          {
            find html/assets html/i18n -type f -print0
            printf '%s\0' html/index.html html/smarthome.html frontend-dist-manifest.json
          } | sort -z | xargs -0 sha256sum > "$second"
          cmp "$first" "$second"
          npm run check:frontend
          printf 'C6_FRONTEND_DOUBLE_BUILD=PASS\n'

      - name: Validate C6 semantic and browser behavior
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check frontend/features/contact.mjs
          node --check tests/browser-smoke.mjs
          node --test tests/frontend.test.mjs
          PYTHONPYCACHEPREFIX="${RUNNER_TEMP}/c6-pycache" \
            python3 -m unittest tests.test_html_semantics

          chrome_bin=''
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then
              chrome_bin="$(command -v "$candidate")"
              break
            fi
          done
          test -n "$chrome_bin"
          CHROME_BIN="$chrome_bin" node tests/browser-smoke.mjs
          printf 'C6_BROWSER_SEMANTICS=PASS\n'

      - name: Validate source hygiene
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf node_modules
          PYTHONPYCACHEPREFIX="${RUNNER_TEMP}/c6-source-pycache" \
            bash scripts/validate-source.sh "$PWD"
          git diff --check

      - name: Commit verified C6 product state and self-clean
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git rm -- .github/workflows/c6-finalize.yml tools/c6_finalize.py
          git add -- \
            frontend/index.html \
            frontend/smarthome.html \
            frontend/features/contact.mjs \
            frontend/styles/features/smarthome.css \
            tests/browser-smoke.mjs \
            tests/test_html_semantics.py \
            frontend-dist-manifest.json \
            html/index.html \
            html/smarthome.html \
            html/assets

          unexpected="$(git status --short | awk '{print $2}' | grep -Ev '^(.github/workflows/c6-finalize.yml|tools/c6_finalize.py|frontend/index.html|frontend/smarthome.html|frontend/features/contact.mjs|frontend/styles/features/smarthome.css|tests/browser-smoke.mjs|tests/test_html_semantics.py|frontend-dist-manifest.json|html/index.html|html/smarthome.html|html/assets/)' || true)"
          test -z "$unexpected" || { printf 'UNEXPECTED_PATHS=%s\n' "$unexpected" >&2; exit 1; }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'a11y: harden semantic interactions and accessibility'

          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          remote_head="$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
