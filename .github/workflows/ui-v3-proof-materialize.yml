name: UI v3 proof materializer

on:
  push:
    branches:
      - feat/ui-v3-proof-closing-254

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" fetch --no-tags origin "$GITHUB_SHA"
          git checkout -B feat/ui-v3-proof-closing-254 FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Apply proof and closing source contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          index = Path('frontend/index.html')
          text = index.read_text(encoding='utf-8')
          stats_start = text.index('      <section id="stats">')
          education_start = text.index('      <section id="education">', stats_start)
          stats = text[stats_start:education_start]
          panel_open = '        <div class="panel">\n'
          if stats.count(panel_open) != 1:
              raise SystemExit('stats panel opening mismatch')
          stats = stats.replace(panel_open, '', 1)
          panel_close = '          <div id="statsUpdated" class="stats-updated">—</div>\n        </div>\n      </section>\n\n'
          replacement_close = '          <div id="statsUpdated" class="stats-updated">—</div>\n      </section>\n\n'
          if panel_close not in stats:
              raise SystemExit('stats panel closing mismatch')
          stats = stats.replace(panel_close, replacement_close, 1)
          text = text[:stats_start] + stats + text[education_start:]

          old_footer = '      <footer class="footer-card" data-i18n="footer">Served live from a Raspberry Pi 5 I build, operate and monitor.</footer>'
          new_footer = '      <address class="footer-card"><a href="mailto:andris@rozkalns.net">andris@rozkalns.net</a></address>'
          if text.count(old_footer) != 1:
              raise SystemExit('footer anchor mismatch')
          text = text.replace(old_footer, new_footer, 1)
          index.write_text(text, encoding='utf-8')

          stats_css = Path('frontend/styles/features/stats.css')
          stats_css.write_text(
              '#stats { --border: rgba(255,255,255,.18); --border-soft: rgba(255,255,255,.11); --text: #fff; --text-dim: #d4dced; --text-faint: #9ba9c3; --surface: transparent; --surface-2: rgba(255,255,255,.055); --accent: #8fb2ff; --accent-strong: #c5d6ff; overflow: hidden; padding: clamp(20px,4vw,36px); border-radius: var(--radius-xl); background: #101c38; box-shadow: 0 22px 56px rgba(15,28,56,.18); }\n'
              '#stats .section-heading { margin-block-end: 18px; }\n'
              '#stats .section-heading h2 { color: #fff; }\n'
              '.stats-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; padding: 0 0 18px; border-bottom: 1px solid var(--border-soft); }\n'
              '.stats-head strong { color: var(--text); font: 800 14px/1.35 var(--sans); letter-spacing: .015em; }\n'
              '.stats-head p { max-width: 46ch; margin: 5px 0 0; color: var(--text-faint); font-size: 12px; line-height: 1.55; }\n'
              '.live-status { display: inline-flex; align-items: center; gap: 9px; flex: 0 0 auto; min-height: 44px; padding: 8px 12px; border: 1px solid var(--border-soft); border-radius: 999px; background: rgba(255,255,255,.055); color: var(--text-faint); font: 800 10px/1.2 var(--sans); letter-spacing: .035em; text-transform: uppercase; }\n'
              '.live-dot { width: 8px; height: 8px; flex: 0 0 auto; border-radius: 50%; background: var(--text-faint); }\n'
              '.live-dot[data-state="live"] { background: var(--ok); box-shadow: 0 0 0 4px rgba(36,122,82,.2); }\n'
              '.live-dot[data-state="stale"] { background: var(--warn); box-shadow: 0 0 0 4px rgba(167,103,9,.2); }\n'
              '.live-dot[data-state="offline"] { background: var(--err); box-shadow: 0 0 0 4px rgba(183,68,66,.2); }\n'
              '.stats-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); margin-block-start: 18px; overflow: hidden; border: 1px solid var(--border-soft); border-radius: var(--radius-lg); }\n'
              '.stat { min-width: 0; min-height: 108px; padding: 19px 17px; border-right: 1px solid var(--border-soft); border-bottom: 1px solid var(--border-soft); background: transparent; }\n'
              '.stat:nth-child(2n) { border-right: 0; }\n'
              '.stat:nth-last-child(-n+2) { border-bottom: 0; }\n'
              '.stat:nth-child(n+5) { min-height: 90px; padding-block: 16px; background: var(--surface-2); }\n'
              '.stat-value { color: var(--accent); font: 800 clamp(23px,6vw,31px)/1 var(--sans); letter-spacing: -.035em; font-variant-numeric: tabular-nums; }\n'
              '.stat:nth-child(n+5) .stat-value { color: var(--text); font-size: clamp(18px,5vw,23px); letter-spacing: -.02em; }\n'
              '.stat-label { margin-top: 9px; color: var(--text-faint); font: 750 10px/1.35 var(--sans); letter-spacing: .045em; text-transform: uppercase; }\n'
              '.stat:nth-child(n+5) .stat-label { margin-top: 7px; font-size: 9.5px; }\n'
              '.stats-updated { padding-block-start: 12px; color: var(--text-faint); font-size: 12px; line-height: 1.45; }\n',
              encoding='utf-8',
          )

          components = Path('frontend/styles/components.css')
          css = components.read_text(encoding='utf-8')
          start = css.index('.education-list {')
          replacement = (
              '.education-list { gap: 0; border-top: 1px solid var(--border); }\n'
              '.education-row { display: grid; grid-template-columns: 1fr; gap: 4px; padding: 14px 0; border-bottom: 1px solid var(--border); }\n'
              '.education-row time { color: var(--text-faint); font: 700 10.5px/1.4 var(--sans); letter-spacing: .035em; }\n'
              '.education-row h3 { margin: 0; color: var(--text); font-size: 15px; line-height: 1.35; }\n'
              '.education-row p { margin: 3px 0 0; color: var(--text-faint); font-size: 12px; line-height: 1.45; }\n'
              '.footer-card { display: flex; align-items: center; justify-content: flex-end; gap: 10px; margin: 0; padding-block-start: 18px; border-top: 1px solid var(--border); color: var(--text-dim); font-style: normal; font-size: 12px; line-height: 1.5; }\n'
              '.footer-card::before { content: ""; width: 7px; height: 7px; flex: 0 0 auto; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 4px rgba(36,122,82,.12); }\n'
              '.footer-card a { color: var(--accent-strong); font-weight: 750; text-decoration: none; }\n'
              '.footer-card a:hover { color: var(--accent); text-decoration: underline; }\n'
          )
          css = css[:start] + replacement
          components.write_text(css, encoding='utf-8')

          responsive = Path('frontend/styles/responsive.css')
          r = responsive.read_text(encoding='utf-8')
          desktop_anchor = '  #skills .section-heading, #experience .section-heading { margin-block-end: 14px; }\n'
          if desktop_anchor not in r:
              raise SystemExit('desktop responsive anchor missing')
          r = r.replace(
              desktop_anchor,
              desktop_anchor + '  .education-list { grid-template-columns: repeat(3,minmax(0,1fr)); gap: 0 24px; }\n  .education-row { grid-template-columns: 1fr; align-content: start; }\n',
              1,
          )
          responsive.write_text(r, encoding='utf-8')

          print_css = Path('frontend/styles/print.css')
          p = print_css.read_text(encoding='utf-8')
          anchor = '  .contact-verify { display: none !important; }\n'
          if anchor not in p:
              raise SystemExit('print anchor missing')
          p = p.replace(
              anchor,
              '  #stats { padding: 14px; background: #fff; box-shadow: none; }\n  #stats .section-heading h2, #stats .stats-head strong, #stats .stat-value { color: #000; }\n' + anchor,
              1,
          )
          print_css.write_text(p, encoding='utf-8')

          tests = Path('tests/test_frontend_contract.py')
          t = tests.read_text(encoding='utf-8')
          anchor = "        self.assertIn('class=\"profile-languages\"', html)\n"
          if anchor not in t:
              raise SystemExit('frontend contract anchor missing')
          addition = anchor + (
              "        stats = html[html.index('id=\"stats\"'):html.index('id=\"education\"')]\n"
              "        self.assertNotIn('class=\"panel\"', stats)\n"
              "        self.assertEqual(stats.count('data-stat='), 8)\n"
              "        self.assertIn('<address class=\"footer-card\">', html)\n"
              "        self.assertIn('href=\"mailto:andris@rozkalns.net\"', html)\n"
          )
          t = t.replace(anchor, addition, 1)
          tests.write_text(t, encoding='utf-8')
          PY
          git diff --check -- frontend/index.html frontend/styles/features/stats.css frontend/styles/components.css frontend/styles/responsive.css frontend/styles/print.css tests/test_frontend_contract.py

      - name: Set up pinned Node.js frontend toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          package-manager-cache: false
          check-latest: false

      - name: Build deterministic frontend
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:frontend
          npm run check:frontend
          python3 tests/test_frontend_contract.py
          python3 tests/test_html_semantics.py
          python3 tests/test_project_tech_icons.py
          git diff --check

      - name: Commit proof slice
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- frontend/index.html frontend/styles/features/stats.css frontend/styles/components.css frontend/styles/responsive.css frontend/styles/print.css tests/test_frontend_contract.py frontend-dist-manifest.json html
          git diff --cached --check
          git commit -m 'feat: strengthen live proof and closing sections'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" push origin HEAD:refs/heads/feat/ui-v3-proof-closing-254
