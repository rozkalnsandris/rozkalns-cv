name: PDF contact privacy preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdf-contact-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out exact workflow SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch --no-tags origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Install PDF and QR verification tools
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils zbar-tools

      - name: Set up pinned Node.js frontend toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false

      - name: Build current frontend and render public PDFs
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:frontend
          python3 scripts/render-public-pdfs.py
          python3 scripts/build-content.py --write --accept-pdfs \
            --pdf-contact-policy verified-public-email-protected-phone
          python3 scripts/sync-system-prompt.py --write
          python3 scripts/build-content.py --check
          python3 scripts/sync-system-prompt.py --check

      - name: Verify PDF contact policy and QR payload
        shell: bash
        run: |
          set -Eeuo pipefail
          preview_dir="${RUNNER_TEMP}/pdf-contact-preview"
          mkdir -p "$preview_dir"
          for spec in \
            'en:html/cv.pdf:Experience' \
            'de:html/cv-de.pdf:Berufserfahrung' \
            'lv:html/cv-lv.pdf:Darba pieredze'
          do
            IFS=: read -r language pdf marker <<<"$spec"
            text="${preview_dir}/${language}.txt"
            png="${preview_dir}/${language}"
            pdftotext "$pdf" "$text"
            grep -Fq 'andris@rozkalns.net' "$text"
            grep -Fq "$marker" "$text"
            pdfinfo -url "$pdf" >"${preview_dir}/${language}.urls.txt"
            ! grep -Fq 'wa.me/' "${preview_dir}/${language}.urls.txt"
            ! grep -Fq 'tel:' "${preview_dir}/${language}.urls.txt"
            pdftoppm -f 1 -singlefile -png -r 180 "$pdf" "$png" >/dev/null
            decoded="$(zbarimg --quiet --raw "${png}.png" 2>/dev/null | tr -d '\r')"
            test "$decoded" = 'https://rozkalns.net/?contact=whatsapp'
            printf 'PDF_CONTACT_VERIFY language=%s qr=PASS email=PASS protected_phone=PASS\n' "$language"
          done

      - name: Collect reviewed candidate outputs
        shell: bash
        run: |
          set -Eeuo pipefail
          out="${RUNNER_TEMP}/candidate"
          mkdir -p "$out/html" "$out/content" "$out/frontend"
          cp -a html/index.html html/smarthome.html html/assets html/i18n \
            html/cv.pdf html/cv-de.pdf html/cv-lv.pdf "$out/html/"
          cp frontend-dist-manifest.json "$out/"
          cp content/pdf-manifest.json "$out/content/"
          cp frontend/public-contact.mjs "$out/frontend/"
          cp "${RUNNER_TEMP}/pdf-contact-preview"/*.png "$out/"
          tar -C "$out" -czf "${RUNNER_TEMP}/cv-public-contact-candidate.tgz" .

      - name: Upload candidate and visual previews
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cv-public-contact-candidate
          path: ${{ runner.temp }}/cv-public-contact-candidate.tgz
          archive: false
          retention-days: 2
