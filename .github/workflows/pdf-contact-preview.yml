name: PDF contact privacy preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdf-contact-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out exact workflow SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch --no-tags origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Install PDF and QR verification tools
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils zbar-tools

      - name: Set up pinned Node.js frontend toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false

      - name: Build current frontend and render public PDFs
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:frontend
          python3 scripts/render-public-pdfs.py
          python3 scripts/build-content.py --write --accept-pdfs \
            --pdf-contact-policy verified-public-email-protected-phone
          python3 scripts/sync-system-prompt.py --write
          python3 scripts/build-content.py --check
          python3 scripts/sync-system-prompt.py --check

      - name: Verify PDF contact policy and QR payload
        shell: bash
        run: |
          set -Eeuo pipefail
          preview_dir="${RUNNER_TEMP}/pdf-contact-preview"
          mkdir -p "$preview_dir"
          for spec in \
            'en:html/cv.pdf:Experience' \
            'de:html/cv-de.pdf:Berufserfahrung' \
            'lv:html/cv-lv.pdf:Darba pieredze'
          do
            IFS=: read -r language pdf marker <<<"$spec"
            text="${preview_dir}/${language}.txt"
            png="${preview_dir}/${language}"
            urls="${preview_dir}/${language}.urls.txt"

            pdftotext "$pdf" "$text"
            if grep -Fq 'andris@rozkalns.net' "$text"; then
              printf 'PDF_EMAIL language=%s PASS\n' "$language"
            else
              printf 'PDF_EMAIL language=%s FAIL\n' "$language" >&2
              exit 1
            fi
            if grep -Fq "$marker" "$text"; then
              printf 'PDF_LANGUAGE language=%s PASS\n' "$language"
            else
              printf 'PDF_LANGUAGE language=%s FAIL\n' "$language" >&2
              exit 1
            fi

            pdfinfo -url "$pdf" >"$urls"
            if grep -Fq 'wa.me/' "$urls"; then
              printf 'PDF_DIRECT_WHATSAPP language=%s FAIL\n' "$language" >&2
              exit 1
            fi
            if grep -Fq 'tel:' "$urls"; then
              printf 'PDF_DIRECT_PHONE_LINK language=%s FAIL\n' "$language" >&2
              exit 1
            fi
            printf 'PDF_PROTECTED_PHONE language=%s PASS\n' "$language"

            pdftoppm -f 1 -singlefile -png -r 220 "$pdf" "$png" >/dev/null
            set +e
            decoded="$(zbarimg --quiet --raw "${png}.png" 2>/dev/null | tr -d '\r')"
            qr_status=$?
            set -e
            printf '%s\n' "$decoded" >"${preview_dir}/${language}.qr.txt"
            if [[ "$qr_status" -eq 0 && "$decoded" == 'https://rozkalns.net/?contact=whatsapp' ]]; then
              printf 'PDF_QR language=%s PASS\n' "$language"
            else
              printf 'PDF_QR language=%s FAIL decoded_length=%s\n' "$language" "${#decoded}" >&2
              exit 1
            fi
          done
          printf 'PDF_CONTACT_VERIFY=PASS\n'

      - name: Collect reviewed candidate outputs
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          out="${RUNNER_TEMP}/candidate"
          mkdir -p "$out/html" "$out/content" "$out/frontend" "$out/evidence"
          if [[ -d html/assets ]]; then cp -a html/assets "$out/html/"; fi
          if [[ -d html/i18n ]]; then cp -a html/i18n "$out/html/"; fi
          for path in html/index.html html/smarthome.html html/cv.pdf html/cv-de.pdf html/cv-lv.pdf; do
            [[ -f "$path" ]] && cp "$path" "$out/html/"
          done
          [[ -f frontend-dist-manifest.json ]] && cp frontend-dist-manifest.json "$out/"
          [[ -f content/pdf-manifest.json ]] && cp content/pdf-manifest.json "$out/content/"
          [[ -f frontend/public-contact.mjs ]] && cp frontend/public-contact.mjs "$out/frontend/"
          if [[ -d "${RUNNER_TEMP}/pdf-contact-preview" ]]; then
            cp -a "${RUNNER_TEMP}/pdf-contact-preview"/. "$out/evidence/"
          fi
          tar -C "$out" -czf "${RUNNER_TEMP}/cv-public-contact-candidate.tgz" .

      - name: Upload candidate and visual previews
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cv-public-contact-candidate
          path: ${{ runner.temp }}/cv-public-contact-candidate.tgz
          archive: false
          retention-days: 2
