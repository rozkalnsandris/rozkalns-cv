name: UI v3 browser contract fixer

on:
  push:
    branches:
      - feat/ui-v3-shell-254

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" fetch --no-tags origin "$GITHUB_SHA"
          git checkout -B feat/ui-v3-shell-254 FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Update browser smoke selector
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(grep -Foc "document.querySelector('.sidebar h1')?.textContent" tests/browser-smoke.mjs)" -eq 1
          sed -i "s/document.querySelector('\.sidebar h1')?.textContent/document.querySelector('.hero-shell h1')?.textContent/" tests/browser-smoke.mjs
          node --check tests/browser-smoke.mjs
          git diff --check -- tests/browser-smoke.mjs

      - name: Commit browser contract fix
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- tests/browser-smoke.mjs
          git diff --cached --check
          git commit -m 'test: align browser smoke with UI v3 shell'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" push origin HEAD:refs/heads/feat/ui-v3-shell-254
