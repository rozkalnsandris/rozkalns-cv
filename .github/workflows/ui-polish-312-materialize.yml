name: UI polish 312 materialize

on:
  push:
    branches:
      - fix/312-recruiter-mobile-ui-polish

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false

      - name: Apply bounded UI polish
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/ui-polish-312.py
          python3 tests/test_ui_polish_312.py

      - name: Materialize deterministic frontend
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:frontend
          npm run check:frontend
          node --check frontend/app.mjs
          node --test tests/frontend.test.mjs
          python3 tests/test_ui_polish_312.py
          git diff --check

      - name: Commit source and deterministic output
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf node_modules
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add -- \
            frontend/index.html \
            frontend/styles/components.css \
            frontend/styles/responsive.css \
            frontend/styles/tokens.css \
            tests/test_ui_polish_312.py \
            frontend-dist-manifest.json \
            html
          git rm -- \
            scripts/ui-polish-312.py \
            .github/workflows/ui-polish-312-materialize.yml

          git diff --cached --check
          git status --short
          git commit -m 'fix: polish recruiter scan path (#312)'
          git push origin HEAD:fix/312-recruiter-mobile-ui-polish
