name: Issue 398 metadata policy materializer

on:
  push:
    branches:
      - fix/398-metadata-privacy-policy

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact workflow SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" fetch --no-tags origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Apply bounded issue 398 source patch
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"expected one match in {path}: {old!r}, got {text.count(old)}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "scripts/localize-frontend.mjs",
              'const LOCALES = Object.freeze({ en: "en-GB", de: "de-DE", lv: "lv-LV" });\n',
              'const LOCALES = Object.freeze({ en: "en-GB", de: "de-DE", lv: "lv-LV" });\nconst IMAGE_ALTS = Object.freeze({\n  en: "Portrait of Andris Rožkalns",\n  de: "Porträt von Andris Rožkalns",\n  lv: "Andra Rožkalna portrets"\n});\n'
          )
          replace_once(
              "scripts/localize-frontend.mjs",
              'function replaceStructuredData(html, url, description, title) {\n',
              'function replaceStructuredData(html, url, description, title, language) {\n'
          )
          replace_once(
              "scripts/localize-frontend.mjs",
              '  profile.url = url;\n  profile.mainEntity.url = DEFAULT_URL;\n',
              '  profile.url = url;\n  profile.inLanguage = language;\n  profile.mainEntity.url = DEFAULT_URL;\n'
          )
          replace_once(
              "scripts/localize-frontend.mjs",
              '  html = replaceMetaContent(html, "property", "og:url", url);\n  html = replaceMetaContent(html, "name", "twitter:title", title);\n',
              '  html = replaceMetaContent(html, "property", "og:url", url);\n  html = replaceMetaContent(html, "property", "og:image:alt", IMAGE_ALTS[language]);\n  html = replaceMetaContent(html, "name", "twitter:title", title);\n'
          )
          replace_once(
              "scripts/localize-frontend.mjs",
              '  html = replaceMetaContent(html, "name", "twitter:description", description);\n  html = replaceCanonical(html, url);\n  html = replaceStructuredData(html, url, description, String(messages.role || ""));\n',
              '  html = replaceMetaContent(html, "name", "twitter:description", description);\n  html = replaceMetaContent(html, "name", "twitter:image:alt", IMAGE_ALTS[language]);\n  html = replaceCanonical(html, url);\n  html = replaceStructuredData(html, url, description, String(messages.role || ""), language);\n'
          )

          replace_once(
              "nginx.conf",
              '    location = / {\n        expires -1;\n        try_files /index.html =404;\n    }\n',
              '    location = / {\n        expires -1;\n        return 308 /en/$is_args$args;\n    }\n'
          )
          replace_once(
              "nginx.conf",
              '    location = /favicon.ico {\n        return 308 /favicon.svg;\n    }\n\n    location ~* \\.(?:png|jpg|jpeg|svg|woff2?|pdf)$ {\n',
              '    location = /favicon.ico {\n        return 308 /favicon.svg;\n    }\n\n    location ~ ^/cv(?:-de|-lv)?\\.pdf$ {\n        expires 1h;\n        add_header X-Robots-Tag "noindex, nofollow" always;\n        try_files $uri =404;\n    }\n\n    location ~* \\.(?:png|jpg|jpeg|svg|woff2?|pdf)$ {\n'
          )

          Path("tests/test_seo_policy_398.py").write_text(r'''import json
import re
from pathlib import Path
import unittest

ROOT = Path(__file__).resolve().parents[1]
IMAGE_ALTS = {
    "en": "Portrait of Andris Rožkalns",
    "de": "Porträt von Andris Rožkalns",
    "lv": "Andra Rožkalna portrets",
}


class SeoPolicy398Test(unittest.TestCase):
    def test_localized_social_alt_and_profile_language(self):
        for language, image_alt in IMAGE_ALTS.items():
            html = (ROOT / f"html/{language}/index.html").read_text(encoding="utf-8")
            self.assertIn(f'<meta property="og:image:alt" content="{image_alt}">', html)
            self.assertIn(f'<meta name="twitter:image:alt" content="{image_alt}">', html)
            match = re.search(r'<script type="application/ld\\+json">(.*?)</script>', html, re.S)
            self.assertIsNotNone(match, language)
            profile = json.loads(match.group(1))
            self.assertEqual(profile.get("@type"), "ProfilePage")
            self.assertEqual(profile.get("inLanguage"), language)
            self.assertEqual(profile.get("@id"), f"https://rozkalns.net/{language}/#profile")
            self.assertEqual(profile["mainEntity"].get("@id"), "https://rozkalns.net/#person")

    def test_root_redirect_is_deliberate_and_preserves_query(self):
        nginx = (ROOT / "nginx.conf").read_text(encoding="utf-8")
        root = re.search(r"location = / \\{(.*?)\\n    \\}", nginx, re.S)
        self.assertIsNotNone(root)
        block = root.group(1)
        self.assertIn("return 308 /en/$is_args$args;", block)
        self.assertNotIn("try_files /index.html", block)

    def test_localized_pdfs_are_downloadable_but_noindex(self):
        nginx = (ROOT / "nginx.conf").read_text(encoding="utf-8")
        self.assertIn(r"location ~ ^/cv(?:-de|-lv)?\\.pdf$ {", nginx)
        self.assertIn('add_header X-Robots-Tag "noindex, nofollow" always;', nginx)
        for relative in ("html/cv.pdf", "html/cv-de.pdf", "html/cv-lv.pdf"):
            self.assertTrue((ROOT / relative).is_file(), relative)


if __name__ == "__main__":
    unittest.main()
''', encoding="utf-8")
          PY

      - name: Set up pinned Node.js frontend toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false

      - name: Build and validate source candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:frontend
          python3 -m unittest tests.test_seo_policy_398
          python3 scripts/run-python-tests.py
          node --check scripts/localize-frontend.mjs
          git diff --check

      - name: Commit exact source and generated candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          current_remote="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test "$current_remote" = "$GITHUB_SHA"

          git rm .github/workflows/issue398-metadata-materialize.yml
          git add -- scripts/localize-frontend.mjs nginx.conf tests/test_seo_policy_398.py \
            frontend-dist-manifest.json html/index.html html/en/index.html html/de/index.html html/lv/index.html html/sitemap.xml

          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          ! git diff --cached --name-only | grep -Ev '^(\.github/workflows/issue398-metadata-materialize\.yml|scripts/localize-frontend\.mjs|nginx\.conf|tests/test_seo_policy_398\.py|frontend-dist-manifest\.json|html/(index\.html|sitemap\.xml|(en|de|lv)/index\.html))$'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: finish localized SEO delivery policy (#398)'
          final_sha="$(git rev-parse HEAD)"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          printf 'FINAL_SHA=%s\n' "$final_sha"
