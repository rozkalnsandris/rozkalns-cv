name: Frontend Dist Export Temp

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'content/translations/**'
      - 'scripts/check-chat-privacy.mjs'
      - 'package.json'
      - '.github/workflows/frontend-dist-export-temp.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact PR SHA
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Set up pinned Node.js frontend toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false
      - name: Build deterministic frontend dist
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:frontend
          npm run check:frontend
          tar -czf frontend-dist.tar.gz \
            frontend-dist-manifest.json \
            html/index.html html/smarthome.html \
            html/assets html/i18n
      - name: Upload generated dist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-dist-${{ github.sha }}
          path: frontend-dist.tar.gz
          if-no-files-found: error
          retention-days: 1
