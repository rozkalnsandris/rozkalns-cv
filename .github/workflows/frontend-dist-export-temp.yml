name: Frontend Dist Export Temp

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'content/translations/**'
      - 'scripts/check-chat-privacy.mjs'
      - 'package.json'
      - '.github/workflows/frontend-dist-export-temp.yml'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out PR branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Set up pinned Node.js frontend toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false
      - name: Build and validate deterministic frontend dist
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:frontend
          npm run check:frontend
      - name: Commit generated dist to PR branch
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- \
            frontend-dist-manifest.json \
            html/index.html html/smarthome.html html/sitemap.xml \
            html/en html/de html/lv html/assets html/i18n
          if git diff --cached --quiet; then
            echo 'FRONTEND_DIST_ALREADY_CURRENT=1'
            exit 0
          fi
          git commit -m 'build: refresh frontend dist (#337)'
          git push origin HEAD:${{ github.head_ref }}
