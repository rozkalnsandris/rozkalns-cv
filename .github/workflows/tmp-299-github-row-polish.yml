name: Temporary
on:
  push:
    branches: [feat/299-github-project-row-polish]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: 24.18.0, package-manager-cache: false}
      - name: Apply polish, validate, and finalize
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          html_path = Path('frontend/index.html')
          html = html_path.read_text(encoding='utf-8')
          repos = ['hermes-tech','RPi5_main','hermes-deals','rozkalns-control-center','dashboard_RPi5','home-assistant-config','balcony-irrigation-esp32','rozkalns-cv','ops-workflows']
          def row(repo):
              return f'<a class="tech-tag has-tech-icon github-row" href=//github.com/rozkalnsandris/{repo}>{repo}</a>'
          featured = ''.join(row(repo) for repo in repos[:5])
          overflow = ''.join(row(repo) for repo in repos[5:])
          replacement = (f'<section id="github-projects"><div class=section-heading><h2>GitHub projects</h2></div>'
                         f'<div class=skill-list>{featured}</div><details><summary class=org>4 more projects</summary>'
                         f'<div class=skill-list>{overflow}</div></details></section>')
          html, count = re.subn(r'<section id="github-projects">[\s\S]*?</section>', replacement, html, count=1)
          if count != 1: raise SystemExit('GitHub projects section replacement failed')
          html_path.write_text(html, encoding='utf-8')

          css_path = Path('frontend/styles/components.css')
          css = css_path.read_text(encoding='utf-8')
          css = css.replace('.project-list { display: grid; gap: 0; border-top: 1px solid var(--border); }', '.project-list { gap: 0; border-top: 1px solid var(--border); }', 1)
          css = css.replace('min-height: 0; padding: 0; border: 0; border-radius: 0; background: transparent;', 'min-height: 0;', 1)
          anchor = '.tech-tag svg { width: 12px; height: 12px; flex: 0 0 12px; color: var(--accent); opacity: .9; }'
          addition = anchor + '\n.github-row { width: 100%; text-decoration: none; }\n.github-row::after { content: "↗"; margin-left: auto; }\n.github-row svg { border-radius: 3px; box-shadow: 0 0 0 4px var(--accent-soft); margin: 0 4px; }'
          if anchor not in css: raise SystemExit('tech-tag SVG CSS anchor missing')
          css = css.replace(anchor, addition, 1)
          css_path.write_text(css, encoding='utf-8')

          test_path = Path('tests/frontend.test.mjs')
          tests = test_path.read_text(encoding='utf-8')
          tests = tests.replace('assert.match(section, /<details><summary class=org>\\+4<\\/summary><div class=skill-list>/);', 'assert.match(section, /<details><summary class=org>4 more projects<\\/summary><div class=skill-list>/);')
          marker = 'assert.equal((section.match(/href=\\/\\/github\\.com\\/rozkalnsandris\\//g) || []).length, 9);'
          tests = tests.replace(marker, marker + '\n  assert.equal((section.match(/class="tech-tag has-tech-icon github-row"/g) || []).length, 9);', 1)
          test_path.write_text(tests, encoding='utf-8')

          smoke_path = Path('tests/browser-smoke.mjs')
          smoke = smoke_path.read_text(encoding='utf-8')
          old = '''          iconSizes: [...document.querySelectorAll('#github-projects a svg')].map((icon) => {\n            const rect = icon.getBoundingClientRect();\n            return { width: rect.width, height: rect.height };\n          })'''
          new = '''          iconSizes: [...document.querySelectorAll('#github-projects a svg')].map((icon) => {\n            const rect = icon.getBoundingClientRect();\n            return { width: rect.width, height: rect.height };\n          }),\n          rowSizes: [...document.querySelectorAll('#github-projects > .skill-list .github-row')].map((row) => {\n            const rect = row.getBoundingClientRect();\n            return { width: rect.width, height: rect.height };\n          })'''
          if old not in smoke: raise SystemExit('browser GitHub geometry block missing')
          smoke = smoke.replace(old, new, 1)
          old_assert = '''        assert.ok(\n          githubProof.iconSizes.every(({ width, height }) => width >= 12 && width <= 14 && height >= 12 && height <= 14),\n          `responsive ${viewport.width}px ${locale.label} GitHub icons must stay compact: ${JSON.stringify(githubProof.iconSizes)}`\n        );'''
          new_assert = old_assert + '''\n        assert.equal(githubProof.rowSizes.length, 5);\n        assert.ok(\n          githubProof.rowSizes.every(({ width, height }) => width >= 120 && height >= 28 && height <= 34),\n          `responsive ${viewport.width}px ${locale.label} GitHub rows must stay compact: ${JSON.stringify(githubProof.rowSizes)}`\n        );'''
          if old_assert not in smoke: raise SystemExit('browser GitHub icon assertion missing')
          smoke = smoke.replace(old_assert, new_assert, 1)
          smoke_path.write_text(smoke, encoding='utf-8')
          PY

          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:frontend
          first="$RUNNER_TEMP/frontend-first.sha256"
          second="$RUNNER_TEMP/frontend-second.sha256"
          { find html/assets html/i18n -type f -print0; printf '%s\0' html/index.html html/smarthome.html frontend-dist-manifest.json; } | sort -z | xargs -0 sha256sum > "$first"
          npm run build:frontend
          { find html/assets html/i18n -type f -print0; printf '%s\0' html/index.html html/smarthome.html frontend-dist-manifest.json; } | sort -z | xargs -0 sha256sum > "$second"
          cmp "$first" "$second"
          npm run check:frontend
          node --check tests/browser-smoke.mjs
          node --test tests/frontend.test.mjs
          chrome_bin=''
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then chrome_bin="$(command -v "$candidate")"; break; fi
          done
          test -n "$chrome_bin"
          CHROME_BIN="$chrome_bin" node tests/browser-smoke.mjs
          rm -rf node_modules
          rm -f .github/workflows/tmp-299-github-row-polish.yml
          bash scripts/validate-source.sh "$PWD"
          git status --short
          git add frontend/index.html frontend/styles/components.css tests/frontend.test.mjs tests/browser-smoke.mjs html frontend-dist-manifest.json .github/workflows/tmp-299-github-row-polish.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: polish GitHub project rows'
          git push origin HEAD:feat/299-github-project-row-polish