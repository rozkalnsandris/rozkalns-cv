name: C5 post-C4 browser baseline v2

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/c5-post-c4-baseline-v2.yml

permissions:
  contents: read

jobs:
  measure:
    if: >-
      github.repository == 'rozkalnsandris/rozkalns-cv' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'perf/82-reduce-initial-background-work-v01'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      C4_SHA: c01a2beea0df8050a6e192504428c17574a852af
      C0_TOOL_SHA: f685725afd31b8076e941d9dfb4a6a358b87d82b
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Fetch frozen C0 tool and patch teardown only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64, json, os, urllib.parse, urllib.request
          sha=os.environ['C0_TOOL_SHA']
          ref=urllib.parse.quote(sha,safe='')
          url=f'https://api.github.com/repos/rozkalnsandris/rozkalns-cv/contents/tools/c0-browser-baseline.mjs?ref={ref}'
          req=urllib.request.Request(url,headers={
              'Accept':'application/vnd.github+json',
              'Authorization':f"Bearer {os.environ['GH_TOKEN']}",
              'X-GitHub-Api-Version':'2022-11-28',
              'User-Agent':'rozkalns-cv-c5-baseline-v2',
          })
          with urllib.request.urlopen(req,timeout=20) as r: payload=json.load(r)
          text=base64.b64decode(payload['content']).decode('utf-8')
          old="await rm(profile,{recursive:true,force:true})"
          new="try{await rm(profile,{recursive:true,force:true})}catch{await sleep(500);await rm(profile,{recursive:true,force:true}).catch(()=>{})}"
          if text.count(old)!=1: raise SystemExit('unexpected C0 teardown anchor')
          open('/tmp/c5-browser-baseline.mjs','w',encoding='utf-8').write(text.replace(old,new))
          print(f'C5_TOOL_BLOB={payload["sha"]}')
          print('C5_TOOL_MEASUREMENT_LOGIC_UNCHANGED=true')
          PY

      - name: Capture three independent post-C4 runs
        id: capture
        shell: bash
        run: |
          set -Eeuo pipefail
          chrome=''
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then chrome="$(command -v "$candidate")"; break; fi
          done
          test -n "$chrome"
          root="${RUNNER_TEMP}/c5-post-c4"
          mkdir -p "$root"
          for n in 1 2 3; do
            node /tmp/c5-browser-baseline.mjs \
              --output "$root/run-$n" \
              --url https://rozkalns.net/ \
              --chrome "$chrome" \
              --sha "$C4_SHA" | tee "$root/run-$n.log"
          done
          printf 'evidence=%s\n' "$root" >> "$GITHUB_OUTPUT"

      - name: Summarize medians against C0
        env:
          EVIDENCE: ${{ steps.capture.outputs.evidence }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json,os,statistics
          from pathlib import Path
          root=Path(os.environ['EVIDENCE'])
          runs=[json.loads((root/f'run-{n}'/'browser-baseline.json').read_text()) for n in (1,2,3)]
          c0={'desktop':{'cold':72028,'warm':1968},'phone':{'cold':71516,'warm':1963}}
          summary={'sha':os.environ['C4_SHA'],'runs':3,'network':{},'coverage':{},'metrics':{}}
          for vp in ('desktop','phone'):
              summary['network'][vp]={}
              summary['metrics'][vp]={}
              for phase in ('cold','warm'):
                  bytes_=[r[vp][phase]['network']['transferredBytes'] for r in runs]
                  requests=[r[vp][phase]['network']['requests'] for r in runs]
                  b=int(statistics.median(bytes_)); q=int(statistics.median(requests))
                  summary['network'][vp][phase]={'medianBytes':b,'bytes':bytes_,'medianRequests':q,'requests':requests}
                  print(f'C5_{vp.upper()}_{phase.upper()}_BYTES_MEDIAN={b} runs={bytes_}')
                  print(f'C5_{vp.upper()}_{phase.upper()}_REQUESTS_MEDIAN={q} runs={requests}')
                  print(f'C5_{vp.upper()}_{phase.upper()}_VS_C0={b-c0[vp][phase]:+d}B ({(b/c0[vp][phase]-1)*100:+.2f}%)')
              for metric in ('ttfbMs','dclMs','loadMs','fcpMs','lcpMs','cls'):
                  vals=[r[vp]['cold']['metrics'][metric] for r in runs if r[vp]['cold']['metrics'][metric] is not None]
                  if vals:
                      summary['metrics'][vp][metric]=statistics.median(vals)
                      print(f'C5_{vp.upper()}_{metric.upper()}_MEDIAN={summary["metrics"][vp][metric]} runs={vals}')
              by={}
              for r in runs:
                  for row in r[vp]['coverage']['javascript']:
                      by.setdefault(row['url'],[]).append(row['percent'])
              summary['coverage'][vp]={u:statistics.median(v) for u,v in sorted(by.items()) if len(v)==3}
              for url,pct in summary['coverage'][vp].items():
                  print(f'C5_{vp.upper()}_JS_COVERAGE={pct:.2f}% url={url}')
          (root/'summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          PY

      - name: Upload post-C4 baseline evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: c5-post-c4-baseline-${{ github.event.pull_request.head.sha }}
          path: ${{ steps.capture.outputs.evidence }}
          if-no-files-found: error
          retention-days: 30
