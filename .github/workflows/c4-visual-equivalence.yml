name: C4 visual equivalence

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/c4-visual-equivalence.yml

permissions:
  contents: read

jobs:
  compare:
    if: >-
      github.repository == 'rozkalnsandris/rozkalns-cv' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'refactor/80-consolidate-css-v01'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out exact C4 head and frozen C3 baseline
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASELINE_SHA: 88d20510e80b9dd7665cb19a24b14b3c9d30ee89
        shell: bash
        run: |
          set -Eeuo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch --no-tags origin "$HEAD_SHA" "$BASELINE_SHA"
          git checkout --detach "$HEAD_SHA"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git worktree add --detach "${RUNNER_TEMP}/c3-baseline" "$BASELINE_SHA"
          test "$(git -C "${RUNNER_TEMP}/c3-baseline" rev-parse HEAD)" = "$BASELINE_SHA"

      - name: Set up pinned Node.js and build C4 candidate
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm

      - name: Build deterministic C4 candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:frontend
          npm run check:frontend

      - name: Capture C3 and C4 browser evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          evidence="${RUNNER_TEMP}/c4-visual-evidence"
          mkdir -p "$evidence"

          chrome_bin=''
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then
              chrome_bin="$(command -v "$candidate")"
              break
            fi
          done
          test -n "$chrome_bin"
          "$chrome_bin" --version | tee "$evidence/chrome-version.txt"

          # IntersectionObserver can make sequential screenshots catch different
          # aria-current navigation states. Normalize only that disposable audit state.
          python3 - <<'PY'
          from pathlib import Path
          import os

          roots = [
              Path(os.environ['RUNNER_TEMP']) / 'c3-baseline' / 'html',
              Path.cwd() / 'html',
          ]
          css = '''
          .site-nav a,
          .site-nav a[aria-current="true"] { color: var(--text-faint) !important; }
          .site-nav a::before,
          .site-nav a[aria-current="true"]::before {
            width: 22px !important;
            background: var(--border) !important;
            transition: none !important;
          }
          '''
          for root in roots:
              (root / 'c4-audit-normalize.css').write_text(css, encoding='utf-8')
              index = root / 'index.html'
              text = index.read_text(encoding='utf-8')
              if text.count('</head>') != 1:
                  raise SystemExit(f'unexpected head marker in {index}')
              index.write_text(
                  text.replace(
                      '</head>',
                      '  <link rel="stylesheet" href="/c4-audit-normalize.css">\n</head>',
                  ),
                  encoding='utf-8',
              )
          PY
          printf 'VISUAL_DYNAMIC_NAV_NORMALIZED=true\n' > "$evidence/audit-normalization.env"

          python3 -m http.server 18101 --bind 127.0.0.1 --directory "${RUNNER_TEMP}/c3-baseline/html" \
            >"$evidence/c3-server.log" 2>&1 &
          c3_pid=$!
          python3 -m http.server 18102 --bind 127.0.0.1 --directory "$PWD/html" \
            >"$evidence/c4-server.log" 2>&1 &
          c4_pid=$!
          cleanup() {
            kill "$c3_pid" "$c4_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for port in 18101 18102; do
            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error "http://127.0.0.1:${port}/" >/dev/null; then
                break
              fi
              test "$attempt" -lt 30
              sleep .2
            done
          done

          capture() {
            local label="$1"
            local port="$2"
            local path="$3"
            local size="$4"
            "$chrome_bin" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --hide-scrollbars \
              --force-device-scale-factor=1 \
              --window-size="$size" \
              --virtual-time-budget=3500 \
              --screenshot="$evidence/${label}.png" \
              "http://127.0.0.1:${port}${path}" >/dev/null 2>&1
            test -s "$evidence/${label}.png"
          }

          capture c3-cv-desktop 18101 / 1440,1000
          capture c4-cv-desktop 18102 / 1440,1000
          capture c3-cv-mobile 18101 / 390,844
          capture c4-cv-mobile 18102 / 390,844
          capture c3-smart-desktop 18101 /smarthome.html 1440,1000
          capture c4-smart-desktop 18102 /smarthome.html 1440,1000
          capture c3-smart-mobile 18101 /smarthome.html 390,844
          capture c4-smart-mobile 18102 /smarthome.html 390,844

          printf '=== screenshot sha256 ===\n' | tee "$evidence/screenshot-sha256.txt"
          sha256sum "$evidence"/*.png | tee -a "$evidence/screenshot-sha256.txt"

          cat >"${RUNNER_TEMP}/compare_png.py" <<'PY'
          from __future__ import annotations

          from pathlib import Path
          import struct
          import sys
          import zlib

          PNG_SIGNATURE = b'\x89PNG\r\n\x1a\n'

          def read_png(path: Path):
              raw = path.read_bytes()
              if not raw.startswith(PNG_SIGNATURE):
                  raise SystemExit(f'not PNG: {path}')
              pos = len(PNG_SIGNATURE)
              width = height = color_type = bit_depth = interlace = None
              compressed = bytearray()
              while pos < len(raw):
                  length = struct.unpack('>I', raw[pos:pos + 4])[0]
                  kind = raw[pos + 4:pos + 8]
                  data = raw[pos + 8:pos + 8 + length]
                  pos += 12 + length
                  if kind == b'IHDR':
                      width, height, bit_depth, color_type, _, _, interlace = struct.unpack(
                          '>IIBBBBB', data
                      )
                  elif kind == b'IDAT':
                      compressed.extend(data)
                  elif kind == b'IEND':
                      break
              if bit_depth != 8 or color_type not in (2, 6) or interlace != 0:
                  raise SystemExit(
                      f'unsupported Chrome PNG shape: {path} depth={bit_depth} '
                      f'color={color_type} interlace={interlace}'
                  )
              channels = 3 if color_type == 2 else 4
              stride = width * channels
              decoded = zlib.decompress(bytes(compressed))
              rows = []
              offset = 0
              previous = bytearray(stride)
              for _ in range(height):
                  filter_type = decoded[offset]
                  offset += 1
                  scan = bytearray(decoded[offset:offset + stride])
                  offset += stride
                  recon = bytearray(stride)
                  for index, value in enumerate(scan):
                      left = recon[index - channels] if index >= channels else 0
                      up = previous[index]
                      upper_left = previous[index - channels] if index >= channels else 0
                      if filter_type == 0:
                          predictor = 0
                      elif filter_type == 1:
                          predictor = left
                      elif filter_type == 2:
                          predictor = up
                      elif filter_type == 3:
                          predictor = (left + up) // 2
                      elif filter_type == 4:
                          p = left + up - upper_left
                          pa = abs(p - left)
                          pb = abs(p - up)
                          pc = abs(p - upper_left)
                          predictor = left if pa <= pb and pa <= pc else up if pb <= pc else upper_left
                      else:
                          raise SystemExit(f'unsupported PNG filter {filter_type}: {path}')
                      recon[index] = (value + predictor) & 0xff
                  rows.append(bytes(recon))
                  previous = recon
              return width, height, channels, b''.join(rows)

          baseline = Path(sys.argv[1])
          candidate = Path(sys.argv[2])
          label = sys.argv[3]
          aw, ah, ac, ap = read_png(baseline)
          bw, bh, bc, bp = read_png(candidate)
          if (aw, ah, ac) != (bw, bh, bc):
              raise SystemExit(
                  f'VISUAL_{label}=FAIL dimensions/channels baseline={(aw, ah, ac)} '
                  f'candidate={(bw, bh, bc)}'
              )

          differing_pixels = 0
          max_delta = 0
          channels_to_compare = min(ac, 3)
          for pixel in range(aw * ah):
              base = pixel * ac
              pixel_differs = False
              for channel in range(channels_to_compare):
                  delta = abs(ap[base + channel] - bp[base + channel])
                  if delta:
                      pixel_differs = True
                      max_delta = max(max_delta, delta)
              if pixel_differs:
                  differing_pixels += 1

          total_pixels = aw * ah
          ratio = differing_pixels / total_pixels
          allowed_ratio = 0.000015  # 0.0015%; only subpixel raster noise is tolerated.
          print(
              f'VISUAL_{label}_METRIC pixels={differing_pixels}/{total_pixels} '
              f'ratio={ratio:.8f} max_channel_delta={max_delta}'
          )
          if ratio > allowed_ratio or max_delta > 1:
              raise SystemExit(
                  f'VISUAL_{label}=FAIL ratio={ratio:.8f} max_channel_delta={max_delta}'
              )
          print(f'VISUAL_{label}=PASS')
          PY

          visual_status=0
          python3 "${RUNNER_TEMP}/compare_png.py" "$evidence/c3-cv-desktop.png" "$evidence/c4-cv-desktop.png" CV_DESKTOP \
            | tee "$evidence/cv-desktop-metric.txt" || visual_status=1
          python3 "${RUNNER_TEMP}/compare_png.py" "$evidence/c3-cv-mobile.png" "$evidence/c4-cv-mobile.png" CV_MOBILE \
            | tee "$evidence/cv-mobile-metric.txt" || visual_status=1
          python3 "${RUNNER_TEMP}/compare_png.py" "$evidence/c3-smart-desktop.png" "$evidence/c4-smart-desktop.png" SMART_DESKTOP \
            | tee "$evidence/smart-desktop-metric.txt" || visual_status=1
          python3 "${RUNNER_TEMP}/compare_png.py" "$evidence/c3-smart-mobile.png" "$evidence/c4-smart-mobile.png" SMART_MOBILE \
            | tee "$evidence/smart-mobile-metric.txt" || visual_status=1

          "$chrome_bin" --headless=new --no-sandbox --disable-gpu \
            --virtual-time-budget=3500 --print-to-pdf="$evidence/c3-cv-print.pdf" \
            --no-pdf-header-footer "http://127.0.0.1:18101/" >/dev/null 2>&1
          "$chrome_bin" --headless=new --no-sandbox --disable-gpu \
            --virtual-time-budget=3500 --print-to-pdf="$evidence/c4-cv-print.pdf" \
            --no-pdf-header-footer "http://127.0.0.1:18102/" >/dev/null 2>&1
          test -s "$evidence/c3-cv-print.pdf"
          test -s "$evidence/c4-cv-print.pdf"
          c3_pages="$(grep -a -o '/Type /Page\b' "$evidence/c3-cv-print.pdf" | wc -l | tr -d '[:space:]')"
          c4_pages="$(grep -a -o '/Type /Page\b' "$evidence/c4-cv-print.pdf" | wc -l | tr -d '[:space:]')"
          test "$c3_pages" -gt 0
          test "$c3_pages" = "$c4_pages"
          printf 'PRINT_PAGE_COUNT=PASS pages=%s\n' "$c3_pages" | tee "$evidence/print-summary.txt"

          printf 'BASELINE_SHA=%s\n' '88d20510e80b9dd7665cb19a24b14b3c9d30ee89' | tee "$evidence/summary.env"
          printf 'CANDIDATE_HEAD_SHA=%s\n' '${{ github.event.pull_request.head.sha }}' | tee -a "$evidence/summary.env"
          printf 'SCREENSHOT_PAIR_COUNT=4\n' | tee -a "$evidence/summary.env"
          printf 'PRINT_PAGE_COUNT=%s\n' "$c3_pages" | tee -a "$evidence/summary.env"
          printf 'DYNAMIC_NAV_STATE_NORMALIZED=true\n' | tee -a "$evidence/summary.env"
          printf 'MAX_PIXEL_DIFF_RATIO=0.000015\n' | tee -a "$evidence/summary.env"
          printf 'MAX_CHANNEL_DELTA=1\n' | tee -a "$evidence/summary.env"
          if [[ "$visual_status" -ne 0 ]]; then
            printf 'VISUAL_EQUIVALENCE=FAIL\n' | tee -a "$evidence/summary.env"
            exit 1
          fi
          printf 'VISUAL_EQUIVALENCE=PASS\n' | tee -a "$evidence/summary.env"

      - name: Upload C4 visual evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: c4-visual-equivalence-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/c4-visual-evidence
          if-no-files-found: error
          retention-days: 30
