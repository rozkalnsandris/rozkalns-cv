name: C4 visual equivalence

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/c4-visual-equivalence.yml

permissions:
  contents: read

jobs:
  compare:
    if: github.repository == 'rozkalnsandris/rozkalns-cv'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BASELINE_SHA: 88d20510e80b9dd7665cb19a24b14b3c9d30ee89
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out exact candidate and frozen C3 baseline
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" fetch --no-tags origin "$GITHUB_SHA" "$BASELINE_SHA"
          git checkout --detach "$GITHUB_SHA"
          git worktree add --detach "${RUNNER_TEMP}/c3-baseline" "$BASELINE_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C "${RUNNER_TEMP}/c3-baseline" rev-parse HEAD)" = "$BASELINE_SHA"

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Verify candidate generated output is current
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:frontend
          npm run check:frontend
          git diff --exit-code -- frontend-dist-manifest.json html/assets html/i18n html/index.html html/smarthome.html

      - name: Compare real Chromium desktop mobile and print output
        shell: bash
        run: |
          set -Eeuo pipefail
          chrome_bin=''
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then
              chrome_bin="$(command -v "$candidate")"
              break
            fi
          done
          test -n "$chrome_bin"

          evidence="${RUNNER_TEMP}/c4-visual-evidence"
          mkdir -p "$evidence"
          python3 -m http.server 18081 --bind 127.0.0.1 --directory "${RUNNER_TEMP}/c3-baseline/html" >"${RUNNER_TEMP}/c3-http.log" 2>&1 &
          baseline_pid=$!
          python3 -m http.server 18082 --bind 127.0.0.1 --directory "$PWD/html" >"${RUNNER_TEMP}/c4-http.log" 2>&1 &
          candidate_pid=$!
          cleanup() {
            kill "$baseline_pid" "$candidate_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for port in 18081 18082; do
            for attempt in $(seq 1 20); do
              if curl -fsS "http://127.0.0.1:${port}/" >/dev/null; then
                break
              fi
              test "$attempt" -lt 20
              sleep 0.25
            done
          done

          capture() {
            local port="$1" name="$2" width="$3" height="$4" path="$5"
            "$chrome_bin" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --hide-scrollbars \
              --force-device-scale-factor=1 \
              --virtual-time-budget=1500 \
              --window-size="${width},${height}" \
              --screenshot="${evidence}/${name}.png" \
              "http://127.0.0.1:${port}${path}" >/dev/null 2>&1
          }

          capture 18081 c3-cv-desktop 1440 1000 /
          capture 18082 c4-cv-desktop 1440 1000 /
          capture 18081 c3-cv-mobile 390 844 /
          capture 18082 c4-cv-mobile 390 844 /
          capture 18081 c3-smart-desktop 1440 1000 /smarthome.html
          capture 18082 c4-smart-desktop 1440 1000 /smarthome.html
          capture 18081 c3-smart-mobile 390 844 /smarthome.html
          capture 18082 c4-smart-mobile 390 844 /smarthome.html

          for pair in \
            'c3-cv-desktop c4-cv-desktop CV_DESKTOP' \
            'c3-cv-mobile c4-cv-mobile CV_MOBILE' \
            'c3-smart-desktop c4-smart-desktop SMART_DESKTOP' \
            'c3-smart-mobile c4-smart-mobile SMART_MOBILE'; do
            set -- $pair
            sha256sum "${evidence}/$1.png" "${evidence}/$2.png"
            cmp "${evidence}/$1.png" "${evidence}/$2.png"
            printf 'VISUAL_%s=PASS pixel-identical\n' "$3"
          done

          "$chrome_bin" --headless=new --no-sandbox --disable-gpu --print-to-pdf-no-header --print-to-pdf="${evidence}/c3-cv.pdf" "http://127.0.0.1:18081/" >/dev/null 2>&1
          "$chrome_bin" --headless=new --no-sandbox --disable-gpu --print-to-pdf-no-header --print-to-pdf="${evidence}/c4-cv.pdf" "http://127.0.0.1:18082/" >/dev/null 2>&1
          C4_EVIDENCE="$evidence" python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          root = Path(os.environ['C4_EVIDENCE'])
          counts = []
          for name in ('c3-cv.pdf', 'c4-cv.pdf'):
              data = (root / name).read_bytes()
              count = len(re.findall(rb'/Type\s*/Page\b', data))
              if count <= 0:
                  raise SystemExit(f'PRINT_PAGE_COUNT=FAIL name={name} count={count}')
              counts.append(count)
          if counts[0] != counts[1]:
              raise SystemExit(f'PRINT_PAGE_COUNT=FAIL c3={counts[0]} c4={counts[1]}')
          print(f'PRINT_PAGE_COUNT=PASS pages={counts[0]}')
          PY

          printf 'C4_VISUAL_EQUIVALENCE=PASS\n'
          printf 'evidence=%s\n' "$evidence" >> "$GITHUB_OUTPUT"
        id: visual

      - name: Upload visual evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: c4-visual-equivalence-${{ github.event.pull_request.head.sha }}
          path: ${{ steps.visual.outputs.evidence }}
          if-no-files-found: error
          retention-days: 30
