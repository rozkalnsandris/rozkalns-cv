name: Temporary #297 icon hotfix builder

on:
  push:
    branches:
      - fix/297-github-icon-size

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.18.0'
          package-manager-cache: false

      - name: Apply focused fix and validate
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          html_path = Path('frontend/index.html')
          html = html_path.read_text(encoding='utf-8')
          repos = [
              'hermes-tech',
              'RPi5_main',
              'hermes-deals',
              'rozkalns-control-center',
              'dashboard_RPi5',
              'home-assistant-config',
              'balcony-irrigation-esp32',
              'rozkalns-cv',
              'ops-workflows',
          ]
          for repo in repos:
              old = f'<a href=//github.com/rozkalnsandris/{repo}>{repo}</a>'
              new = f'<a class=skill-chip href=//github.com/rozkalnsandris/{repo}>{repo}</a>'
              if old not in html:
                  raise SystemExit(f'missing expected GitHub project anchor: {repo}')
              html = html.replace(old, new, 1)
          html_path.write_text(html, encoding='utf-8')

          smoke_path = Path('tests/browser-smoke.mjs')
          smoke = smoke_path.read_text(encoding='utf-8')
          old_eval = """          remaining: document.querySelector('#github-projects details')?.textContent || '',\n          collapsed: document.querySelector('#github-projects details')?.open === false\n        }))()`);"""
          new_eval = """          remaining: document.querySelector('#github-projects details')?.textContent || '',\n          collapsed: document.querySelector('#github-projects details')?.open === false,\n          iconSizes: [...document.querySelectorAll('#github-projects a svg')].map((icon) => {\n            const rect = icon.getBoundingClientRect();\n            return { width: rect.width, height: rect.height };\n          })\n        }))()`);"""
          if old_eval not in smoke:
              raise SystemExit('missing expected GitHub proof evaluation block')
          smoke = smoke.replace(old_eval, new_eval, 1)
          old_assert = """        assert.equal(githubProof.collapsed, true);"""
          new_assert = """        assert.equal(githubProof.collapsed, true);\n        assert.equal(githubProof.iconSizes.length, 9, `responsive ${viewport.width}px ${locale.label} GitHub icon count`);\n        assert.ok(\n          githubProof.iconSizes.every(({ width, height }) => width >= 12 && width <= 14 && height >= 12 && height <= 14),\n          `responsive ${viewport.width}px ${locale.label} GitHub icons must stay compact: ${JSON.stringify(githubProof.iconSizes)}`\n        );"""
          if old_assert not in smoke:
              raise SystemExit('missing expected GitHub collapsed assertion')
          smoke = smoke.replace(old_assert, new_assert, 1)
          smoke_path.write_text(smoke, encoding='utf-8')
          PY

          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:frontend
          first="${RUNNER_TEMP}/frontend-first.sha256"
          second="${RUNNER_TEMP}/frontend-second.sha256"
          {
            find html/assets html/i18n -type f -print0
            printf '%s\0' html/index.html html/smarthome.html frontend-dist-manifest.json
          } | sort -z | xargs -0 sha256sum > "$first"
          npm run build:frontend
          {
            find html/assets html/i18n -type f -print0
            printf '%s\0' html/index.html html/smarthome.html frontend-dist-manifest.json
          } | sort -z | xargs -0 sha256sum > "$second"
          cmp "$first" "$second"
          npm run check:frontend
          node --check tests/browser-smoke.mjs
          node --test tests/frontend.test.mjs

          chrome_bin=''
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then
              chrome_bin="$(command -v "$candidate")"
              break
            fi
          done
          test -n "$chrome_bin"
          CHROME_BIN="$chrome_bin" node tests/browser-smoke.mjs

          rm -rf node_modules
          rm -f .github/workflows/tmp-297-icon-hotfix.yml
          bash scripts/validate-source.sh "$PWD"

          git status --short
          git add frontend/index.html tests/browser-smoke.mjs html frontend-dist-manifest.json .github/workflows/tmp-297-icon-hotfix.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: constrain GitHub project icon sizes'
          git push origin HEAD:fix/297-github-icon-size
