name: C4 CSS source finalizer v2

on:
  push:
    branches:
      - refactor/80-consolidate-css-v01
    paths:
      - .github/workflows/c4-css-finalizer-v2.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.repository == 'rozkalnsandris/rozkalns-cv' && github.ref == 'refs/heads/refactor/80-consolidate-css-v01'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out exact C4 branch SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" fetch --no-tags origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Cut over to one authoritative CSS entry
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          root = Path('.')
          style = root / 'frontend/styles'
          old_main = style / 'main.css'
          old_extra = style / 'extra.css'
          main_bytes = old_main.read_bytes()
          extra_bytes = old_extra.read_bytes()

          index = root / 'frontend/index.html'
          text = index.read_text(encoding='utf-8')
          old = '  <link rel="stylesheet" href="./styles/main.css">\n  <link rel="stylesheet" href="./styles/extra.css">'
          if text.count(old) != 1:
              raise SystemExit('unexpected CV stylesheet source contract')
          index.write_text(text.replace(old, '  <link rel="stylesheet" href="./styles/index.css">'), encoding='utf-8')

          smart = root / 'frontend/smarthome.html'
          text = smart.read_text(encoding='utf-8')
          old = '  <link rel="stylesheet" href="./styles/main.css">'
          if text.count(old) != 1:
              raise SystemExit('unexpected Smart Home stylesheet source contract')
          smart.write_text(text.replace(old, '  <link rel="stylesheet" href="./styles/index.css">'), encoding='utf-8')

          validator = root / 'scripts/validate-source.sh'
          text = validator.read_text(encoding='utf-8')
          old = '    frontend/styles/main.css \\\n    frontend/styles/extra.css \\\n'
          new = '    frontend/styles/index.css \\\n    frontend/styles/tokens.css \\\n    frontend/styles/base.css \\\n    frontend/styles/layout.css \\\n    frontend/styles/components.css \\\n    frontend/styles/features/stats.css \\\n    frontend/styles/features/chat.css \\\n    frontend/styles/features/contact.css \\\n    frontend/styles/features/smarthome.css \\\n    frontend/styles/responsive.css \\\n    frontend/styles/print.css \\\n'
          if text.count(old) != 1:
              raise SystemExit('unexpected validator stylesheet block')
          text = text.replace(old, new)
          old = 'for retired in update.sh update_cv-1.sh cloudflared.env.example; do'
          new = 'for retired in update.sh update_cv-1.sh cloudflared.env.example frontend/styles/main.css frontend/styles/extra.css; do'
          if text.count(old) != 1:
              raise SystemExit('unexpected validator retired loop')
          validator.write_text(text.replace(old, new), encoding='utf-8')

          contract = root / 'tests/test_frontend_contract.py'
          text = contract.read_text(encoding='utf-8')
          old = 'SOURCE_CSS = ROOT / "frontend" / "styles" / "main.css"'
          new = '''STYLE_ROOT = ROOT / "frontend" / "styles"\nSOURCE_CSS_FILES = (\n    STYLE_ROOT / "tokens.css",\n    STYLE_ROOT / "base.css",\n    STYLE_ROOT / "layout.css",\n    STYLE_ROOT / "components.css",\n    STYLE_ROOT / "features" / "stats.css",\n    STYLE_ROOT / "features" / "chat.css",\n    STYLE_ROOT / "features" / "contact.css",\n    STYLE_ROOT / "features" / "smarthome.css",\n    STYLE_ROOT / "responsive.css",\n    STYLE_ROOT / "print.css",\n)'''
          if text.count(old) != 1:
              raise SystemExit('unexpected SOURCE_CSS constant')
          text = text.replace(old, new)
          old = '        css = SOURCE_CSS.read_text(encoding="utf-8")'
          new = '        css = "\\n".join(path.read_text(encoding="utf-8") for path in SOURCE_CSS_FILES)'
          if text.count(old) != 1:
              raise SystemExit('unexpected source CSS read')
          text = text.replace(old, new)
          old = '        self.assertGreaterEqual(len(assets), 8)'
          new = '        self.assertGreaterEqual(len(assets), 7)\n        css_assets = [path for path in assets if path.endswith(".css")]\n        self.assertEqual(len(css_assets), 1, css_assets)'
          if text.count(old) != 1:
              raise SystemExit('unexpected asset-count contract')
          contract.write_text(text.replace(old, new), encoding='utf-8')

          tokens = style / 'tokens.css'
          text = tokens.read_text(encoding='utf-8')
          needle = '  --section-gap: clamp(46px,6.5vw,68px);\n'
          additions = '  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 20px;\n  --space-6: 24px;\n  --radius-sm: 7px;\n  --radius-md: 10px;\n  --radius-lg: 12px;\n  --radius-xl: 16px;\n'
          if additions not in text:
              if text.count(needle) != 1:
                  raise SystemExit('unexpected token insertion point')
              tokens.write_text(text.replace(needle, needle + additions), encoding='utf-8')

          docs = root / 'docs'
          docs.mkdir(exist_ok=True)
          audit = docs / 'CSS_C4_AUDIT.md'
          audit.write_text(f'''# Gate C4 CSS source audit\n\n## Frozen C3 baseline\n\n- `frontend/styles/main.css`: {len(main_bytes.splitlines())} lines, SHA-256 `{sha256(main_bytes).hexdigest()}`.\n- `frontend/styles/extra.css`: {len(extra_bytes.splitlines())} lines, SHA-256 `{sha256(extra_bytes).hexdigest()}`.\n- CV source loaded `main.css` followed by `extra.css`; Smart Home loaded only `main.css`.\n\n## Selector overlap\n\nThe only intentional historical override between the two source files is `.skill-chip::before`: `main.css` supplied the legacy diamond marker and `extra.css` suppressed it after SVG skill icons were introduced. C4 removes the pseudo-element rule entirely and keeps `.skill-chip svg` as the authoritative component behavior.\n\nThe remaining `extra.css` rules are contact-verification/action-icon feature rules plus its mobile/print conditions. They move to responsibility-owned modules instead of remaining a later patch layer.\n\n## C4 ownership\n\n- `tokens.css`: visual tokens.\n- `base.css`: reset, document defaults, focus, reduced motion.\n- `layout.css`: page/sidebar/section layout.\n- `components.css`: shared UI and CV content components.\n- `features/stats.css`: live statistics.\n- `features/chat.css`: assistant dialog.\n- `features/contact.css`: Turnstile/contact reveal.\n- `features/smarthome.css`: Smart Home demo.\n- `responsive.css`: all max-width breakpoints (760px, 560px, 620px).\n- `print.css`: all print-only behavior.\n- `index.css`: the single ordered source entry consumed by both HTML entry points.\n''', encoding='utf-8')

          old_main.unlink()
          old_extra.unlink()
          PY

          python3 -m unittest tests.test_css_source_contract tests.test_frontend_contract -v

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm

      - name: Rebuild deterministic frontend twice
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:frontend
          cp -a html "${RUNNER_TEMP}/c4-first-html"
          cp frontend-dist-manifest.json "${RUNNER_TEMP}/c4-first-manifest.json"
          npm run build:frontend
          diff -ruN "${RUNNER_TEMP}/c4-first-html" html
          cmp "${RUNNER_TEMP}/c4-first-manifest.json" frontend-dist-manifest.json
          npm run check:frontend
          node --test tests/frontend.test.mjs
          python3 -m unittest tests.test_css_source_contract tests.test_frontend_contract -v
          bash scripts/validate-source.sh .

      - name: Commit C4 source and generated dist
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git add -- frontend/index.html frontend/smarthome.html frontend/styles scripts/validate-source.sh tests/test_frontend_contract.py tests/test_css_source_contract.py docs/CSS_C4_AUDIT.md frontend-dist-manifest.json html/index.html html/smarthome.html html/assets html/i18n
          staged="$(git diff --cached --name-only)"
          test -n "$staged"
          printf '%s\n' "$staged"
          if grep -E '^html/.*\.pdf$' <<<"$staged"; then
            echo 'PDF files changed unexpectedly' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: consolidate authoritative CSS source'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" push origin HEAD:refs/heads/refactor/80-consolidate-css-v01
