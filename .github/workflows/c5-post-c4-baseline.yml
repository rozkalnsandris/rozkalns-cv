name: C5 post-C4 browser baseline

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/c5-post-c4-baseline.yml

permissions:
  contents: read

jobs:
  measure:
    if: >-
      github.repository == 'rozkalnsandris/rozkalns-cv' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'perf/82-reduce-initial-background-work-v01'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      C4_SHA: c01a2beea0df8050a6e192504428c17574a852af
      C0_TOOL_SHA: f685725afd31b8076e941d9dfb4a6a358b87d82b
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Verify production is exact C4
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          req = urllib.request.Request(
              'https://api.github.com/repos/rozkalnsandris/rozkalns-cv/branches/main',
              headers={
                  'Accept':'application/vnd.github+json',
                  'Authorization':f"Bearer {os.environ['GH_TOKEN']}",
                  'X-GitHub-Api-Version':'2022-11-28',
                  'User-Agent':'rozkalns-cv-c5-baseline',
              },
          )
          with urllib.request.urlopen(req, timeout=20) as r:
              sha = json.load(r)['commit']['sha']
          if sha != os.environ['C4_SHA']:
              raise SystemExit(f'CURRENT_MAIN_CHANGED expected={os.environ["C4_SHA"]} actual={sha}')
          print(f'C5_BASELINE_MAIN={sha}')
          PY

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Fetch frozen C0 browser measurement tool
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64, json, os, urllib.parse, urllib.request
          sha = os.environ['C0_TOOL_SHA']
          ref = urllib.parse.quote(sha, safe='')
          url = f'https://api.github.com/repos/rozkalnsandris/rozkalns-cv/contents/tools/c0-browser-baseline.mjs?ref={ref}'
          req = urllib.request.Request(url, headers={
              'Accept':'application/vnd.github+json',
              'Authorization':f"Bearer {os.environ['GH_TOKEN']}",
              'X-GitHub-Api-Version':'2022-11-28',
              'User-Agent':'rozkalns-cv-c5-baseline',
          })
          with urllib.request.urlopen(req, timeout=20) as r:
              payload = json.load(r)
          data = base64.b64decode(payload['content'])
          open('/tmp/c5-browser-baseline.mjs','wb').write(data)
          print(f'C5_TOOL_BLOB={payload["sha"]}')
          PY

      - name: Capture three independent post-C4 runs
        id: capture
        shell: bash
        run: |
          set -Eeuo pipefail
          chrome=''
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then
              chrome="$(command -v "$candidate")"
              break
            fi
          done
          test -n "$chrome"
          root="${RUNNER_TEMP}/c5-post-c4"
          mkdir -p "$root"
          for n in 1 2 3; do
            node /tmp/c5-browser-baseline.mjs \
              --output "$root/run-$n" \
              --url https://rozkalns.net/ \
              --chrome "$chrome" \
              --sha "$C4_SHA" | tee "$root/run-$n.log"
          done
          printf 'evidence=%s\n' "$root" >> "$GITHUB_OUTPUT"

      - name: Summarize median request bytes and coverage
        shell: bash
        env:
          EVIDENCE: ${{ steps.capture.outputs.evidence }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os, statistics
          from pathlib import Path

          root = Path(os.environ['EVIDENCE'])
          runs = [json.loads((root/f'run-{n}'/'browser-baseline.json').read_text()) for n in (1,2,3)]
          def med(path):
              vals=[]
              for r in runs:
                  cur=r
                  for key in path: cur=cur[key]
                  vals.append(cur)
              return statistics.median(vals), vals
          rows=[]
          for vp in ('desktop','phone'):
              for phase in ('cold','warm'):
                  b,bvals=med((vp,phase,'network','transferredBytes'))
                  q,qvals=med((vp,phase,'network','requests'))
                  rows.append((vp,phase,int(b),bvals,int(q),qvals))
          summary={
              'schema':1,
              'sha':os.environ['C4_SHA'],
              'runs':3,
              'network':{},
              'coverage':{},
              'c0':{
                  'desktop':{'coldBytes':72028,'warmBytes':1968},
                  'phone':{'coldBytes':71516,'warmBytes':1963},
              },
          }
          for vp,phase,b,bvals,q,qvals in rows:
              summary['network'].setdefault(vp,{})[phase]={'medianBytes':b,'bytes':bvals,'medianRequests':q,'requests':qvals}
              print(f'C5_{vp.upper()}_{phase.upper()}_BYTES_MEDIAN={b} runs={bvals}')
              print(f'C5_{vp.upper()}_{phase.upper()}_REQUESTS_MEDIAN={q} runs={qvals}')
          for vp in ('desktop','phone'):
              by={}
              for r in runs:
                  for row in r[vp]['coverage']['javascript']:
                      by.setdefault(row['url'],[]).append(row['percent'])
              summary['coverage'][vp]={url:statistics.median(vals) for url,vals in sorted(by.items()) if len(vals)==3}
              for url,pct in summary['coverage'][vp].items():
                  print(f'C5_{vp.upper()}_JS_COVERAGE={pct:.2f}% url={url}')
              cold=summary['network'][vp]['cold']['medianBytes']
              base=summary['c0'][vp]['coldBytes']
              print(f'C5_{vp.upper()}_COLD_VS_C0={cold-base:+d}B ({(cold/base-1)*100:+.2f}%)')
          (root/'summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          PY

      - name: Upload post-C4 baseline evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: c5-post-c4-baseline-${{ github.event.pull_request.head.sha }}
          path: ${{ steps.capture.outputs.evidence }}
          if-no-files-found: error
          retention-days: 30
