name: Issue 396 deterministic dist materializer

on:
  push:
    branches:
      - fix/396-localized-chat-placeholder

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact workflow SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch --no-tags origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up pinned Node.js frontend toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false

      - name: Materialize exact issue 396 files and remove temporary workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:frontend
          python3 -m unittest tests.test_localized_pages
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/browser-smoke.mjs')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  '''    await cdp.send("Network.setBlockedURLs", {\n      urls: ["*://static.cloudflareinsights.com/*", "*://cloudflareinsights.com/*"]\n    });\n\n    await cdp.navigate(`${baseUrl}/en/`);''',
                  '''    await cdp.send("Network.setBlockedURLs", {\n      urls: [\n        "*://static.cloudflareinsights.com/*",\n        "*://cloudflareinsights.com/*",\n        "*/assets/app.*.mjs"\n      ]\n    });\n    await cdp.navigate(`${baseUrl}/de/`);\n    assert.deepEqual(\n      await cdp.evaluate(`(() => ({\n        placeholder: document.querySelector('#chatInput')?.getAttribute('placeholder'),\n        binding: document.querySelector('#chatInput')?.getAttribute('data-i18n-placeholder')\n      }))()`),\n      { placeholder: "Frage zu Andris' Erfahrung", binding: "chat_input" }\n    );\n\n    await cdp.send("Network.setBlockedURLs", {\n      urls: ["*://static.cloudflareinsights.com/*", "*://cloudflareinsights.com/*"]\n    });\n    await cdp.navigate(`${baseUrl}/en/`);'''
              ),
              (
                  '''    assert.match(initialContract.privacy, /raw IP addresses are not stored/i);\n    const initialLanguageState = await cdp.evaluate(`(() => ({''',
                  '''    assert.match(initialContract.privacy, /raw IP addresses are not stored/i);\n    assert.deepEqual(\n      await cdp.evaluate(`(() => ({\n        placeholder: document.querySelector('#chatInput')?.getAttribute('placeholder'),\n        binding: document.querySelector('#chatInput')?.getAttribute('data-i18n-placeholder')\n      }))()`),\n      { placeholder: "Ask about Andris's experience", binding: "chat_input" }\n    );\n    const initialLanguageState = await cdp.evaluate(`(() => ({'''
              ),
              (
                  '''    assert.equal(\n      await cdp.evaluate(`document.querySelector('#profileLocation')?.textContent`),\n      "Dortmund, Deutschland"\n    );\n\n    const latvianLoaded''',
                  '''    assert.equal(\n      await cdp.evaluate(`document.querySelector('#profileLocation')?.textContent`),\n      "Dortmund, Deutschland"\n    );\n    assert.deepEqual(\n      await cdp.evaluate(`(() => ({\n        placeholder: document.querySelector('#chatInput')?.getAttribute('placeholder'),\n        binding: document.querySelector('#chatInput')?.getAttribute('data-i18n-placeholder')\n      }))()`),\n      { placeholder: "Frage zu Andris' Erfahrung", binding: "chat_input" }\n    );\n\n    const latvianLoaded'''
              ),
              (
                  '''    assert.equal(\n      await cdp.evaluate(`document.querySelector('#profileLocation')?.textContent`),\n      "Dortmund, Vācija"\n    );\n    assert.deepEqual(''',
                  '''    assert.equal(\n      await cdp.evaluate(`document.querySelector('#profileLocation')?.textContent`),\n      "Dortmund, Vācija"\n    );\n    assert.deepEqual(\n      await cdp.evaluate(`(() => ({\n        placeholder: document.querySelector('#chatInput')?.getAttribute('placeholder'),\n        binding: document.querySelector('#chatInput')?.getAttribute('data-i18n-placeholder')\n      }))()`),\n      { placeholder: "Jautājums par Andra pieredzi", binding: "chat_input" }\n    );\n    assert.deepEqual('''
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one browser-smoke anchor, found {count}: {old[:80]!r}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY

          node --check tests/browser-smoke.mjs
          git add -- \
            frontend-dist-manifest.json \
            html/en/index.html \
            html/de/index.html \
            html/lv/index.html \
            html/sitemap.xml \
            tests/browser-smoke.mjs
          git rm -- .github/workflows/issue396-materialize.yml

          expected="$(printf '%s\n' \
            '.github/workflows/issue396-materialize.yml' \
            'frontend-dist-manifest.json' \
            'html/de/index.html' \
            'html/en/index.html' \
            'html/lv/index.html' \
            'tests/browser-smoke.mjs' | sort)"
          actual="$(git diff --cached --name-only | sort)"
          printf '%s\n' "$actual"
          test "$actual" = "$expected"
          git diff --cached --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: materialize localized placeholder fix (#396)'

          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          remote_sha="$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            ls-remote origin refs/heads/fix/396-localized-chat-placeholder | awk '{print $1}')"
          test "$remote_sha" = "$GITHUB_SHA"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            push origin HEAD:refs/heads/fix/396-localized-chat-placeholder
