title = "rozkalns-cv secret scanning"
minVersion = "8.30.0"

[extend]
useDefault = true

[[rules]]
id = "cloudflare-tunnel-token"
description = "Cloudflare tunnel token assigned in configuration"
regex = '''(?i)(?:CF_TUNNEL_TOKEN|TUNNEL_TOKEN)[\s:=\"']+([A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,})'''
secretGroup = 1
keywords = ["tunnel_token", "cf_tunnel_token"]

[[rules]]
id = "database-url-password"
description = "Password embedded in a database connection URL"
regex = '''(?i)(?:postgres(?:ql)?|mysql|mariadb|redis)://[^:\s/@]+:([^@\s/]{8,})@'''
secretGroup = 1
keywords = ["postgres://", "postgresql://", "mysql://", "mariadb://", "redis://"]

[[rules]]
id = "webhook-signing-secret"
description = "Webhook or signing secret assigned in configuration"
regex = '''(?i)(?:WEBHOOK_SECRET|SIGNING_SECRET)[\s:=\"']+([A-Za-z0-9_./+=-]{16,})'''
secretGroup = 1
keywords = ["webhook_secret", "signing_secret"]

[allowlist]
description = "Only explicit non-secret placeholders used by tests and examples"
regexTarget = "match"
regexes = [
  '''ci-placeholder-not-a-secret''',
  '''replace-with-a-random-secret''',
  '''test-client-secret''',
  '''test-llm-key'''
]
