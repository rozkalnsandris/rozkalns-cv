name: rozkalns-cv

services:
  cv:
    image: ghcr.io/rozkalnsandris/rozkalns-cv:production
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 192
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
    env_file:
      - ${CVBOT_ENV_FILE:-../../bot/.env}
    environment:
      ASSISTANT_DB_PATH: /app/data/assistant.sqlite3
      TRUSTED_PROXY_CIDRS: 127.0.0.1/32
    volumes:
      - type: bind
        source: ${CVBOT_DATA_DIR:-../../bot/data}
        target: /app/data
        bind:
          create_host_path: false
    ports:
      - 127.0.0.1:8088:8080
    networks:
      default:
        ipv4_address: 172.19.0.10

networks:
  default:
    name: cv_default
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.19.0.0/16
          gateway: 172.19.0.1
