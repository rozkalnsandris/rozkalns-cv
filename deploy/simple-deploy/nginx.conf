worker_processes auto;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    sendfile on;

    # Origin quota is independent of forwarded headers and Docker gateway.
    # Authentic per-visitor IP enforcement belongs at Cloudflare's edge,
    # keyed by ip.src; its verified activation is a separate LIVE gate.
    limit_req_zone $server_name zone=cv_contact_global:1m rate=60r/m;

    client_body_temp_path /tmp/nginx/client_temp;
    proxy_temp_path /tmp/nginx/proxy_temp;
    fastcgi_temp_path /tmp/nginx/fastcgi_temp;
    uwsgi_temp_path /tmp/nginx/uwsgi_temp;
    scgi_temp_path /tmp/nginx/scgi_temp;

    server {
        listen 8080;
        server_name _;
        root /srv/cv/html;
        index index.html;

        # A Docker bridge gateway is not proof of Cloudflare provenance.
        # Do NOT replace $remote_addr using CF-Connecting-IP, X-Real-IP
        # or X-Forwarded-For; any local loopback client could forge them.

        add_header_inherit merge;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'nonce-$request_id' https://static.cloudflareinsights.com/beacon.min.js https://challenges.cloudflare.com; script-src-attr 'none'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src https://challenges.cloudflare.com;" always;

        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

        # Disable CV Assistant only. Keep contact and health endpoints.
        location = /api/chat { return 404; }
        location = /api/chat-config { return 404; }
        location = /api/chat-admission { return 404; }

        # Protect the ONLY public contact-reveal entrypoint before Siteverify.
        # Both quotas apply, including when source IP collapses to one proxy.
        location = /api/contact-reveal {
            limit_req zone=cv_contact_global burst=15 nodelay;
            limit_req_status 429;
            proxy_pass http://127.0.0.1:5000/contact-reveal;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header CF-Connecting-IP "";
            proxy_read_timeout 120s;
            proxy_buffering off;
            proxy_cache off;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:5000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header CF-Connecting-IP "";
            proxy_read_timeout 120s;
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
        }

        location = / {
            expires -1;
            if ($host = rozkalns.net) {
                return 308 https://rozkalns.net/en/$is_args$args;
            }
            return 308 /en/$is_args$args;
        }

        location ~* \.html$ {
            expires -1;
            try_files $uri =404;
        }

        location = /stats.json {
            expires -1;
            try_files $uri =404;
        }

        location ~* "^/assets/.+\.[0-9a-f]{12}\.mjs$" {
            types {
                text/javascript mjs;
            }
            default_type text/javascript;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        location ~* "^/(?:assets|i18n)/.+\.[0-9a-f]{12}\.(?:css|json|webp)$" {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        location = /favicon.ico {
            return 308 /favicon.svg;
        }

        location ~ ^/cv(?:-de|-lv)?\.pdf$ {
            expires 1h;
            add_header X-Robots-Tag "noindex, nofollow" always;
            try_files $uri =404;
        }

        location ~* \.(?:png|jpg|jpeg|svg|woff2?|pdf)$ {
            expires 1h;
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
