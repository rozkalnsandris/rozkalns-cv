server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    set_real_ip_from 172.19.0.0/16;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;

    add_header_inherit merge;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'nonce-$request_id' https://static.cloudflareinsights.com/beacon.min.js https://challenges.cloudflare.com; script-src-attr 'none'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src https://challenges.cloudflare.com;" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    location /api/ {
        proxy_pass http://cvbot:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    location = / {
        expires -1;
        if ($host = rozkalns.net) {
            return 308 https://rozkalns.net/en/$is_args$args;
        }
        return 308 /en/$is_args$args;
    }

    location ~* \.html$ {
        expires -1;
        try_files $uri =404;
    }

    location = /stats.json {
        expires -1;
        try_files $uri =404;
    }

    location ~* "^/assets/.+\.[0-9a-f]{12}\.mjs$" {
        types {
            text/javascript mjs;
        }
        default_type text/javascript;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~* "^/(?:assets|i18n)/.+\.[0-9a-f]{12}\.(?:css|json|webp)$" {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /favicon.ico {
        return 308 /favicon.svg;
    }

    location ~ ^/cv(?:-de|-lv)?\.pdf$ {
        expires 1h;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    location ~* \.(?:png|jpg|jpeg|svg|woff2?|pdf)$ {
        expires 1h;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
